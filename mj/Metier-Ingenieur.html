<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Métier d'Ingénieur</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#c2452a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1280px;margin:0 auto;padding:1rem .9rem 4rem}
  .grp{margin:0 0 1.4rem}
  .grp>h2{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.6rem 0 .5rem}
  .grp>h2:focus{outline:none;background:#0e0c0b}
  .gnote{font-size:.82rem;color:var(--dim);margin:.1rem 0 .8rem;padding:.5rem .7rem;
       background:var(--panel);border-left:2px solid var(--line);border-radius:0 3px 3px 0}
  .gnote:focus{outline:none;background:#0e0c0b}
  .gnote:empty,.grp>h2:empty{display:none}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td.c{text-align:center;white-space:nowrap}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .grp>h2{color:#8B1A1A;border-color:#8B1A1A}
    .gnote{background:#faf7f1;color:#5a524a}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<script>
var DEFAUT = {"intro": "Avertissement. Les armes, munitions et machines de siège citées ici suivent désormais le supplément Up in Arms, qui fait autorité sur le livre de base. Les colonnes Échelon, DR et Pièces restent maison. Les profils de structures et les règles de dégâts qui les accompagnent sont également officiels, tirés du chapitre XI du supplément. Ce document est presque entièrement maison. Le livre décrit la carrière mais ne dit pas ce qu'un ingénieur peut concrètement produire, ni à quel prix, ni en combien de temps. Tout ce qui suit est un cadre de jeu proposé pour combler ce vide, aligné sur les compétences et les prix officiels. Les noms d'échelons sont donnés dans l'ordre du livre mais à vérifier dans ta traduction. Monnaie : CO couronne d'or, Pa pistole d'argent, Sc sou de cuivre. 1 CO = 20 Pa, 1 Pa = 12 Sc.", "groups": [{"title": "", "note": "", "sections": [{"kind": "texte", "title": "Ce que le métier est réellement", "note": "", "items": ["Un ingénieur de l'Empire n'est pas un inventeur libre. Il sort de l'École impériale d'ingénierie, il appartient à une guilde, et la poudre noire est un produit d'État. Trois conséquences pour un personnage joueur, et ce sont les trois moteurs d'histoire du métier :", "La licence. Fabriquer une arme à poudre sans patente est un délit, la vendre est un crime. Un ingénieur sans papiers travaille pour des gens qui n'en demandent pas.", "Les pièces. Un ressort correct, un canon foré droit, une platine qui ne casse pas : rien de tout cela ne se trouve dans un village. Tout ce qui est Rare ou Exotique se commande à Nuln ou à Altdorf, et s'attend des semaines.", "La réputation. La guilde consigne les travaux. Un engin qui explose au visage d'un client revient dans le dossier de son auteur, et un maître ingénieur radié n'est plus qu'un forgeron bavard.", "Compétences employées dans tout ce document : Métier (Ingénieur) pour construire et réparer, Savoir (Ingénierie) pour comprendre, identifier et concevoir, Projectiles (Ingénierie) pour tirer, Outils de profession comme matériel obligatoire. Sans outils, tous les tests subissent au minimum −20, et rien de Complexe n'est possible."], "foot": ""}, {"kind": "texte", "title": "Les quatre choses qu'un ingénieur fait à la table", "note": "", "items": ["Entretenir et réparer. Un test simple de Métier (Ingénieur). Sans entretien après usage, une arme à poudre gagne le défaut Encrassante puis, au deuxième oubli, Dangereuse.", "Fabriquer. Test étendu de Métier (Ingénieur), un jet par période de travail, jusqu'à obtenir le nombre de DR requis par la complexité de l'objet. Matières premières : la moitié du prix indiqué, perdues en cas d'abandon.", "Modifier. Améliorer un objet existant, avec la même mécanique mais un seul DR de moins. Une arme ne peut porter que deux modifications, et chacune apporte un défaut avec son atout.", "Improviser. Bricoler en pleine scène, un seul jet, avec ce qu'on a sous la main. Toujours possible, toujours pénalisé de −20, et l'objet obtenu est Fragile et Dangereuse. C'est ce que les joueurs feront le plus souvent, et c'est très bien."], "foot": ""}, {"kind": "table", "title": "Complexité : le seul curseur à retenir", "note": "", "cols": ["Complexité", "DR requis", "Par tentative", "Pièces", "Exemples"], "rows": [{"c": ["1 · Simple", "2", "1 heure", "Commune", "Mèche lente, cartouches, réparation de crosse, piège à mâchoires"], "off": false}, {"c": ["2 · Soignée", "4", "1 jour", "Commune", "Pistolet, arbalète, serrure de sûreté, treuil, longue-vue simple"], "off": false}, {"c": ["3 · Précise", "6", "3 jours", "Limitée", "Arquebuse, espingole, mécanisme d'horlogerie, grappin à ressort, mine à pression"], "off": false}, {"c": ["4 · Complexe", "8", "1 semaine", "Rare", "Arme à répétition, long fusil de Hochland, baliste, engin unique"], "off": false}, {"c": ["5 · Exceptionnelle", "12", "1 mois", "Exotique", "Canon, mortier, canon à salves Helblaster, prototype à vapeur"], "off": false}], "foot": "Les armes à poudre noire, les arbalètes et les munitions spéciales portent Ingénieur dans la colonne Métier du document Armes et Munitions, avec leur complexité. Les carreaux explosifs et le feu de Nuln y figurent en complexité 5."}, {"kind": "table", "title": "Ce qui est réalisable, échelon par échelon", "note": "Les quatre échelons sont les quatre niveaux de la carrière Ingénieur du livre de base, avec leur Statut officiel. Ce que chaque échelon autorise est maison.", "cols": ["Échelon", "Carrière et Statut", "Travaux reconnus", "Autorisations et limites"], "rows": [{"c": ["1", "Étudiant Ingénieur · Bronze 4", "Entretien, réparations de complexité 1 et 2, fabrication de munitions et de poudre, mèches, pièges simples, outillage", "Travaille sous la responsabilité d'un maître. Ne peut pas signer un travail ni acheter de poudre en quantité"], "off": false}, {"c": ["2", "Ingénieur · Argent 2", "Fabrication jusqu'à la complexité 3, modification d'armes, mécanismes, serrurerie, ouvrages de siège légers", "Patente personnelle. Peut acheter de la poudre, tenir un atelier, prendre un apprenti"], "off": false}, {"c": ["3", "Maître Ingénieur · Argent 4", "Complexité 4, armes à répétition, machines de guerre légères, conception d'engins originaux", "Peut faire homologuer un engin nouveau par la guilde, et vendre à l'armée"], "off": false}, {"c": ["4", "Ingénieur Agréé · Or 2", "Complexité 5, artillerie lourde, prototypes, direction d'un chantier ou d'une batterie", "Commande d'État, accès aux fonderies de Nuln, responsabilité pénale en cas de désastre"], "off": false}], "foot": ""}, {"kind": "texte", "title": "Les talents officiels qui pèsent sur ces tables", "note": "Rappel des règles du livre de base, non modifiées. Tout le reste de ce document est maison.", "items": ["Métier suffit, le plus souvent. Le livre de base est explicite : posséder la compétence Métier permet d'accomplir automatiquement les tâches de sa profession, dès lors qu'on dispose des outils et des ressources. Le test n'est exigé que si l'on travaille vite, si les conditions sont défavorables, ou si l'on vise une pièce de grande qualité. Les tables de complexité de ce guide valent pour ces cas-là, pas pour le travail ordinaire d'une journée.", "Travailleur qualifié (Ingénierie). Talent officiel. Retire son niveau au DR exigé par tout test étendu de la compétence Métier concernée. Un ingénieur de niveau 2 dans ce talent ramène une complexité 4, qui exige 8 DR, à 6 DR. C'est le levier officiel le plus puissant sur les tables de ce guide, et il s'applique avant tout autre modificateur.", "Maître artisan (Métier). Talent officiel. Ajoute la compétence Métier correspondante à toute carrière entamée, ou la rend moins chère de 5 PX par Augmentation si elle y figure déjà. Il agit sur la progression du personnage, jamais sur un test.", "Où on les gagne. La carrière Ingénieur donne Maître artisan (Ingénieur) au deuxième niveau, Travailleur qualifié (Ingénierie) au troisième, et Savant (Ingénierie) au quatrième."], "foot": ""}, {"kind": "table", "title": "Modifications d'armes", "note": "Section maison, mais désormais calée sur les atouts officiels d'Up in Arms. Prix indiqué en supplément du prix de l'arme, main-d'œuvre comprise si le personnage ne le fait pas lui-même. Maximum deux modifications par arme, et chacune impose sa contrepartie. Plusieurs de ces modifications produisent des armes qui existent déjà en catalogue officiel : dans ce cas, achète plutôt que de modifier, c'est moins cher et moins risqué.", "cols": ["Modification", "Éch.", "Coût", "DR", "Pièces", "Effet et contrepartie"], "rows": [{"c": ["Canon rayé", "3", "8 CO", "6", "Rare", "L'arme gagne Précise et Pointue. Recharge augmentée de 1 : la balle force dans les rayures. C'est le principe du long fusil de Hochland"], "off": false}, {"c": ["Platine améliorée", "2", "5 CO", "4", "Limitée", "Recharge réduite de 1. L'entretien devient obligatoire après chaque usage, sinon Dangereuse"], "off": false}, {"c": ["Second canon", "3", "10 CO", "6", "Rare", "Gagne À répétition 2. Enc +1 et Recharge doublée pour tout recharger. Équivaut à une arquebuse à deux canons, en catalogue à 7 CO"], "off": false}, {"c": ["Crosse allégée", "2", "2 CO", "4", "Commune", "Enc réduit de 1. L'arme gagne Fragile : elle casse sur une Maladresse"], "off": false}, {"c": ["Hausse et guidon", "2", "3 CO", "4", "Limitée", "+10 au test quand on consacre une Action à Viser. Sans effet en tir précipité"], "off": false}, {"c": ["Baïonnette à douille", "1", "1 CO", "2", "Commune", "L'arme sert d'arme d'hast, dégâts +BF+3, Empaleuse. Impossible de tirer tant qu'elle est montée"], "off": false}, {"c": ["Cric intégré", "3", "6 CO", "6", "Rare", "Arbalètes : Recharge réduite de 1 et dégâts +1. Enc +1, l'arme devient Imprécise"], "off": false}, {"c": ["Magasin à gravité", "4", "15 CO", "8", "Rare", "Arbalètes : gagne À répétition 4. Doit être tenue verticale, sinon le carreau ne descend pas"], "off": false}, {"c": ["Chambre renforcée", "3", "7 CO", "6", "Rare", "Armes à poudre : perd Dangereuse. Enc +1 et prix de revente doublé, les acheteurs se battent pour ça"], "off": false}, {"c": ["Crosse pliante", "3", "9 CO", "6", "Rare", "Repérer l'arme sous un vêtement demande un test de Perception Difficile (−20), Très difficile (−30) pour qui ne connaît pas la poudre noire. Dégâts −1 et une action pour la déployer"], "off": false}, {"c": ["Écouvillon d'atelier", "1", "15 Pa", "2", "Commune", "Nécessaire d'entretien complet. Annule Encrassante en dix minutes de travail"], "off": false}, {"c": ["Gravure de guilde", "2", "3 CO", "4", "Limitée", "Aucun effet mécanique. Prouve l'origine légale de l'arme, ce qui règle bien des contrôles"], "off": false}, {"c": ["Culasse à mèche remplacée par une platine à silex", "3", "6 CO", "6", "Rare", "Supprime l'Action d'allumage des armes à mèche et Recharge réduite de 1. Les pièces se commandent à Nuln"], "off": false}, {"c": ["Chargeur à cartouches papier", "2", "2 CO", "4", "Limitée", "+10 aux tests de rechargement, cumulable avec la munition du même nom. Une pluie franche ruine le contenu"], "off": false}], "foot": ""}, {"kind": "table", "title": "Engins, outils et pièges", "note": "", "cols": ["Objet", "Éch.", "Coût", "DR", "Pièces", "Effet"], "rows": [{"c": ["Piège à mâchoires", "1", "1 CO", "2", "Commune", "Dégâts 9 à la jambe, état Empêtré de Force 40. Se pose en une action, se repère à un test de Perception"], "off": false}, {"c": ["Mine à pression", "3", "8 CO", "6", "Limitée", "Dégâts +12, Explosion 3, Dangereuse à la pose. Une action et un test de Métier pour l'armer"], "off": false}, {"c": ["Charge de sape", "3", "12 CO", "6", "Rare", "Ouvre une brèche dans un mur de pierre. Mèche de 1d10 rounds, Explosion 5 pour qui reste trop près"], "off": false}, {"c": ["Grappin à ressort", "3", "10 CO", "6", "Limitée", "Envoie un grappin à vingt mètres. +20 aux tests d'Escalade sur la corde ainsi fixée"], "off": false}, {"c": ["Lanterne à réflecteur", "2", "4 CO", "4", "Limitée", "Faisceau dirigé de trente mètres, invisible depuis l'arrière. Enc 1"], "off": false}, {"c": ["Longue-vue", "3", "15 CO", "6", "Rare", "+20 aux tests de Perception à distance. Fragile"], "off": false}, {"c": ["Passe-partout mécanique", "2", "5 CO", "4", "Rare", "+10 aux tests de Crochetage. Sa possession est un délit dans la plupart des villes"], "off": false}, {"c": ["Serrure de sûreté", "2", "3 CO", "4", "Limitée", "Crochetage à −20. Une Maladresse casse l'outil dans la serrure"], "off": false}, {"c": ["Fusée de signalement", "2", "2 CO", "4", "Limitée", "Visible à cinq kilomètres de nuit. Une action pour l'allumer, Dangereuse"], "off": false}, {"c": ["Pompe à bras", "2", "6 CO", "4", "Limitée", "Vide une cave, alimente une lance à incendie. Deux servants, Enc 4"], "off": false}, {"c": ["Chariot blindé", "4", "60 CO", "8", "Rare", "Protectrice 4 pour les occupants, vitesse réduite d'un cran, deux chevaux nécessaires"], "off": false}, {"c": ["Prothèse articulée", "4", "40 CO", "8", "Rare", "Remplace une main ou un pied perdu. Annule les pénalités permanentes correspondantes sauf en action fine"], "off": false}], "foot": ""}, {"kind": "table", "title": "Machines de guerre", "note": "Table officielle Up in Arms, qui remplace les machines maison de la version précédente. Le défaut Servants X est officiel : un servant manquant double la Recharge, deux ajoutent Imprécise, trois ajoutent Dangereuse, et un défaut déjà présent devient à la place −10 aux Projectiles. La qualité Salve X permet de tirer X fois avant rechargement, chaque tir supplémentaire dans le même tour imposant un cumul de −10 ; recharger n'augmente la Salve que de 1 par Recharge réussie. Les colonnes Éch. et DR sont maison et servent à la fabrication. Profils complets dans Armes et Munitions.", "cols": ["Pièce", "Éch.", "Prix", "DR", "Portée", "Dégâts", "Atouts et Défauts"], "rows": [{"c": ["Baliste", "3", "30 CO", "8", "150", "+12", "Précise, Recharge 3, Servants 2"], "off": true}, {"c": ["Pierrier", "3", "20 CO", "8", "30", "+14", "Dangereuse, Recharge 4"], "off": true}, {"c": ["Catapulte légère", "3", "20 CO", "8", "75", "+10", "Imprécise, Recharge 3, Servants 2"], "off": true}, {"c": ["Catapulte moyenne", "4", "40 CO", "8", "100", "+15", "Imprécise, Recharge 3, Servants 3"], "off": true}, {"c": ["Catapulte lourde", "4", "60 CO", "12", "175", "+18", "Imprécise, Recharge 4, Servants 4"], "off": true}, {"c": ["Canon léger", "4", "40 CO", "8", "100", "+10", "Dangereuse, Recharge 4, Servants 2"], "off": true}, {"c": ["Canon moyen", "4", "100 CO", "12", "125", "+14", "Dangereuse, Recharge 6, Servants 3"], "off": true}, {"c": ["Canon lourd", "5", "250 CO", "12", "175", "+16", "Dangereuse, Recharge 8, Servants 4"], "off": true}, {"c": ["Mortier", "5", "50 CO", "12", "150", "–", "Recharge 4, Servants 3"], "off": true}, {"c": ["Orgue à balles", "4", "10 CO", "8", "50", "+9", "Dangereuse, Recharge 4, Salve 7"], "off": true}, {"c": ["Canon à salves Helblaster", "5", "500 CO", "12", "100", "+10", "Dangereuse, Recharge 4, Salve 9, Servants 3"], "off": true}, {"c": ["Lance-fusées Helstorm", "5", "500 CO", "12", "185", "+12", "Explosion 5, Dangereuse, Imprécise, Recharge 6, Salve 9, Servants 3"], "off": true}], "foot": "Une pièce d'artillerie ne se fabrique pas dans un atelier de bourg : il faut une fonderie, donc Nuln, Altdorf ou un karak. Le prix ci-dessus est celui de l'achat ; la fabrication coûte la moitié en matières et engage la responsabilité pénale de l'ingénieur agréé qui la signe."}, {"kind": "table", "title": "Structures : profils", "note": "Table officielle Up in Arms. Enc. est le poids propre de la structure, Limite d'Enc. la charge qu'elle supporte, typiquement une pièce d'artillerie postée dessus. Rés. est la Résistance, qui réduit les dégâts subis, et Bl. le nombre de Blessures qu'elle encaisse avant de céder. Couvert donne la pénalité imposée à qui tire sur une cible abritée derrière. Un astérisque signale un profil valable pour cinq mètres de longueur : abattre cette portion ne fait pas tomber le reste.", "cols": ["Structure", "Enc.", "Limite d'Enc.", "Rés.", "Bl.", "Couvert"], "rows": [{"c": ["Charrette", "10", "30", "25", "10", "Intermédiaire (+0)"], "off": true}, {"c": ["Diligence", "100", "80", "45", "50", "Difficile (−10)"], "off": true}, {"c": ["Chariot léger", "30", "30", "50", "35", "Difficile (−10)"], "off": true}, {"c": ["Chariot moyen", "50", "60", "50", "60", "Difficile (−20)"], "off": true}, {"c": ["Chariot lourd", "75", "80", "50", "95", "Difficile (−20)"], "off": true}, {"c": ["Barque à rames", "25", "60", "35", "10", "Intermédiaire (+0)"], "off": true}, {"c": ["Chaland courant", "100", "300", "45", "60", "Difficile (−10)"], "off": true}, {"c": ["Vedette de patrouille", "130", "50", "60", "120", "Difficile (−20)"], "off": true}, {"c": ["Clôture de clayonnage *", "–", "–", "25", "10", "Intermédiaire (+0)"], "off": true}, {"c": ["Porte de bois renforcée", "5", "–", "50", "10", "–"], "off": true}, {"c": ["Mantelet de bois", "5", "–", "50", "15", "Difficile (−10)"], "off": true}, {"c": ["Mur à colombages *", "–", "30", "40", "20", "–"], "off": true}, {"c": ["Levée de terre *", "–", "60", "50", "30", "Difficile (−10)"], "off": true}, {"c": ["Muret de pierre sèche *", "–", "30", "60", "20", "Difficile (−10)"], "off": true}, {"c": ["Palissade de pieux *", "–", "60", "50", "30", "Difficile (−20)"], "off": true}, {"c": ["Mur de pierre *", "–", "100", "60", "50", "Difficile (−20)"], "off": true}, {"c": ["Herse *", "–", "–", "70", "20", "–"], "off": true}, {"c": ["Muraille de château *", "–", "150", "65", "100", "Très difficile (−30)"], "off": true}, {"c": ["Muraille naine *", "–", "200", "80", "150", "Très difficile (−30)"], "off": true}], "foot": "Les murailles des grandes cités humaines, Altdorf, Ubersreik, Marienburg, sont bâties et entretenues par des Nains, à prix d'or. Une muraille naine est massive de part en part là où une muraille humaine n'est qu'un double parement rempli de gravats et de mortier."}, {"kind": "texte", "title": "Frapper une structure", "note": "Règles officielles Up in Arms, chapitre XI. Elles ne servent qu'avec l'artillerie ci-dessus : c'est le seul moyen raisonnable d'ouvrir une brèche.", "items": ["Une structure ne bouge pas et n'esquive pas : toute attaque de corps à corps la touche automatiquement. Viser un point précis, ou frapper un véhicule en mouvement, compte comme une attaque ciblée à −20. Si l'on attaque le conducteur d'un véhicule lancé, on résout un test opposé de Corps à corps, mais il peut y opposer sa Conduite d'attelage.", "Une épée n'ouvre pas un mur. Le MJ compare la taille de la structure à celle de l'attaquant et compte sa Résistance une fois de plus par cran de taille d'écart. Un mur de pierre Énorme, de Bonus de Résistance 6, opposé à un humain de taille Moyenne, oppose donc un Bonus de 18. Les machines de siège ignorent cette règle : c'est précisément leur raison d'être.", "Une structure n'a pas de localisations. Si l'on tire sur quelqu'un abrité derrière et qu'on le manque, le projectile peut toucher la structure : de 0 à −2 degrés d'échec, le tir la frappe et peut l'endommager ; à −3 ou moins, il part ailleurs sans effet.", "Les critiques sont difficiles à obtenir sur une structure. Un double au jet la met en danger, mais les dégâts critiques ne s'appliquent que si l'attaque lui retire au moins un quart de ses Blessures restantes. En revanche, dès que ses Blessures tombent à zéro, chaque coup suivant cause automatiquement un critique.", "Réparation définitive : test de Métier (Charpentier) Accessible (+20) pour le bois, de Métier (Maçon) Accessible (+20) pour la pierre. Chaque réussite prend 1d10 heures et rend 1d10 Blessures. Réparation de fortune en plein combat, à coups de gravats entassés et de poutres redressées : test étendu Très difficile (−30) dans le même métier, 20 DR à totaliser, pour 1d10 Blessures rendues. Les soins et la magie de guérison n'ont aucun effet sur une structure, sauf idée créative que tu voudras bien accepter."], "foot": "Les deux spécialisations de Métier qui comptent ici, Charpentier et Maçon, sont détaillées dans Artisanat. Un groupe qui prend une place forte a tout intérêt à embarquer l'une des deux."}, {"kind": "table", "title": "Dégâts critiques sur une structure", "note": "Table officielle Up in Arms. Bl. indique les Blessures infligées en plus des dégâts normaux ; un T signifie que le résultat n'inflige aucune Blessure supplémentaire. Tout ce qui tuerait un personnage fait subir à une structure le résultat Effondrement.", "cols": ["1d100", "Résultat", "Bl.", "Effet"], "rows": [{"c": ["01–35", "Éclats", "T", "Un personnage au hasard, posté sur la structure ou abrité derrière, est frappé par les débris et subit des dégâts égaux au Bonus de Résistance de la structure."], "off": true}, {"c": ["36–50", "Ébranlée", "1", "Tous ceux qui se tiennent dessus ou dedans encaissent le choc : test d'Athlétisme Facile (+40) ou état Surpris."], "off": true}, {"c": ["51–60", "Percée", "1", "Une petite brèche s'ouvre. Le couvert baisse d'un cran : une structure qui donnait Difficile (−10) ne donne plus qu'Intermédiaire (+0)."], "off": true}, {"c": ["61–70", "Secouée", "2", "Test d'Athlétisme Accessible (+20) pour tous ceux qui sont dessus ou dedans, sous peine de l'état À terre."], "off": true}, {"c": ["71–80", "Pluie d'éclats", "2", "Tous ceux qui sont sur la structure ou abrités derrière sont frappés par les débris et subissent des dégâts égaux au Bonus de Résistance de la structure."], "off": true}, {"c": ["81–90", "Effondrement partiel", "3", "Un pan entier s'écroule. Test d'Athlétisme Intermédiaire (+0) ou chute. La Limite d'Encombrement est divisée par deux, et toute pièce d'artillerie qui la dépasse désormais bascule et devient inutilisable jusqu'à réparation."], "off": true}, {"c": ["91–95", "Brèche", "3", "Un trou béant s'ouvre. Ceux qui sont dessus ou dedans sont frappés par les débris et subissent des dégâts égaux au Bonus de Résistance. La structure n'offre plus aucun couvert."], "off": true}, {"c": ["96 ou plus", "Effondrement", "Détruite", "Tout s'écroule. Ceux qui s'abritaient derrière prennent des dégâts égaux au Bonus de Résistance. Ceux qui étaient dessus ou dedans testent la chute, puis subissent des dégâts comme frappés par une arme de Force égale aux Blessures restantes de la structure. Toute artillerie postée dessus tombe et devient inutilisable jusqu'à réparation."], "off": true}], "foot": "Une brèche praticable dans une muraille de château demande donc, en pratique, plusieurs journées de bombardement au canon lourd. C'est une opération de campagne, pas une scène de combat."}, {"kind": "table", "title": "Quand ça tourne mal", "note": "Sur une Maladresse au tir avec une arme à poudre ou d'ingénierie, ou sur une Maladresse au test de Métier pendant l'usage d'un engin, jeter 1d10.", "cols": ["1d10", "Incident"], "rows": [{"c": ["1", "Ratage sec. L'amorce ne prend pas. Une action pour réamorcer, rien de cassé"], "off": false}, {"c": ["2", "Encrassement. L'arme gagne Encrassante jusqu'à un nettoyage complet"], "off": false}, {"c": ["3", "Détente faussée. Recharge augmentée de 1 jusqu'à réparation, test de Métier de complexité 1"], "off": false}, {"c": ["4", "Retour de flamme. Le tireur subit un état Aveuglé pour 1d10 rounds"], "off": false}, {"c": ["5", "Étincelle dans la giberne. Test d'Agilité ou état Enflammé"], "off": false}, {"c": ["6", "Pièce brisée. L'arme est inutilisable jusqu'à une réparation de complexité 2, pièces Limitées"], "off": false}, {"c": ["7", "Canon fendu. Réparation de complexité 3 avec pièces Rares, ou l'arme est perdue"], "off": false}, {"c": ["8", "Éclatement partiel. Dégâts de l'arme moitié au tireur, armure appliquée normalement"], "off": false}, {"c": ["9", "Éclatement. Dégâts complets de l'arme au tireur, l'arme est détruite"], "off": false}, {"c": ["10", "Détonation. Comme ci-dessus, plus Explosion 2 centrée sur le tireur. Sur une machine de guerre, la pièce est perdue et les servants sont à terre"], "off": false}], "foot": "Un ingénieur qui a lui-même construit ou entretenu l'engin soustrait 2 au résultat, minimum 1. Une arme portant Chambre renforcée en soustrait 2 de plus. C'est la récompense concrète du métier : les autres subissent la table, lui la corrige."}, {"kind": "texte", "title": "Pièces, fournisseurs et poudre", "note": "", "items": ["Disponibilité des pièces. Commune se trouve chez un forgeron, Limitée dans une ville avec guilde, Rare à Nuln, Altdorf ou chez les Nains, Exotique se commande et s'attend 1d10 semaines. En chemin, une commande peut être volée, taxée ou détournée : c'est du matériel militaire.", "Poudre noire. Produit d'État. La détenir en quantité exige une patente d'ingénieur ou un mandat. Sans papiers, le prix double et le vendeur se souvient du visage de l'acheteur.", "Prix de revente. Un engin d'occasion se vend la moitié de son prix, un engin non homologué le quart, et il est saisi sans indemnité si un contrôle le trouve.", "Réparation. Coût en matières égal au quart du prix de l'objet, complexité inférieure d'un cran à celle de sa fabrication.", "Guilde. Un ingénieur affilié obtient +10 à ses tests d'achat de pièces et l'accès aux ateliers. En échange, il consigne ses travaux et paie une cotisation de 2 CO par an."], "foot": ""}, {"kind": "texte", "title": "Notes de MJ", "note": "", "items": ["Le vrai plaisir est dans l'improvisation. Un joueur ingénieur cherchera à bricoler pendant les scènes, pas à remplir des fiches de fabrication. Dis oui souvent, applique le −20, la Fragilité et la Dangerosité, et laisse la table découvrir le résultat. C'est là que le métier devient mémorable.", "Le temps est la vraie limite, pas l'argent. Une semaine d'atelier, c'est une semaine où le reste du groupe fait autre chose et où l'intrigue avance sans lui. Ça règle seul les excès.", "Deux modifications maximum par arme, sinon un pistolet finit rayé, à double canon, renforcé, pliant et à hausse, et le grimdark disparaît.", "Le mandat et la licence sont des leviers narratifs. Retirer la patente d'un personnage lui coûte plus qu'un combat perdu, et la lui rendre est une récompense qui ne déséquilibre rien.", "Pour un ingénieur nain, remplace la guilde impériale par le clan et la licence par le devoir : il ne demande pas l'autorisation, il rend des comptes. Les pièces Rares deviennent Limitées pour lui, les Exotiques restent hors de portée sans retour au foyer."], "foot": ""}, {"kind": "texte", "title": "Résumé pour le joueur, en cinq lignes", "note": "", "items": ["Ta compétence clé est Métier (Ingénieur), tes outils sont obligatoires, et tout ce que tu construis se résout par un test étendu dont le nombre de DR dépend de la complexité, de 2 pour une mèche à 12 pour un canon. Tu peux tenter n'importe quoi, même au-dessus de ton échelon, avec −20 et sans fournisseur. Tu paies la moitié du prix en matières, tu perds tout sur une Maladresse. Tu es le seul personnage capable de corriger la table des incidents plutôt que de la subir. Et la question qui décidera de ta carrière n'est pas de savoir ce que tu sais faire, mais qui t'autorise à le faire."], "foot": ""}]}], "legend": [{"off": true, "term": "Servants X", "def": "Défaut officiel Up in Arms. L'arme réclame X servants possédant la compétence de Projectiles adéquate ; l'un d'eux est désigné pour lancer le test. Un servant manquant double la Recharge, deux ajoutent Imprécise, trois ajoutent Dangereuse. Un défaut déjà présent devient à la place −10 aux Projectiles. Une maladresse affecte tout l'équipage."}, {"off": true, "term": "Salve X", "def": "Atout officiel Up in Arms. L'arme tire X fois avant rechargement. Chaque tir supplémentaire dans le même tour impose un cumul de −10 aux Projectiles. Recharger n'augmente la Salve que de 1 par Recharge réussie."}, {"off": true, "term": "Recharge X", "def": "Recharge en test étendu de Projectiles, X DR requis. Toute interruption oblige à recommencer."}, {"off": true, "term": "Dangereuse", "def": "Tout test raté comportant un 9 au dé des dizaines ou des unités entraîne une Maladresse."}, {"off": true, "term": "Imprécise", "def": "−1 DR à l'attaque. Ne peut jamais être Précise."}, {"off": true, "term": "Précise", "def": "+10 à tout test effectué avec l'arme."}, {"off": true, "term": "Pointue", "def": "+1 DR à tout test d'attaque réussi."}, {"off": true, "term": "À répétition X", "def": "L'arme contient X munitions rechargées automatiquement après chaque tir. Épuisée, elle se recharge normalement."}, {"off": true, "term": "Explosion X", "def": "Toutes les cibles à X mètres du point d'impact subissent DR + dégâts de l'arme et les états infligés."}, {"off": true, "term": "À poudre noire", "def": "Être pris pour cible impose un test de Calme Accessible (+20) ou l'état Brisé, même si le tir manque. Toutes les armes à poudre et d'ingénierie le possèdent."}, {"off": true, "term": "Protectrice X", "def": "Chaque fois que l'on oppose une attaque avec Corps à corps, on bénéficie de X PA supplémentaires. Employé ici pour les occupants d'un chariot blindé."}, {"off": false, "term": "Encrassante", "def": "Maison. Recharge augmentée de 1 au tir suivant, jusqu'au nettoyage du canon."}, {"off": false, "term": "Fragile", "def": "L'objet est perdu ou brisé au premier incident sérieux."}, {"off": false, "term": "Éch.", "def": "Maison. Échelon de guilde exigé pour que le travail soit reconnu. Travailler au-delà de son échelon coûte −20 et se fait sans couverture de la guilde."}, {"off": false, "term": "DR", "def": "Degrés de Réussite à totaliser dans le test étendu de Métier (Ingénieur) pour achever la pièce."}, {"off": false, "term": "Pièces", "def": "Disponibilité des composants. Commune chez un forgeron, Limitée en ville à guilde, Rare à Nuln, Altdorf ou chez les Nains, Exotique se commande et s'attend 1d10 semaines."}]};

/* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

  sale = true;
  etat('modifié', 'pending');
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') d = JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  /* ancien format à sections plates : on l'enveloppe dans un groupe unique */
  if(!d.groups && d.sections) d.groups = [{title:'', note:'', sections: d.sections}];
  delete d.sections;
  d.groups = tab(d.groups);
  for(var g = 0; g < d.groups.length; g++){
    var G = d.groups[g];
    G.title = G.title || '';
    G.note  = G.note  || '';
    G.sections = tab(G.sections);
    for(var i = 0; i < G.sections.length; i++){
      var s = G.sections[i];
      s.kind  = s.kind || (s.cols ? 'table' : 'texte');
      s.title = s.title || '';
      s.note  = s.note  || '';
      s.foot  = s.foot  || '';
      if(s.kind === 'table'){
        s.cols = tab(s.cols);
        s.rows = tab(s.rows);
        for(var r = 0; r < s.rows.length; r++){
          s.rows[r] = s.rows[r] || {};
          s.rows[r].c = tab(s.rows[r].c);
          s.rows[r].off = !!s.rows[r].off;
        }
      } else {
        s.items = tab(s.items);
      }
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def  = d.legend[l].def  || '';
    d.legend[l].off  = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 ||
     n.indexOf('compl') === 0 || n.indexOf('pa') === 0 || n.indexOf('dégâts') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var gi = 0; gi < data.groups.length; gi++){
    var G = data.groups[gi];
    h += '<div class="grp" data-g="' + gi + '">';
    h += '<h2 contenteditable data-t="gt" data-g="' + gi + '">' + esc(G.title) + '</h2>';
    h += '<div class="gnote" contenteditable data-t="gn" data-g="' + gi + '">' + esc(G.note) + '</div>';

    for(var si = 0; si < G.sections.length; si++){
      var s = G.sections[si];
      var n = (s.kind === 'table') ? s.rows.length : s.items.length;
      h += '<div class="sec" data-g="' + gi + '" data-s="' + si + '">';
      h += '<div class="sechead">';
      h +=   '<button data-a="fold">▾</button>';
      h +=   '<span class="t" contenteditable data-t="st" data-g="' + gi + '" data-s="' + si + '">' + esc(s.title) + '</span>';
      h +=   '<span class="n">' + n + '</span>';
      h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
      h += '</div>';
      h += '<div class="snote" contenteditable data-t="sn" data-g="' + gi + '" data-s="' + si + '">' + esc(s.note) + '</div>';
      h += '<div class="secbody">';

      var PIED = '<div class="sfoot" contenteditable data-t="sf" data-g="' + gi + '" data-s="' + si + '">' + esc(s.foot) + '</div>';

      if(s.kind === 'table'){
        h += '<table><thead><tr>';
        for(var ci = 0; ci < s.cols.length; ci++)
          h += '<th contenteditable data-t="col" data-g="' + gi + '" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
        h += '<th></th></tr></thead><tbody>';
        for(var ri = 0; ri < s.rows.length; ri++){
          var r = s.rows[ri];
          h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
          for(var k = 0; k < s.cols.length; k++){
            h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
                 '" data-g="' + gi + '" data-s="' + si + '" data-r="' + ri + '" data-c="' + k + '">' +
                 esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
          }
          h += '<td class="acts"><button data-a="off" title="Ligne officielle">★</button>' +
               '<button data-a="dup" title="Dupliquer">⧉</button>' +
               '<button data-a="del" title="Supprimer">✕</button></td></tr>';
        }
        h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
      } else {
        h += '<div class="items">';
        for(var ii = 0; ii < s.items.length; ii++){
          h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
               '<div class="txt" contenteditable data-t="item" data-g="' + gi + '" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
               '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
        }
        h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
      }
      h += '</div></div>';
    }
    h += '</div>';
  }

  h += '<h2 class="bloc">Légende</h2>';
  {
    h += '<div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div><button class="addrow" data-a="addleg">+ Entrée de légende</button>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Chaque frappe part vers la base en ligne, ' +
       'rien à valider. L\'étoile marque une ligne officielle, en italique. Survoler une cellule affiche ' +
       'les définitions reconnues. Le bouton PDF imprime la page, le bouton Push republie le contenu du ' +
       'fichier par-dessus la base.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var g = +el.getAttribute('data-g'), s = +el.getAttribute('data-s'),
      r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c'),
      i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent, S = (data.groups[g] && data.groups[g].sections) ? data.groups[g].sections[s] : null;
  if(t === 'intro') data.intro = v;
  else if(t === 'gt') data.groups[g].title = v;
  else if(t === 'gn') data.groups[g].note = v;
  else if(t === 'st') S.title = v;
  else if(t === 'sn') S.note = v;
  else if(t === 'sf') S.foot = v;
  else if(t === 'col') S.cols[c] = v;
  else if(t === 'cell') S.rows[r].c[c] = v;
  else if(t === 'item') S.items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(a === 'addleg'){
    if(!data.legend) data.legend = [];
    data.legend.push({off:false, term:'Nouveau mot-clé', def:'Définition.'});
    sauver(); rendre();
    var els = document.querySelectorAll('.leg .term');
    if(els.length) els[els.length - 1].focus();
    return;
  }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var gi = +sec.getAttribute('data-g'), si = +sec.getAttribute('data-s');
  var LST = data.groups[gi].sections, S = LST[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < LST.length){
      var tmp = LST[si]; LST[si] = LST[n]; LST[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('b-print').onclick = function(){ window.print(); };
document.getElementById('b-push').onclick = pousserFichier;

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var grps = document.querySelectorAll('.grp');
  for(var g = 0; g < grps.length; g++){
    var restant = grps[g].querySelectorAll('.sec:not(.hid)').length;
    grps[g].classList.toggle('hid', !!q && restant === 0);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
</script>
