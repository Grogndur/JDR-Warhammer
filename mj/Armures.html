<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armures</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#c2452a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1280px;margin:0 auto;padding:1rem .9rem 4rem}
  .grp{margin:0 0 1.4rem}
  .grp>h2{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.6rem 0 .5rem}
  .grp>h2:focus{outline:none;background:#0e0c0b}
  .gnote{font-size:.82rem;color:var(--dim);margin:.1rem 0 .8rem;padding:.5rem .7rem;
       background:var(--panel);border-left:2px solid var(--line);border-radius:0 3px 3px 0}
  .gnote:focus{outline:none;background:#0e0c0b}
  .gnote:empty,.grp>h2:empty{display:none}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td.c{text-align:center;white-space:nowrap}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .grp>h2{color:#8B1A1A;border-color:#8B1A1A}
    .gnote{background:#faf7f1;color:#5a524a}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
var DEFAUT = {"intro": "Avertissement. Les lignes en italique sont officielles : livre de base pour les armures, supplément Up in Arms pour les boucliers et pour la qualité Protectrice, ce dernier faisant autorité en cas de divergence. Les lignes en caractères droits sont maison, calibrées sur la même échelle : plus de protection se paie en prix, en encombrement ou en défaut. Aucune table d'armure ne figure dans Up in Arms : les valeurs officielles de cette page restent donc celles du livre de base et n'ont pas pu être recoupées avec une seconde source. La fabrication et la réparation sont détaillées dans le guide de La Forge, dont les prix et les DR sont ici identiques. Les profils de combat complets des boucliers figurent dans Armes et Munitions. Monnaie : CO couronne d'or, Pa pistole d'argent, Sc sou de cuivre. 1 CO = 20 Pa, 1 Pa = 12 Sc.", "groups": [{"title": "", "note": "", "sections": [{"kind": "texte", "title": "Comment lire ce document", "note": "", "items": ["Une armure ne se porte pas, elle se répartit. Chaque pièce couvre une ou plusieurs localisations et y ajoute des points d'armure, qui se soustraient aux dégâts subis à cet endroit précis. Un plastron ne sert à rien contre un coup à la tête.", "Les lignes en italique sont celles du livre de base, valeurs inchangées. Les lignes en romain sont des ajouts maison, cohérents avec l'échelle officielle : une pièce qui donne davantage coûte plus cher, pèse plus lourd, ou traîne un défaut.", "Le cumul est la règle la plus mal comprise de la quatrième édition. Deux armures ne s'additionnent jamais, sauf dans deux cas : le cuir souple se porte sous n'importe quoi sans pénalité, et une pièce Flexible se porte sous une pièce non Flexible. Hors de ces cas, seule la meilleure protection compte à la localisation.", "Les pénalités se cumulent, elles. Chaque pièce de maille ou de plate impose −10 en Discrétion, et les malus de Perception des heaumes s'additionnent à tout le reste. Un chevalier en harnois complet est un homme sourd, aveugle sur les côtés et audible à cinquante pas, ce qui est exactement le prix de ses deux points d'armure.", "La fabrication et la réparation sont détaillées dans le guide de La Forge. Les tableaux repris ici portent les mêmes valeurs, aux mêmes prix : si tu en corriges un, corrige l'autre."], "foot": ""}, {"kind": "table", "title": "Localisations et ce qui les couvre", "note": "Intervalles officiels, vérifiés sur la fiche de personnage. Le bras gauche et le bras droit se lisent comme bras de l'arme secondaire et bras de l'arme principale : pour un personnage gaucher, les deux plages s'échangent sans rien changer aux probabilités.", "cols": ["Localisation", "Localisation d100", "Pièces concernées", "Ce qu'un coup non protégé coûte"], "rows": [{"c": ["Tête", "01–09", "Calotte, capuchon, camail, coiffe, heaume, gorgerin", "Les critiques à la tête sont les plus meurtriers du jeu. Un point d'armure y vaut trois ailleurs"], "off": true}, {"c": ["Bras gauche, ou bras de l'arme secondaire", "10–24", "Veste, cotte, brassards, gantelets, spalières", "Le bras du bouclier ou de la dague de main gauche. Le perdre supprime la moitié des options défensives"], "off": true}, {"c": ["Bras droit, ou bras de l'arme principale", "25–44", "Veste, cotte, brassards, gantelets, spalières", "Le bras d'arme. Un critique ici désarme avant de tuer"], "off": true}, {"c": ["Corps", "45–79", "Justaucorps, plastron, chemise, cuirasse, brigandine", "La localisation la plus touchée, et celle qu'on protège en premier"], "off": true}, {"c": ["Jambe gauche", "80–89", "Jambières, chausses, tassettes", "Une jambe touchée fait tomber, et un homme au sol reçoit tout le reste"], "off": true}, {"c": ["Jambe droite", "90–00", "Jambières, chausses, tassettes", "Idem. Les jambières sont la pièce qu'on achète en dernier et qu'on regrette en premier"], "off": true}], "foot": "Une pièce marquée Partielle ne couvre pas toute la localisation : elle protège, mais l'adversaire chanceux passe à travers. Le bouclier ne figure pas parmi les localisations : il se pare, il ne se porte pas, et sa case sur la fiche sert à suivre les dégâts qu'il encaisse avant de céder."}, {"kind": "table", "title": "Cuir souple", "note": "Le cuir souple se porte sous n'importe quelle autre armure sans pénalité, et ses points d'armure s'ajoutent alors à ceux de la couche supérieure. C'est la meilleure dépense du jeu par pistole investie. Métier indique qui sait fabriquer la pièce, Compl. sa complexité : 1 vaut DR 2, 2 vaut DR 4, 3 vaut DR 6, 4 vaut DR 8, 5 vaut DR 12, avec les temps correspondants. Matières à la moitié du prix. Les métiers du cuir, du bois et du tissu sont détaillés dans Artisanat, le métal dans La Forge.", "cols": ["Armure", "Métier", "Compl.", "Prix", "Enc", "Disponibilité", "Pénalité", "Emplacements", "PA", "Atouts et Défauts"], "rows": [{"c": ["Calotte de cuir", "Cuir", "1", "8 Pa", "0", "Commune", "–", "Tête", "1", "Partielle"], "off": true}, {"c": ["Jambières de cuir", "Cuir", "1", "14 Pa", "1", "Commune", "–", "Jambes", "1", "–"], "off": true}, {"c": ["Justaucorps de cuir", "Cuir", "1", "10 Pa", "1", "Commune", "–", "Corps", "1", "–"], "off": true}, {"c": ["Veste de cuir", "Cuir", "1", "12 Pa", "1", "Commune", "–", "Bras, Corps", "1", "–"], "off": true}, {"c": ["Capuchon de cuir", "Cuir", "1", "6 Pa", "0", "Commune", "–", "Tête", "1", "Partielle, Flexible"], "off": false}, {"c": ["Gants de cuir cloutés", "Cuir, forge", "2", "8 Pa", "0", "Commune", "–", "Bras", "1", "Partielle"], "off": false}, {"c": ["Tablier d'atelier", "Cuir", "1", "10 Pa", "1", "Commune", "–", "Corps", "1", "Partielle, Étanche"], "off": false}, {"c": ["Gambison rembourré", "Tissu", "2", "1 CO", "1", "Limitée", "–", "Bras, Corps", "1", "Flexible, Rembourrée"], "off": false}, {"c": ["Manteau de voyage doublé", "Tissu, cuir", "2", "1 CO 10 Pa", "1", "Limitée", "–", "Bras, Corps", "1", "Flexible, Étanche, Partielle"], "off": false}], "foot": "Le gambison est la pièce que tout soldat sérieux porte sous ses mailles : un point de plus au corps pour un prix dérisoire, et le métal ne mord plus la peau à chaque coup."}, {"kind": "table", "title": "Cuir bouilli", "note": "Le cuir bouilli n'est pas Flexible : rien ne se porte par-dessus, sinon le cuir souple par-dessous. Métier indique qui sait fabriquer la pièce, Compl. sa complexité : 1 vaut DR 2, 2 vaut DR 4, 3 vaut DR 6, 4 vaut DR 8, 5 vaut DR 12, avec les temps correspondants. Matières à la moitié du prix. Les métiers du cuir, du bois et du tissu sont détaillés dans Artisanat, le métal dans La Forge.", "cols": ["Armure", "Métier", "Compl.", "Prix", "Enc", "Disponibilité", "Pénalité", "Emplacements", "PA", "Atouts et Défauts"], "rows": [{"c": ["Plastron de cuir", "Cuir", "2", "18 Pa", "2", "Limitée", "–", "Corps", "2", "Points faibles"], "off": true}, {"c": ["Spalières de cuir bouilli", "Cuir", "2", "15 Pa", "1", "Limitée", "–", "Bras", "2", "Points faibles"], "off": false}, {"c": ["Jambières de cuir bouilli", "Cuir", "2", "1 CO", "2", "Limitée", "–", "Jambes", "2", "Points faibles"], "off": false}, {"c": ["Jaque de cuir clouté", "Cuir, forge", "3", "1 CO 10 Pa", "2", "Limitée", "–", "Bras, Corps", "2", "Points faibles"], "off": false}, {"c": ["Masque de cuir bouilli", "Cuir", "2", "1 CO", "0", "Limitée", "−10 % en Perception", "Tête", "1", "Partielle, Ostentatoire"], "off": false}, {"c": ["Brigandine de cuir et plaques", "Cuir, forge", "3", "4 CO", "3", "Rare", "−10 % en Discrétion", "Corps", "3", "Points faibles, Bruyante"], "off": false}], "foot": "La brigandine est le meilleur rapport protection sur prix du document, et c'est voulu : trois points au corps pour quatre couronnes, payés en bruit et en discrétion. C'est l'armure du mercenaire qui n'a pas les moyens des plates."}, {"kind": "table", "title": "Mailles", "note": "Porter n'importe quelle pièce de maille ou de plate impose −10 % en Discrétion, par pièce, en plus des pénalités indiquées. Métier indique qui sait fabriquer la pièce, Compl. sa complexité : 1 vaut DR 2, 2 vaut DR 4, 3 vaut DR 6, 4 vaut DR 8, 5 vaut DR 12, avec les temps correspondants. Matières à la moitié du prix. Les métiers du cuir, du bois et du tissu sont détaillés dans Artisanat, le métal dans La Forge.", "cols": ["Armure", "Métier", "Compl.", "Prix", "Enc", "Disponibilité", "Pénalité", "Emplacements", "PA", "Atouts et Défauts"], "rows": [{"c": ["Chausses de mailles", "Forge", "3", "2 CO", "3", "Limitée", "–", "Jambes", "2", "Flexible"], "off": true}, {"c": ["Chemise de mailles", "Forge", "3", "2 CO", "2", "Limitée", "–", "Corps", "2", "Flexible"], "off": true}, {"c": ["Coiffe de mailles", "Forge", "3", "1 CO", "2", "Limitée", "−10 % en Perception", "Tête", "2", "Flexible, Partielle"], "off": true}, {"c": ["Cotte de mailles", "Forge", "3", "3 CO", "3", "Commune", "–", "Bras, Corps", "2", "Flexible"], "off": true}, {"c": ["Camail", "Forge", "3", "1 CO", "1", "Limitée", "–", "Tête", "2", "Flexible, Partielle"], "off": false}, {"c": ["Gantelets de mailles", "Forge", "3", "1 CO", "1", "Limitée", "–", "Bras", "2", "Flexible, Partielle"], "off": false}, {"c": ["Haubert long", "Forge", "4", "5 CO", "4", "Rare", "−10 % en Agilité", "Bras, Corps, Jambes", "2", "Flexible, Bruyante"], "off": false}, {"c": ["Mailles à anneaux rivetés", "Forge", "4", "6 CO", "3", "Rare", "–", "Bras, Corps", "2", "Flexible, Impénétrable"], "off": false}], "foot": "Les anneaux rivetés sont la vraie armure de guerre : même protection que la cotte ordinaire, mais les anneaux ne s'ouvrent plus sous la pointe. C'est ce que porte un soldat qui a survécu à sa première campagne et qui en a tiré les conclusions."}, {"kind": "table", "title": "Plate", "note": "Une plate se monte sur un gambison, jamais à même la chemise. Compte le gambison dans le prix d'un harnois : il y est déjà. Métier indique qui sait fabriquer la pièce, Compl. sa complexité : 1 vaut DR 2, 2 vaut DR 4, 3 vaut DR 6, 4 vaut DR 8, 5 vaut DR 12, avec les temps correspondants. Matières à la moitié du prix. Les métiers du cuir, du bois et du tissu sont détaillés dans Artisanat, le métal dans La Forge.", "cols": ["Armure", "Métier", "Compl.", "Prix", "Enc", "Disponibilité", "Pénalité", "Emplacements", "PA", "Atouts et Défauts"], "rows": [{"c": ["Brassards", "Forge", "3", "8 CO", "3", "Rare", "–", "Bras", "2", "Impénétrable, Points faibles"], "off": true}, {"c": ["Heaume", "Forge", "4", "3 CO", "2", "Rare", "−20 % en Perception", "Tête", "2", "Impénétrable, Points faibles"], "off": true}, {"c": ["Heaume ouvert", "Forge", "2", "2 CO", "1", "Commune", "−10 % en Perception", "Tête", "2", "Partielle"], "off": true}, {"c": ["Jambières d'acier", "Forge", "3", "10 CO", "3", "Rare", "−10 % en Discrétion", "Jambes", "2", "Impénétrable, Points faibles"], "off": true}, {"c": ["Plastron", "Forge", "4", "10 CO", "3", "Limitée", "–", "Corps", "2", "Impénétrable, Points faibles"], "off": true}, {"c": ["Gorgerin d'acier", "Forge", "3", "2 CO", "1", "Rare", "−10 % en Perception", "Tête", "2", "Impénétrable, Partielle"], "off": false}, {"c": ["Gantelets de plates", "Forge", "4", "3 CO", "1", "Rare", "−10 % en Dextérité", "Bras", "2", "Impénétrable, Points faibles"], "off": false}, {"c": ["Spalières et tassettes", "Forge", "4", "5 CO", "2", "Rare", "–", "Bras, Corps", "2", "Impénétrable, Points faibles"], "off": false}, {"c": ["Harnois complet", "Forge", "5", "45 CO", "5", "Exotique", "−20 % en Perception, −20 % en Discrétion", "Toutes", "2", "Impénétrable, Ensemble, Ostentatoire, Bruyante"], "off": false}, {"c": ["Harnois ajusté", "Forge", "5", "67 CO", "4", "Exotique", "−10 % en Perception, −20 % en Discrétion", "Toutes", "2", "Impénétrable, Ensemble, Ajustée, Ostentatoire"], "off": false}], "foot": "L'atout Ensemble est la récompense de l'investissement : un harnois porté complet n'a plus de Points faibles, parce qu'il n'y a plus de jointure nue où glisser une pointe. Retire une seule pièce et le défaut revient sur toutes les autres."}, {"kind": "table", "title": "Armures étrangères et exceptionnelles", "note": "Ces pièces ne s'achètent pas en boutique. Elles se gagnent, s'héritent, se prennent sur un cadavre, ou se reçoivent d'un clan nain qui saura toujours où elle se trouve. Métier indique qui sait fabriquer la pièce, Compl. sa complexité : 1 vaut DR 2, 2 vaut DR 4, 3 vaut DR 6, 4 vaut DR 8, 5 vaut DR 12, avec les temps correspondants. Matières à la moitié du prix. Les métiers du cuir, du bois et du tissu sont détaillés dans Artisanat, le métal dans La Forge.", "cols": ["Armure", "Métier", "Compl.", "Prix", "Enc", "Disponibilité", "Pénalité", "Emplacements", "PA", "Atouts et Défauts"], "rows": [{"c": ["Écailles d'acier", "Forge", "4", "8 CO", "3", "Rare", "−10 % en Discrétion", "Corps", "2", "Flexible, Points faibles"], "off": false}, {"c": ["Lamellaire kislévite", "Forge, cuir", "4", "12 CO", "4", "Rare", "−10 % en Agilité", "Corps, Jambes", "2", "Points faibles, Bruyante, Étanche"], "off": false}, {"c": ["Cuirasse de répurgateur", "Forge, puis temple", "5", "15 CO", "2", "Rare", "–", "Corps", "2", "Impénétrable, Blasonnée, Bénie (Sigmar)"], "off": false}, {"c": ["Harnois de tournoi", "Forge", "5", "80 CO", "7", "Exotique", "−30 % en Perception, −20 % en Agilité", "Toutes", "3", "Impénétrable, Ensemble, Encombrante"], "off": false}, {"c": ["Cotte d'ithilmar", "Forge elfique", "5", "150 CO", "1", "Exotique", "–", "Bras, Corps", "2", "Flexible, Silencieuse, Allégée"], "off": false}, {"c": ["Maille de gromril", "Forge naine", "5", "200 CO", "3", "Exotique", "–", "Bras, Corps", "3", "Flexible, Impénétrable, Incassable"], "off": false}, {"c": ["Cuir de bête", "Cuir", "4", "6 CO", "2", "Exotique", "–", "Corps", "2", "Points faibles, Répulsive"], "off": false}, {"c": ["Armure de parade gravée", "Forge, métaux fins", "5", "×4 du prix", "–", "Exotique", "selon la pièce", "selon la pièce", "selon la pièce", "Ostentatoire, Blasonnée"], "off": false}], "foot": "Le cuir de bête est tanné dans une peau qui n'était pas celle d'un animal. Il protège correctement, et impose un test de Résistance à la Corruption à la première nuit passée dedans, puis un par mois. Un répurgateur qui le reconnaît n'entendra aucune explication."}, {"kind": "table", "title": "Boucliers", "note": "Table officielle Up in Arms, qui remplace les boucliers maison de la version précédente. Les boucliers sont des armes maniées avec Corps à corps (Base), pas des armures. La qualité Protectrice a été révisée : chaque fois que l'on oppose une attaque avec Corps à corps, on bénéficie de X points d'armure supplémentaires partout, même si c'est l'arme de la main directrice qui a paré. Autrement dit, épée en main droite et bouclier en main gauche, on pare sans pénalité avec l'épée et on encaisse quand même avec le bouclier. À partir de Protectrice 2, on peut aussi opposer les tirs que l'on voit venir. Le bonus ne s'applique pas tant que le porteur est Surpris. Ces points s'ajoutent à l'armure portée et n'y sont pas soumis aux règles de non-cumul.", "cols": ["Bouclier", "Métier", "Compl.", "Prix", "Enc", "Disponibilité", "Allonge", "Dégâts", "Atouts et Défauts"], "rows": [{"c": ["Bocle", "Forge, bois", "2", "18 Pa 2 Sc", "0", "Commune", "Personnelle", "+BF+1", "Protectrice 1, Défensive, Inoffensive"], "off": true}, {"c": ["Bouclier", "Bois, forge", "2", "2 CO", "1", "Commune", "Très courte", "+BF+2", "Protectrice 2, Défensive, Inoffensive"], "off": true}, {"c": ["Grand bouclier", "Bois, forge", "3", "3 CO", "3", "Commune", "Très courte", "+BF+3", "Protectrice 3, Défensive, Inoffensive"], "off": true}, {"c": ["Pavois", "Bois, cuir", "3", "3 CO 15 Pa", "4", "Rare", "–", "+BF+2", "Protectrice 5"], "off": true}], "foot": "Le pavois se déploie en deux Actions comme un pan de mur et protège de tout tir venant de la direction annoncée tant que le porteur reste à un mètre derrière lui. Employé comme un simple grand bouclier, il gagne Lente et Épuisante et ne fait plus que +BF+2. Profils complets et règles d'emploi dans Armes et Munitions, section Boucliers. Les prix des deux documents sont identiques."}, {"kind": "table", "title": "Matières et effet sur la pièce", "note": "Les coûts et les disponibilités reprennent la table des Matières du guide de La Forge. Le surcoût s'applique au prix de la pièce finie.", "cols": ["Matière", "Surcoût", "Disponibilité", "Effet sur l'armure obtenue"], "rows": [{"c": ["Fer de tourbière", "×0,7", "Commune", "−1 DR à la fabrication. La pièce gagne Rouillée au premier hiver humide"], "off": false}, {"c": ["Fer marchand", "–", "Commune", "Le standard. Aucun modificateur"], "off": false}, {"c": ["Acier de Nuln", "×1,5", "Limitée", "+1 DR à la fabrication. Obligatoire au-delà de la complexité 3"], "off": false}, {"c": ["Acier nain", "×4", "Rare", "+1 DR, et la pièce gagne Incassable"], "off": false}, {"c": ["Gromril", "×20", "Exotique", "+1 PA et Incassable. Complexité 5, et un clan qui suit sa trace"], "off": false}, {"c": ["Ithilmar", "×20", "Exotique", "Enc réduit de 2 et la pièce gagne Silencieuse. Ne se travaille pas par des mains humaines"], "off": false}, {"c": ["Argenture", "×10", "Rare", "La pièce gagne Argentée. La couche s'use et se refait"], "off": false}, {"c": ["Cuir bouilli", "–", "Limitée", "Non métallique : ignoré par les armes Perforante"], "off": false}, {"c": ["Os et corne", "×0,5", "Commune", "1 PA au maximum, et la pièce est Fragile. L'armure des tribus et des désespérés"], "off": false}], "foot": "Le point à retenir pour la table : les armes Perforante ignorent les PA non métalliques et le premier point de tout le reste. Contre un ennemi équipé de pointes perforantes, une veste de cuir ne sert à rien et un plastron ne vaut qu'un point."}, {"kind": "table", "title": "Fabriquer, ajuster, réparer", "note": "Valeurs identiques à celles du guide de La Forge, reprises ici pour que ce document se suffise à lui-même. Coût de réparation : un dixième du prix de la pièce par point rendu, trois dixièmes si la pièce est brisée.", "cols": ["Pièce", "Prix", "DR", "Fabrication", "Réparation d'1 PA", "Note"], "rows": [{"c": ["Veste de cuir", "12 Pa", "4", "1 jour", "1 heure, 1 Pa", "Travail partagé avec le tanneur"], "off": false}, {"c": ["Jaque de cuir clouté", "1 CO 10 Pa", "6", "2 jours", "1 heure, 3 Pa", "Deux métiers : tanneur et forgeron"], "off": false}, {"c": ["Heaume ouvert", "2 CO", "4", "1 jour", "1 heure, 4 Pa", "La pièce la plus rentable de l'atelier"], "off": false}, {"c": ["Cotte de mailles", "3 CO", "6", "2 semaines", "2 heures, 6 Pa", "Se répare maille par maille, presque indéfiniment"], "off": false}, {"c": ["Brassards", "8 CO", "6", "4 jours", "2 heures, 16 Pa", "Doivent être ajustés au porteur"], "off": false}, {"c": ["Jambières d'acier", "10 CO", "6", "5 jours", "2 heures, 1 CO", "Les plus lourdes à porter comme à forger"], "off": false}, {"c": ["Plastron de plates", "10 CO", "8", "3 semaines", "4 heures, 1 CO", "Acier de Nuln obligatoire"], "off": false}, {"c": ["Harnois complet", "45 CO", "8", "2 mois", "Par pièce", "Une commande de ce genre change la vie d'un atelier"], "off": false}, {"c": ["Bouclier", "2 CO", "4", "1 jour", "1 heure, 4 Pa", "Bois cintré et cerclage de fer"], "off": false}, {"c": ["Bocle", "18 Pa 2 Sc", "2", "4 heures", "1 heure, 2 Pa", "Une seule pièce d'acier emboutie"], "off": false}], "foot": "Une pièce dont les PA tombent à zéro est brisée et ne protège plus. Réparée plus de trois fois, elle perd définitivement 1 PA."}, {"kind": "table", "title": "Améliorations d'armure", "note": "Deux améliorations au maximum par pièce. Les valeurs reprennent la table des Améliorations du guide de La Forge.", "cols": ["Travail", "Éch.", "Surcoût", "DR", "Effet et contrepartie"], "rows": [{"c": ["Ajustement au porteur", "3", "×1,5", "6", "Enc réduit de 1, la pièce gagne Ajustée. Inutilisable par un autre sans réajustement"], "off": false}, {"c": ["Doublure rembourrée", "2", "×1,5", "4", "La pièce gagne Rembourrée. Enc +1, et on transpire"], "off": false}, {"c": ["Doublure de cuir silencieuse", "3", "×2", "6", "La pièce gagne Silencieuse et perd Bruyante. À refaire chaque saison"], "off": false}, {"c": ["Renfort de plaques", "3", "×2", "6", "+1 PA à la localisation. Enc +1 et −10 % en Agilité"], "off": false}, {"c": ["Allègement", "4", "×3", "8", "Enc réduit de 2. La pièce perd 1 PA et devient Fragile"], "off": false}, {"c": ["Noircissement", "2", "×1,5", "4", "+10 % en Discrétion de nuit avec cet équipement"], "off": false}, {"c": ["Argenture", "3", "×10", "6", "La pièce gagne Argentée. La couche s'use après une vingtaine de coups reçus"], "off": false}, {"c": ["Blasonnement", "2", "×2", "4", "La pièce gagne Blasonnée et vaut un cran de Statut apparent. Et vous êtes identifiable"], "off": false}, {"c": ["Gravure et damasquinure", "4", "×4", "8", "Ostentatoire. Aucun effet mécanique, un cran de Statut en public"], "off": false}, {"c": ["Bénédiction au temple", "–", "don de 10 CO", "–", "Bénie (dieu). Exige un service rendu au culte, pas seulement de l'argent"], "off": false}], "foot": "Le calcul qui compte : un plastron renforcé et ajusté coûte trente couronnes, donne trois points d'armure au corps pour un encombrement inchangé, et ne va à personne d'autre. C'est un objet de personnage, pas un objet de groupe."}, {"kind": "table", "title": "Enfiler, retirer, dormir dedans", "note": "À appliquer surtout aux réveils en sursaut, aux embuscades de nuit et aux fuites par la fenêtre. Le reste du temps, personne ne chronomètre.", "cols": ["Catégorie", "Enfiler seul", "Avec de l'aide", "Retirer en urgence", "En dormant"], "rows": [{"c": ["Cuir souple", "1 minute", "–", "1 round par pièce", "Aucune conséquence"], "off": false}, {"c": ["Cuir bouilli", "3 minutes", "2 minutes", "3 rounds", "Sommeil sans repos réel : pas de récupération de Blessures"], "off": false}, {"c": ["Mailles", "10 minutes", "5 minutes", "Impossible en combat", "Exténué au réveil, sauf sur un gambison"], "off": false}, {"c": ["Plate", "20 minutes", "10 minutes", "Impossible sans aide", "Exténué, et un test d'Endurance chaque nuit"], "off": false}, {"c": ["Harnois complet", "45 minutes", "20 minutes", "Impossible", "Personne ne dort en harnois deux nuits de suite"], "off": false}], "foot": "Un écuyer, un serviteur ou un compagnon serviable divise ces durées par deux. C'est la raison d'être mécanique du personnage d'écuyer, et une bonne place pour un suivant."}, {"kind": "table", "title": "Usure et entretien", "note": "Une seule règle à retenir : l'armure est un consommable lent. C'est ce qui rend un forgeron dans le groupe utile à chaque veillée, et une ville amie précieuse.", "cols": ["Situation", "Effet sur l'armure", "Remise en état"], "rows": [{"c": ["Chaque point d'armure perdu en combat", "−1 PA à la localisation, définitif sans réparation", "Forgeron ou Métier approprié, un dixième du prix par point"], "off": false}, {"c": ["Une semaine sous la pluie ou en marais", "La pièce métallique gagne Rouillée : −1 PA jusqu'à entretien", "Une heure de graissage, test de Métier DR 1, 2 Pa d'huile"], "off": false}, {"c": ["Immersion prolongée, eau salée", "Rouillée, et −1 PA supplémentaire au bout d'un mois", "Deux heures et un test DR 2"], "off": false}, {"c": ["Attaque acide ou corrosive", "−1 PA immédiat, la pièce gagne Fragile si elle est en cuir", "Irréversible sur le cuir, réparable sur le métal"], "off": false}, {"c": ["Feu nourri, souffle enflammé", "Le cuir se craquelle, le métal chauffe : −1 PA et 1 dégât ignorant l'armure", "Cuir à refaire, métal à retremper"], "off": false}, {"c": ["Aucun entretien pendant un mois de campagne", "La pièce gagne Rouillée et perd Ostentatoire", "Une soirée de travail, ou dix pistoles chez n'importe quel forgeron"], "off": false}], "foot": "Ne comptabilise l'usure qu'entre deux séances, jamais pendant. Un tableau comme celui-ci sert à donner du poids à un voyage difficile, pas à tenir une comptabilité."}, {"kind": "texte", "title": "Porter une armure en public", "note": "", "items": ["Dans une ville de l'Empire, la plate est un signe, pas un vêtement. Un homme en harnois est un noble, un chevalier d'un ordre, ou un imposteur, et le guet fera la différence lui-même.", "Ce que la loi tolère selon les lieux : le cuir partout, sans remarque. Les mailles dans la rue, mais pas au temple ni devant un tribunal. La plate seulement pour ceux qui ont le droit de la porter, c'est-à-dire un titre, une charge ou une lettre. Dans une ville en état d'alerte, tout devient tolérable, et l'inverse est vrai en temps de foire.", "Les effets sociaux valent mieux qu'une amende. Une armure Blasonnée sans droit sur le blason est une usurpation, ce qui relève du chapitre des faux dans le document sur la Justice. Une pièce Ostentatoire vaut un cran de Statut apparent aux yeux de qui ne connaît pas le porteur, et exactement le contraire aux yeux de qui le connaît.", "Le détail qui sert le plus en jeu : personne ne dîne en armure. Une invitation chez un notable oblige à laisser les pièces à l'entrée, donc à décider qui reste habillé et qui accepte de se retrouver en chemise si la soirée tourne mal."], "foot": ""}, {"kind": "texte", "title": "Notes de MJ", "note": "", "items": ["Le cuir souple sous tout le reste est la règle à annoncer clairement. Elle est officielle, elle coûte douze pistoles, et un joueur qui l'ignore se prive d'un point d'armure permanent sur tout le corps. Dis-le une fois, à la création.", "Applique les défauts, ils sont la moitié de l'équilibre. Points faibles et Partielle existent précisément pour que les plates ne rendent pas le combat inoffensif. Une arme Empaleuse plus un critique, et les deux points ne comptent plus.", "L'encombrement est ton vrai frein, pas le prix. Un groupe assez riche achètera tout. Un groupe chargé de mailles ne court pas, ne nage pas, dort mal et arrive fatigué. C'est là que se joue la limite.", "Fais durer le harnois. Deux mois de fabrication, quarante-cinq couronnes, un ajustement au porteur : c'est un arc de campagne, avec un armurier, un fournisseur d'acier et une commande à protéger. Ne le vends jamais sur une étagère.", "Pour les Nains, décale tout d'un cran vers le haut : mailles Communes, plates Limitées, et une pièce héritée porte le nom de son premier propriétaire. Pour les Elfes, l'ithilmar remplace l'acier et rien ne fait de bruit. Pour les Halflings, tout est sur mesure et vaut moitié plus cher, et une armure humaine ne va à personne."], "foot": ""}, {"kind": "texte", "title": "Résumé pour le joueur, en cinq lignes", "note": "", "items": ["Achète d'abord une veste de cuir à douze pistoles et porte-la sous tout le reste, toujours. Ta deuxième dépense est un casque, parce que les critiques à la tête tuent et qu'un heaume ouvert coûte deux couronnes. Ensuite viennent les mailles, Flexible, donc cumulables avec le cuir dessous, au prix d'un malus de Discrétion par pièce. La plate n'a de sens que si tu acceptes d'être lent, sourd et visible, et le harnois complet n'a de sens que porté complet, sans quoi ses jointures te trahissent. Et quel que soit ton équipement, chaque point d'armure perdu reste perdu jusqu'à ce qu'un forgeron te le rende."], "foot": ""}]}], "legend": [{"off": true, "term": "Flexible", "def": "Peut être portée sous une couche d'armure non Flexible : les bénéfices des deux s'appliquent."}, {"off": true, "term": "Impénétrable", "def": "Les Blessures Critiques causées par un nombre impair au jet pour toucher, comme 11 ou 33, sont ignorées."}, {"off": true, "term": "Partielle", "def": "L'armure ne couvre pas entièrement la localisation. Un adversaire qui obtient un nombre pair pour toucher, ou un Coup Critique, ignore ses PA."}, {"off": true, "term": "Points faibles", "def": "L'armure a des jointures nues. Si l'adversaire attaque avec une arme Empaleuse et obtient un Critique, les PA sont ignorés."}, {"off": false, "term": "Ajustée", "def": "Forgée pour un porteur précis : Enc réduit de 1. Inutilisable par quelqu'un d'autre sans réajustement."}, {"off": false, "term": "Rembourrée", "def": "Ignore le premier point de dégât de toute attaque Assommante ou contondante."}, {"off": false, "term": "Ensemble", "def": "Tant que toutes les pièces de l'ensemble sont portées, le défaut Points faibles est annulé. Il revient dès qu'une pièce manque."}, {"off": false, "term": "Bruyante", "def": "−10 % supplémentaire en Discrétion, et toute approche furtive impose un test même lorsqu'elle n'en demanderait pas."}, {"off": false, "term": "Silencieuse", "def": "Annule Bruyante et la pénalité de Discrétion de la pièce."}, {"off": false, "term": "Ostentatoire", "def": "Vaut un cran de Statut apparent auprès des inconnus, et désigne le porteur comme cible prioritaire à tout ennemi capable de choisir."}, {"off": false, "term": "Blasonnée", "def": "Porte des armes identifiables. Le porteur est reconnu, et son affiliation avec lui."}, {"off": false, "term": "Encombrante", "def": "Course et nage impossibles. Test d'Endurance chaque heure d'effort sous peine d'un niveau d'Exténué."}, {"off": false, "term": "Allégée", "def": "Enc réduit de 2, au prix d'un point d'armure et du défaut Fragile."}, {"off": false, "term": "Renforcée", "def": "+1 PA à la localisation, Enc +1 et −10 % en Agilité."}, {"off": false, "term": "Rouillée", "def": "Négligée ou trempée : −1 PA jusqu'à une remise en état."}, {"off": false, "term": "Fragile", "def": "La pièce perd définitivement 1 PA à chaque Critique subi à sa localisation."}, {"off": false, "term": "Incassable", "def": "Ne se brise pas, ne rouille pas, ne se déforme pas. Immunise contre Rouillée."}, {"off": false, "term": "Étanche", "def": "Protège des liquides, projections et poisons de contact. Ne rouille pas sous la pluie."}, {"off": false, "term": "Argentée", "def": "Les créatures que seul l'argent atteint subissent 1 dégât lorsqu'elles frappent le porteur à mains nues, griffes ou crocs."}, {"off": false, "term": "Bénie (X)", "def": "Consacrée à un dieu. Une fois par séance, ignorer un Critique causé par une créature du Chaos ou un mort-vivant."}, {"off": false, "term": "Répulsive", "def": /* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

/* ---------- amorçage : le fichier, puis la base prend la main dès sa réponse ---------- */
function charger(){
  data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') d = JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  /* ancien format à sections plates : on l'enveloppe dans un groupe unique */
  if(!d.groups && d.sections) d.groups = [{title:'', note:'', sections: d.sections}];
  delete d.sections;
  d.groups = tab(d.groups);
  for(var g = 0; g < d.groups.length; g++){
    var G = d.groups[g];
    G.title = G.title || '';
    G.note  = G.note  || '';
    G.sections = tab(G.sections);
    for(var i = 0; i < G.sections.length; i++){
      var s = G.sections[i];
      s.kind  = s.kind || (s.cols ? 'table' : 'texte');
      s.title = s.title || '';
      s.note  = s.note  || '';
      s.foot  = s.foot  || '';
      if(s.kind === 'table'){
        s.cols = tab(s.cols);
        s.rows = tab(s.rows);
        for(var r = 0; r < s.rows.length; r++){
          s.rows[r] = s.rows[r] || {};
          s.rows[r].c = tab(s.rows[r].c);
          s.rows[r].off = !!s.rows[r].off;
        }
      } else {
        s.items = tab(s.items);
      }
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def  = d.legend[l].def  || '';
    d.legend[l].off  = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 ||
     n.indexOf('compl') === 0 || n.indexOf('pa') === 0 || n.indexOf('dégâts') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var gi = 0; gi < data.groups.length; gi++){
    var G = data.groups[gi];
    h += '<div class="grp" data-g="' + gi + '">';
    h += '<h2 contenteditable data-t="gt" data-g="' + gi + '">' + esc(G.title) + '</h2>';
    h += '<div class="gnote" contenteditable data-t="gn" data-g="' + gi + '">' + esc(G.note) + '</div>';

    for(var si = 0; si < G.sections.length; si++){
      var s = G.sections[si];
      var n = (s.kind === 'table') ? s.rows.length : s.items.length;
      h += '<div class="sec" data-g="' + gi + '" data-s="' + si + '">';
      h += '<div class="sechead">';
      h +=   '<button data-a="fold">▾</button>';
      h +=   '<span class="t" contenteditable data-t="st" data-g="' + gi + '" data-s="' + si + '">' + esc(s.title) + '</span>';
      h +=   '<span class="n">' + n + '</span>';
      h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
      h += '</div>';
      h += '<div class="snote" contenteditable data-t="sn" data-g="' + gi + '" data-s="' + si + '">' + esc(s.note) + '</div>';
      h += '<div class="secbody">';

      var PIED = '<div class="sfoot" contenteditable data-t="sf" data-g="' + gi + '" data-s="' + si + '">' + esc(s.foot) + '</div>';

      if(s.kind === 'table'){
        h += '<table><thead><tr>';
        for(var ci = 0; ci < s.cols.length; ci++)
          h += '<th contenteditable data-t="col" data-g="' + gi + '" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
        h += '<th></th></tr></thead><tbody>';
        for(var ri = 0; ri < s.rows.length; ri++){
          var r = s.rows[ri];
          h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
          for(var k = 0; k < s.cols.length; k++){
            h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
                 '" data-g="' + gi + '" data-s="' + si + '" data-r="' + ri + '" data-c="' + k + '">' +
                 esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
          }
          h += '<td class="acts"><button data-a="off" title="Ligne officielle">★</button>' +
               '<button data-a="dup" title="Dupliquer">⧉</button>' +
               '<button data-a="del" title="Supprimer">✕</button></td></tr>';
        }
        h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
      } else {
        h += '<div class="items">';
        for(var ii = 0; ii < s.items.length; ii++){
          h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
               '<div class="txt" contenteditable data-t="item" data-g="' + gi + '" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
               '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
        }
        h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
      }
      h += '</div></div>';
    }
    h += '</div>';
  }

  h += '<h2 class="bloc">Légende</h2>';
  {
    h += '<div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div><button class="addrow" data-a="addleg">+ Entrée de légende</button>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Chaque frappe part vers la base en ligne, ' +
       'rien à valider. L\'étoile marque une ligne officielle, en italique. Survoler une cellule affiche ' +
       'les définitions reconnues. Le bouton PDF imprime la page, le bouton Push republie le contenu du ' +
       'fichier par-dessus la base.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var g = +el.getAttribute('data-g'), s = +el.getAttribute('data-s'),
      r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c'),
      i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent, S = (data.groups[g] && data.groups[g].sections) ? data.groups[g].sections[s] : null;
  if(t === 'intro') data.intro = v;
  else if(t === 'gt') data.groups[g].title = v;
  else if(t === 'gn') data.groups[g].note = v;
  else if(t === 'st') S.title = v;
  else if(t === 'sn') S.note = v;
  else if(t === 'sf') S.foot = v;
  else if(t === 'col') S.cols[c] = v;
  else if(t === 'cell') S.rows[r].c[c] = v;
  else if(t === 'item') S.items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(a === 'addleg'){
    if(!data.legend) data.legend = [];
    data.legend.push({off:false, term:'Nouveau mot-clé', def:'Définition.'});
    sauver(); rendre();
    var els = document.querySelectorAll('.leg .term');
    if(els.length) els[els.length - 1].focus();
    return;
  }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var gi = +sec.getAttribute('data-g'), si = +sec.getAttribute('data-s');
  var LST = data.groups[gi].sections, S = LST[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < LST.length){
      var tmp = LST[si]; LST[si] = LST[n]; LST[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('q').oninput = function(){

    }

  }
  var grps = document.querySelectorAll('.grp');
  for(var g = 0; g < grps.length; g++){
    var restant = grps[g].querySelectorAll('.sec:not(.hid)').length;
    grps[g].classList.toggle('hid', !!q && restant === 0);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
</script>
