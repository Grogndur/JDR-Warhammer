<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blessures, Maladies et Soins</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#4f8f7a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1240px;margin:0 auto;padding:1rem .9rem 4rem}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
var DEFAUT = {"sections": [{"kind": "texte", "title": "Comment lire ce guide, en six points", "note": "Ces six points suffisent à jouer. Le reste détaille.", "items": ["Un personnage perd des Blessures. Tant qu'il lui en reste, il va bien, il a seulement mal.", "À zéro Blessure, tout dégât supplémentaire provoque une Blessure Critique. C'est là que le corps casse pour de bon.", "Une Blessure Critique se lit dans la table de sa localisation, plus bas dans ce document. La ligne tirée donne l'effet immédiat, la gravité, le soin réclamé et la durée de convalescence.", "Le guide enchaîne ensuite sur qui peut donner ce soin, ce qui arrive pendant la convalescence, et ce qui se passe quand personne ne s'en occupe.", "Une blessure mal soignée s'infecte. Une infection négligée devient une maladie. Une maladie non traitée tue, lentement.", "Les remèdes sont dans le document Drogues, Poisons, Herbes et Potions. Les plantes qui les composent sont dans le Catalogue des Matières. Ce guide dit quand les employer."], "foot": ""}, {"kind": "texte", "title": "Ce que fait la compétence Guérison", "note": "Règles du livre de base, entrée Guérison et talent Chirurgie. Rien d'inventé dans cette section.", "items": ["Guérison est une compétence avancée, basée sur l'Intelligence. Un test réussi permet l'une des quatre choses suivantes, une seule à la fois.", "Diagnostiquer. Reconnaître une pathologie, une infection ou une maladie. C'est le test qui dit de quoi souffre le patient.", "Traiter une maladie. Voir plus bas la section qui lui est consacrée.", "Rendre des Blessures. Le patient récupère un nombre de Blessures égal au Bonus d'Intelligence du soignant plus les DR obtenus. Un patient ne bénéficie que d'un seul jet de Guérison après chaque rencontre. Avec des liquides stériles, des pansements ou des cataplasmes adaptés, aucune infection ne se déclare ensuite.", "Arrêter une hémorragie. Le test retire un État Hémorragique, et chaque DR en retire un de plus.", "L'échec fait mal. Si le Bonus d'Intelligence du soignant plus les DR donne un total inférieur à zéro, le patient perd des Blessures. Sur un Échec Stupéfiant, il attrape en plus une Infection mineure.", "Veiller un malade. Un test de Guérison réussi protège le soignant de la maladie pour la journée. Chaque DR protège en plus une autre personne qui a croisé le patient ce jour-là. Chaque journée complète de soins réduit la durée de la maladie de 1, jusqu'à un minimum de 1.", "Le talent Chirurgie permet de traiter toute Blessure Critique qui réclame de la chirurgie. Il ne s'emploie qu'en dehors des rounds de combat, quand on a le temps de faire les choses correctement."], "foot": "Trois autres talents officiels comptent ici. Endurci fait ignorer un Point de Blessure perdu par État Hémorragique, par niveau. Robuste réduit de 1 tous les dégâts subis, par niveau, avec un minimum de 1 Blessure. Résistance (Maladie) ou Résistance (Poison) fait réussir automatiquement le premier test de la séance contre la menace nommée."}, {"kind": "table", "title": "Qui peut soigner quoi", "note": "Répartition maison. Elle sert surtout à répondre à la question que la table pose vraiment : dans ce village, qui peut nous aider ?", "cols": ["Soignant", "Compétence employée", "Ce qu’il traite", "Ce qu’il ne peut pas", "Où le trouver"], "rows": [{"c": ["Un compagnon sans formation", "Premiers Secours, ou rien", "Poser un garrot, immobiliser un membre, porter le blessé", "Rendre des Blessures, refermer un critique", "À côté de vous"], "off": false}, {"c": ["Barbier-chirurgien", "Guérison, souvent avec Chirurgie", "Les critiques qui demandent de la chirurgie, les fractures, les amputations", "Les maladies, qu'il traite par la saignée et donc mal", "Toute ville, souvent au fond d'une échoppe"], "off": false}, {"c": ["Apothicaire", "Guérison et Métier (Apothicaire)", "Les poisons, les infections, les maladies par remède, la douleur", "Ouvrir un corps sans le talent Chirurgie", "Boutique de bourg ou de ville, avec licence"], "off": false}, {"c": ["Herboriste", "Métier (Herboriste), parfois Guérison", "Les plaies légères, les états Hémorragique par cataplasme, les fièvres", "Toute Blessure Critique, tout ce qui demande une lame", "Marché, colportage, cabane à l'écart"], "off": false}, {"c": ["Prêtre ou sœur de Shallya", "Guérison, et parfois un miracle", "Tout, y compris ce que les autres abandonnent", "Refuser de soigner un ennemi, ce que son ordre lui interdit", "Temple, hospice, léproserie"], "off": false}, {"c": ["Sorcière de village", "Métier ou Guérison, charmes et simples", "Les fièvres, les accouchements, les blessures qu'on cache", "Se présenter au grand jour sans risque", "En marge du village, la nuit"], "off": false}, {"c": ["Un vétérinaire ou un maréchal-ferrant", "Soin aux animaux", "Les bêtes, et un homme s'il n'y a personne d'autre", "Faire mieux qu'un boucher sur un humain : tous ses tests à -20", "Toute écurie"], "off": false}], "foot": ""}, {"kind": "texte", "title": "Lire un critique, en quatre gestes", "note": "Le premier geste suit la méthode du livre de base. Les tables sont maison, écrites pour tenir dans ce document et se lire sans rien ouvrir d'autre.", "items": ["Premier geste, la localisation. On inverse les deux chiffres du jet d'attaque et on lit le résultat : 01 à 09 la tête, 10 à 24 le bras gauche, 25 à 44 le bras droit, 45 à 79 le corps, 80 à 89 la jambe gauche, 90 à 00 la jambe droite.", "Deuxième geste, le tirage. On prend la table de cette localisation, plus bas dans ce document, et on lance 1d100.", "Troisième geste, l'application. La ligne donne l'effet immédiat, qui prend effet tout de suite, et sa gravité.", "Quatrième geste, la suite. La même ligne donne le soin réclamé et la durée de convalescence. On note les deux sur la fiche, et on passe au round suivant.", "Exemple complet. Un mercenaire à zéro Blessure encaisse encore trois dégâts. L'attaque avait été réussie avec un jet de 41 : inversé, cela donne 14, donc le bras gauche. Le MJ lance 1d100 sur la table des bras et obtient 63 : fracture ouverte. Deux états Hémorragique, bras gauche inutilisable, gravité Grave. Il faut un chirurgien, et le mercenaire est immobilisé 2d10 jours. Le groupe a un barbier-chirurgien sous la main : il réussit son test de Guérison Difficile, referme la plaie et retire un état Hémorragique, plus un par DR obtenu. Reste la convalescence, et un jet d'infection le lendemain matin.", "Les critiques s'accumulent. Un personnage qui en prend un deuxième tire normalement, et les deux effets s'appliquent en même temps. C'est ainsi qu'un combat tourne mal en trois rounds."], "foot": ""}, {"kind": "table", "title": "Les Blessures Critiques, par gravité", "note": "Grille de lecture des quatre tables qui suivent. Chaque ligne de critique porte une gravité, et cette gravité donne le soin réclamé et la durée pendant laquelle le personnage reste hors jeu.", "cols": ["Gravité", "Ce que ça donne", "Soin réclamé", "Convalescence", "Si personne ne fait rien"], "rows": [{"c": ["Légère", "Coupure profonde, doigt cassé, arcade ouverte", "Un test de Guérison Intermédiaire (+0)", "1d10 heures", "Guérit seule, mais un jet d'infection est à faire"], "off": false}, {"c": ["Sérieuse", "Os fêlé, tendon entaillé, œil tuméfié", "Un test de Guérison Difficile (-10)", "1d10 jours", "Le membre reste inutilisable jusqu'au soin, et l'infection est probable"], "off": false}, {"c": ["Grave", "Fracture ouverte, entaille jusqu'à l'os, perforation", "Guérison Difficile (-10) et le talent Chirurgie", "2d10 jours", "Infection certaine, puis Infection du Sang"], "off": false}, {"c": ["Mutilante", "Perte d'un doigt, d'une main, d'un œil, d'une oreille", "Chirurgie obligatoire, dans l'heure", "1d10 semaines", "Hémorragie mortelle en 1d10 rounds sans intervention"], "off": false}, {"c": ["Mortelle", "Le coup qui tue si rien n'est fait tout de suite", "Chirurgie, et un test de Guérison Très difficile (-30)", "1d10 semaines, plus une séquelle permanente", "Mort au terme du délai indiqué par la table du livre"], "off": false}], "foot": "Deux remèdes du site jouent ici. L'Onguent d'os brisé retire un jour de convalescence par soin réussi. La Graisse de troll referme une Blessure Critique légère en une nuit."}, {"kind": "table", "title": "Blessures Critiques : la tête", "note": "On tire 1d100 et on lit la ligne. La colonne Gravité renvoie à la grille de convalescence donnée plus haut, si bien que la ligne tirée dit tout : l'effet, le soin réclamé et le temps d'immobilisation.", "cols": ["1d100", "Blessure", "Effet immédiat", "Gravité", "Soin et convalescence"], "rows": [{"c": ["01-10", "Estafilade au front", "Le sang coule dans les yeux : 1 état Aveuglé", "Légère", "Une Action pour s'essuyer. Aucune convalescence"], "off": false}, {"c": ["11-20", "Nez brisé", "1 état Hémorragique et -10 en Sociabilité pendant 1d10 jours", "Légère", "Guérison Intermédiaire (+0). 1d10 heures"], "off": false}, {"c": ["21-30", "Oreille fendue", "1 état Assourdi qui dure jusqu'au soin", "Légère", "Guérison Intermédiaire (+0). 1d10 heures"], "off": false}, {"c": ["31-40", "Dents brisées", "-10 en Sociabilité de façon permanente jusqu'à remplacement", "Légère", "Guérison Intermédiaire (+0). 1d10 heures, et un dentiste"], "off": false}, {"c": ["41-50", "Mâchoire déboîtée", "Parler devient impossible. Tout test vocal échoue", "Sérieuse", "Guérison Difficile (-10) pour la remettre. 1d10 jours"], "off": false}, {"c": ["51-60", "Commotion", "1d10 états Sonné, puis -10 en Intelligence pendant 1d10 jours", "Sérieuse", "Repos surveillé. 1d10 jours"], "off": false}, {"c": ["61-70", "Arcade ouverte jusqu’à l’os", "2 états Hémorragique et 1 état Aveuglé", "Sérieuse", "Guérison Difficile (-10). 1d10 jours"], "off": false}, {"c": ["71-80", "Fracture du crâne", "État Inconscient pendant 1d10 heures, puis -20 en Intelligence", "Grave", "Chirurgie obligatoire. 2d10 jours"], "off": false}, {"c": ["81-88", "Œil perdu", "L'œil est crevé. -20 en Perception visuelle et -10 en Capacité d 0 jours"], "off": false}, {"c": ["61-70", "Fracture ouverte du fémur", "2 états Hémorragique et état À Terre permanent jusqu'au soin", "Grave", "Chirurgie obligatoire. 2d10 jours"], "off": false}, {"c": ["71-80", "Pied broyé", "Mouvement réduit de moitié définitivement", "Mutilante", "Chirurgie dans l'heure. 1d10 semaines"], "off": false}, {"c": ["81-90", "Jambe tranchée sous le genou", "4 états Hémorragique. La jambe est perdue", "Mutilante", "Cautérisation immédiate, puis Chirurgie. 1d10 semaines"], "off": false}, {"c": ["91-99", "Fémorale ouverte", "5 états Hémorragique. Mort en 1d10 rounds sans intervention", "Mortelle", "Garrot dans le round, puis Chirurgie. 1d10 semaines"], "off": false}, {"c": ["00", "Jambe arrachée à la hanche", "Mort en 1d10 rounds, sauf chirurgie dans le round", "Mortelle", "Chirurgie immédiate et Guérison Très difficile (-30)"], "off": false}], "foot": ""}, {"kind": "texte", "title": "L'infection", "note": "Le déclenchement par Échec Stupéfiant vient du livre. Les délais et les modificateurs sont maison.", "items": ["Quand elle menace. Après toute Blessure Critique soignée sans matériel propre, après une nuit passée dans la boue avec une plaie ouverte, et sur tout Échec Stupéfiant à un test de Guérison.", "Le test. Endurance Intermédiaire (+0), une fois par jour tant que la plaie n'est pas refermée. Le premier échec donne une Infection mineure.", "Ce qu'on peut faire avant. Le Cataplasme de guérison, 12 Pa, évite entièrement l'infection d'un critique traité avec lui. C'est douze pistoles bien employées.", "Ce qu'on peut faire après. Un test de Guérison réussi par jour réduit la durée de 1. L'eau-de-vie versée sur la plaie donne +10 au test d'Endurance du lendemain, et coûte un état Exténué de douleur.", "Si on ne fait rien. Une Infection mineure laissée dix jours devient une Infection du Sang, qui figure au catalogue plus bas et qui tue."], "foot": ""}, {"kind": "table", "title": "Les maladies du Reikland", "note": "Catalogue maison. Les trois premières lignes et la Peste noire ferment des renvois déjà présents ailleurs sur le site, qui ne menaient nulle part. Les autres sont là pour couvrir les biomes des deux campagnes.", "cols": ["Maladie", "Contraction", "Incubation", "Durée", "Effets", "Traitement"], "rows": [{"c": ["Infection mineure", "Plaie mal soignée, ou Échec Stupéfiant à un test de Guérison", "Immédiate", "1d10 jours", "-10 à toutes les caractéristiques physiques. La plaie ne se referme pas", "Guérison, un test par jour. Cataplasme de guérison en prévention"], "off": false}, {"c": ["Plaie purulente", "Infection mineure non traitée pendant trois jours", "1 jour", "2d10 jours", "-20 aux caractéristiques physiques, 1 Blessure perdue par jour, fièvre", "Guérison Difficile (-10) et un drainage. Le talent Chirurgie donne +20"], "off": false}, {"c": ["Infection du Sang", "Plaie purulente négligée, ou Blessure Critique grave non traitée", "1d10 jours", "Jusqu'à la mort ou la guérison", "1 Blessure perdue par jour, sans récupération possible. Test d'Endurance quotidien, trois échecs de suite et le personnage meurt", "Guérison Très difficile (-30) chaque jour. Amputation en dernier recours"], "off": false}, {"c": ["Courante galopante", "Eau croupie, viande tournée, auberge malpropre", "1d10 heures", "1d10 jours", "-10 en Force et en Endurance, aucun repos réparateur, un état Exténué qui revient chaque matin", "Tonique digestif, 3 Pa, +20 au test. Repos et eau claire"], "off": false}, {"c": ["Flux sanglant", "Courante galopante ignorée, ou eau de campement souillée", "1 jour", "2d10 jours", "Comme la Courante, plus 1 Blessure perdue par jour et l'impossibilité de voyager plus d'une demi-journée", "Tonique digestif, +20 au test. Un test de Guérison réussi par jour réduit la durée de 1"], "off": false}, {"c": ["Peste noire", "Contact avec un malade, une puce, un rat. Test d'Endurance Difficile (-10)", "1d10 jours", "1d10 jours", "Bubons, fièvre, -20 à toutes les caractéristiques. Test d'Endurance chaque jour, un échec coûte 1d10 Blessures. À zéro Blessure, le personnage meurt", "Racine de terre, 5 CO, annule les bubons et donne +10 à tous les tests liés à la maladie. Fleur de lune contre la douleur"], "off": false}, {"c": ["Fièvre des marais", "Nuit passée dans les marais du nord sans feu", "2d10 jours", "1d10 semaines", "Accès de fièvre tous les 1d10 jours. Pendant un accès, -30 à tout et aucune action utile", "Aucun remède connu. Les accès s'espacent avec le temps et la chaleur"], "off": false}, {"c": ["Suette des tranchées", "Campagne militaire, promiscuité, froid humide", "1d10 jours", "1d10 jours", "-10 à tout, transpiration continue, un état Exténué permanent tant qu'elle dure", "Repos au sec et au chaud. Un test de Guérison réussi par jour réduit la durée de 1"], "off": false}, {"c": ["Pourriture des Skavens", "Morsure de Skaven, ou plaie exposée à la malepierre", "1d10 heures", "2d10 jours", "1 Blessure perdue par jour, chair noircissante. À la fin, un test de Résistance ou 1 point de Corruption", "Guérison Très difficile (-30). Le feu et l'amputation valent mieux que la patience"], "off": false}], "foot": "Le format suit celui du livre de base : contraction, incubation, durée, effets. La virulence se module par des modificateurs au test de contraction, jamais en changeant les effets."}, {"kind": "texte", "title": "Soigner une maladie", "note": "", "items": ["Le diagnostic d'abord. Un test de Guérison réussi dit de quelle maladie il s'agit. Sans diagnostic, un soignant traite au hasard, et le MJ a le droit de le laisser se tromper.", "Le soin ensuite. Chaque journée complète passée auprès du patient par un soignant qui réussit son test de Guérison retire 1 à la durée de la maladie, sans jamais descendre sous 1 jour. C'est la règle du livre, et c'est la raison pour laquelle un malade se garde à la maison plutôt qu'on ne le transporte.", "Le remède en plus. Un remède du catalogue ne remplace pas le soin, il ajoute son bonus au test ou supprime un symptôme précis. La Racine de terre ne guérit pas la Peste noire, elle en fait tomber les bubons.", "La contagion. Un soignant qui réussit son test est protégé pour la journée. Chaque DR protège en plus une personne du groupe qui a croisé le malade. Un soignant qui rate son test tire lui-même pour la contraction.", "Le refus de soin. Un personnage peut refuser de rester couché. Il en a le droit, et chaque journée d'activité annule le bénéfice du soin de la veille."], "foot": ""}, {"kind": "table", "title": "Le repos et la récupération", "note": "Table maison. Elle répond à la question posée à chaque fin de séance : on récupère quoi, cette nuit ?", "cols": ["Situation", "Ce qu’on récupère", "Conditions"], "rows": [{"c": ["Une nuit correcte", "Bonus d'Endurance en Blessures", "Un abri, un repas chaud, pas de veille"], "off": false}, {"c": ["Une nuit dehors, sans feu", "Rien", "Et un test d'Endurance contre le froid"], "off": false}, {"c": ["Une journée entière de repos au lit", "Bonus d'Endurance doublé", "Un toit, quelqu'un pour apporter à manger"], "off": false}, {"c": ["Repos avec un soignant", "Bonus d'Endurance plus le Bonus d'Intelligence du soignant", "Un test de Guérison réussi dans la journée"], "off": false}, {"c": ["Une semaine à l’hospice de Shallya", "Toutes les Blessures, et un cran de gravité sur un critique en cours", "Une offrande, et l'acceptation du temple"], "off": false}, {"c": ["Convalescence d’un critique", "Rien tant qu'elle dure", "Le compteur de convalescence tourne même si le personnage voyage, mais un effort violent le remet à zéro"], "off": false}], "foot": ""}, {"kind": "table", "title": "Les États cités ailleurs sur le site", "note": "Renvoi rapide, limité aux États que les autres documents du site citent. La liste complète et l'effet chiffré de chacun sont au livre de base.", "cols": ["État", "Ce qu’il faut retenir", "Comment il part"], "rows": [{"c": ["Hémorragique", "Le personnage saigne. Il perd des Blessures régulièrement, et il finit par tomber", "Un test de Guérison, ou un cataplasme d'achillée, ou le Faxtoryll qui les retire tous sans test. Le talent Endurci en absorbe un par niveau"], "off": true}, {"c": ["Empoisonné", "Blessures continues et malus tant qu'il dure", "Un test d'Endurance selon la difficulté du poison, ou un antidote"], "off": true}, {"c": ["Enflammé", "Le personnage brûle et prend des dégâts chaque round", "Se rouler à terre, de l'eau, une couverture"], "off": true}, {"c": ["Exténué", "Fatigue accumulée. Chaque état donne un malus qui se cumule", "Une nuit complète en retire un. Certains remèdes en retirent un, une fois par jour"], "off": true}, {"c": ["Sonné", "Le personnage encaisse et ne fait plus rien d'utile ce round", "Un état part par round, ou plus vite avec de l'aide"], "off": true}, {"c": ["Inconscient", "Hors du combat, à la merci du premier venu", "Un test de Guérison, une gifle d'eau froide, ou le temps"], "off": true}], "foot": ""}, {"kind": "texte", "title": "Notes de MJ", "note": "", "items": ["La convalescence est le vrai levier. Un critique qui coûte 2d10 jours de lit change une campagne bien plus qu'un critique qui fait mal. Annonce la durée à voix haute au moment où elle tombe, le silence autour de la table vaut tous les discours.", "Ne fais jamais tirer une maladie sans avoir décidé de ce qu'elle apporte à l'histoire. Une Courante galopante avant une poursuite, oui. Une Courante galopante pendant un voyage sans enjeu, non.", "La Peste noire ne se met pas sur la table d'un groupe, elle se met sur un village. Le groupe décide s'il entre ou s'il passe au large, et cette décision-là vaut une séance.", "L'infection est la punition de l'imprudence, pas du malchanceux. Fais-la tomber sur ceux qui ont refusé de payer douze pistoles pour un cataplasme, pas sur ceux qui ont mal roulé.", "Un soignant dans le groupe change tout, et c'est voulu. Si personne n'a Guérison, laisse-les rencontrer une sœur de Shallya qui accepte de voyager une étape avec eux."], "foot": ""}, {"kind": "texte", "title": "Résumé pour le joueur, en six lignes", "note": "", "items": ["Tant qu'il me reste des Blessures, je vais bien. À zéro, le prochain coup me casse.", "J'inverse les chiffres du jet d'attaque pour trouver la localisation, puis je tire 1d100 sur la table correspondante.", "Ensuite je regarde ici : quel soin il faut, qui peut le donner, combien de temps je reste couché.", "Un critique mal soigné s'infecte. Une infection négligée devient une maladie. Une maladie non traitée tue.", "Un cataplasme de guérison à 12 pistoles évite toute infection sur un critique. C'est l'achat le plus rentable du jeu.", "Une journée complète auprès d'un soignant qui réussit son test retire un jour à ma maladie."], "foot": ""}], "legend": [{"off": true, "term": "Blessure Critique", "def": "Se produit quand un personnage à zéro Blessure subit encore des dégâts. Se lit dans la table de la localisation touchée, dans ce document."}, {"off": true, "term": "Échec Stupéfiant", "def": "Officiel. Un échec de 6 DR ou plus. Sur un test de Guérison, il donne une Infection mineure au patient."}, {"off": true, "term": "Chirurgie", "def": "Officiel. Talent qui permet de traiter toute Blessure Critique réclamant de la chirurgie, hors combat et avec le temps de bien faire."}, {"off": false, "term": "Convalescence", "def": "Maison. Le temps pendant lequel un critique soigné empêche encore de se battre, de voyager vite ou de travailler."}, {"off": false, "term": "Incubation", "def": "Le délai entre la contraction d'une maladie et l'apparition des premiers effets. Le personnage est déjà contagieux pendant ce temps."}, {"off": false, "term": "Séquelle", "def": "Ce qui reste après la guérison. Une raideur, une cicatrice, un doigt manquant. Se note sur la fiche et ne se retire pas."}], "intro": "Les passages tirés du livre de base sont signalés comme tels, le reste est maison. Monnaie : CO couronne d'or, Pa pistole d'argent, Sc sou de cuivre. 1 CO = 20 Pa, 1 Pa = 12 Sc."};

/* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

/* ---------- lecture initiale : cache local, puis la base fait autorité ---------- */
function charger(){
  try{
    var brut = localStorage.getItem(CACHE);
    if(brut){ data = normaliser(JSON.parse(brut)); }
  }catch(e){}
  if(!data) data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}
function cacher(){
  try{ localStorage.setItem(CACHE, JSON.stringify(data)); }catch(e){}
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  cacher();
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

}

if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    cacher();
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') return JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  d.sections = tab(d.sections);
  for(var i = 0; i < d.sections.length; i++){
    var s = d.sections[i];
    s.kind = s.kind || 'texte';
    s.title = s.title || '';
    s.note = s.note || '';
    s.foot = s.foot || '';
    if(s.kind === 'table'){
      s.cols = tab(s.cols);
      s.rows = tab(s.rows);
      for(var r = 0; r < s.rows.length; r++){
        s.rows[r] = s.rows[r] || {};
        s.rows[r].c = tab(s.rows[r].c);
        s.rows[r].off = !!s.rows[r].off;
      }
    } else {
      s.items = tab(s.items);
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def = d.legend[l].def || '';
    d.legend[l].off = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 || n.indexOf('serv') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var si = 0; si < data.sections.length; si++){
    var s = data.sections[si];
    var n = (s.kind === 'table') ? s.rows.length : s.items.length;
    h += '<div class="sec" data-s="' + si + '">';
    h += '<div class="sechead">';
    h +=   '<button data-a="fold">▾</button>';
    h +=   '<span class="t" contenteditable data-t="st" data-s="' + si + '">' + esc(s.title) + '</span>';
    h +=   '<span class="n">' + n + '</span>';
    h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
    h +=   '<button data-a="delsec">Supprimer</button>';
    h += '</div>';
    h += '<div class="snote" contenteditable data-t="sn" data-s="' + si + '">' + esc(s.note || '') + '</div>';
    h += '<div class="secbody">';

    var PIED = s.foot || s.foot === '' ? '<div class="sfoot" contenteditable data-t="sf" data-s="' + si + '">' + esc(s.foot || '') + '</div>' : '';
    if(s.kind === 'table'){
      h += '<table><thead><tr>';
      for(var ci = 0; ci < s.cols.length; ci++)
        h += '<th contenteditable data-t="col" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
      h += '<th></th></tr></thead><tbody>';
      for(var ri = 0; ri < s.rows.length; ri++){
        var r = s.rows[ri];
        h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
        for(var k = 0; k < s.cols.length; k++){
          var mot = (s.cols[k] || '').toLowerCase();
          var cle = (mot.indexOf('atout') === 0 || mot.indexOf('mots') >= 0 || mot.indexOf('effet') === 0) ? ' data-atout="1"' : '';
          h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
               '" data-s="' + si +
               '" data-r="' + ri + '" data-c="' + k + '"' + cle + '>' + esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
        }
        h += '<td class="acts"><button data-a="off" title="Ligne du livre">★</button>' +
             '<button data-a="dup" title="Dupliquer">⧉</button>' +
             '<button data-a="del" title="Supprimer">✕</button></td></tr>';
      }
      h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
    } else {
      h += '<div class="items">';
      for(var ii = 0; ii < s.items.length; ii++){
        h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
             '<div class="txt" contenteditable data-t="item" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
             '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
      }
      h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
    }
    h += '</div>';
    h += '</div>';
  }

  if(data.legend && data.legend.length){
    h += '<h2 class="bloc">Légende</h2><div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Synchronisation automatique avec la base en ligne, sans rien à valider. Survoler une cellule d\'effet affiche les définitions reconnues.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var s = +el.getAttribute('data-s'), r = +el.getAttribute('data-r'),
      c = +el.getAttribute('data-c'), i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent;
  if(t === 'intro') data.intro = v;
  else if(t === 'st') data.sections[s].title = v;
  else if(t === 'sn') data.sections[s].note = v;
  else if(t === 'sf') data.sections[s].foot = v;
  else if(t === 'col') data.sections[s].cols[c] = v;
  else if(t === 'cell') data.sections[s].rows[r].c[c] = v;
  else if(t === 'item') data.sections[s].items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var si = +sec.getAttribute('data-s'), S = data.sections[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'delsec'){
    if(confirm('Supprimer la section « ' + S.title + ' » ?')){ data.sections.splice(si,1); sauver(); rendre(); }
    return;
  }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < data.sections.length){
      var tmp = data.sections[si]; data.sections[si] = data.sections[n]; data.sections[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('b-tab').onclick = function(){
  var modele = null;
  for(var i = 0; i < data.sections.length; i++) if(data.sections[i].kind === 'table'){ modele = data.sections[i]; break; }
  data.sections.push({kind:'table', title:'Nouveau tableau', note:'', foot:'',
    cols: modele ? modele.cols.slice() : ['Objet','Coût','Disponibilité','Effet'], rows:[]});
  sauver(); rendre();
};
document.getElementById('b-txt').onclick = function(){
  data.sections.push({kind:'texte', title:'Nouvelle section', note:'', foot:'', items:['À rédiger.']});
  sauver(); rendre();
};
document.getElementById('b-leg').onclick = function(){
  if(!data.legend) data.legend = [];
  data.legend.push({off:false, term:'Nouveau mot-clé', def:'Définition.'});
  sauver(); rendre();
  var els = document.querySelectorAll('.leg .term');
  if(els.length) els[els.length-1].focus();
};
document.getElementById('b-fold').onclick = function(){
  var secs = document.querySelectorAll('.sec');
  var fermer = !document.querySelector('.sec.closed');
  for(var i = 0; i < secs.length; i++) secs[i].classList.toggle('closed', fermer);
  this.textContent = fermer ? 'Déplier tout' : 'Replier tout';
};
document.getElementById('b-print').onclick = function(){ window.print(); };
document.getElementById('b-push').onclick = pousserFichier;

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
</script>
