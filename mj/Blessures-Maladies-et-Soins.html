<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blessures, Maladies et Soins</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#4f8f7a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1240px;margin:0 auto;padding:1rem .9rem 4rem}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
var DEFAUT = {"sections": [{"kind": "texte", "title": "Le moteur en six points", "note": "", "items": ["Un personnage perd des Blessures. Tant qu'il lui en reste, il n'a aucune pénalité : ce sont des coupures, des bleus, des traumatismes mineurs.", "Une Blessure Critique arrive quand on subit plus de Points de Blessure qu'il n'en reste. On lance 1d100 sur la table de la localisation touchée.", "La ligne tirée donne les Points de Blessure perdus, qui ignorent le Bonus d'Endurance et les Points d'Armure, plus les effets supplémentaires.", "Un critique n'est guéri que lorsque tous ses États sont retirés et tous ses modificateurs non permanents supprimés. Un personnage qui en a reçu un est Gravement Blessé.", "Une blessure mal soignée s'infecte. Une infection négligée devient une maladie. Les neuf maladies et les douze symptômes sont plus bas.", "Les remèdes sont dans Drogues, Poisons, Herbes et Potions. Les plantes qui les composent sont dans le Catalogue des Matières. Ce guide dit quand les employer."], "foot": ""}, {"kind": "texte", "title": "Lire un critique, en trois gestes", "note": "Méthode du livre de base.", "items": ["Premier geste, la localisation. Pour une Blessure Critique ordinaire, c'est celle déjà déterminée par l'attaque, en inversant les deux chiffres du jet : 01 à 09 la tête, 10 à 24 le bras gauche, 25 à 44 le bras droit, 45 à 79 le corps, 80 à 89 la jambe gauche, 90 à 00 la jambe droite.", "Pour un Coup Critique, on n'inverse rien : on lance 1d100 pour la localisation, puis 1d100 sur la table correspondante. Les dégâts non critiques de l'attaque se calculent ensuite sur cette nouvelle localisation.", "Deuxième geste, le tirage. 1d100 sur la table de la localisation, plus bas dans ce document.", "Troisième geste, l'application. Les Points de Blessure indiqués se perdent en ignorant le Bonus d'Endurance et les Points d'Armure. Puis on applique les effets.", "Exemple. Un mercenaire à zéro Blessure encaisse trois dégâts. L'attaque avait touché avec un jet de 41, inversé en 14, donc le bras gauche. Le MJ lance 63 sur la table des bras : coupure profonde, 3 Points de Blessure, 2 Hémorragique, 1 Sonné, une Déchirure musculaire mineure, et un test de Résistance à -20 pour éviter l'Inconscience.", "Les critiques s'accumulent. Un deuxième se tire normalement, et les deux effets s'appliquent ensemble."], "foot": ""}, {"kind": "table", "title": "Blessures Critiques : la tête", "note": "Tables du livre de base. Les Points de Blessure indiqués se perdent en ignorant le Bonus d'Endurance et les Points d'Armure. Un critique n'est guéri que lorsque tous ses États sont retirés et tous ses modificateurs non permanents supprimés.", "cols": ["1d100", "Blessure", "Pts", "Effets"], "rows": [{"c": ["01-10", "Blessure spectaculaire", "1", "1 Hémorragique. Une fois guérie, la cicatrice donne +1 DR à certains tests sociaux"], "off": true}, {"c": ["11-20", "Coupure mineure", "1", "1 Hémorragique"], "off": true}, {"c": ["21-25", "Coup à l'œil", "1", "1 Aveuglé"], "off": true}, {"c": ["26-30", "Frappe à l'oreille", "1", "1 Assourdi"], "off": true}, {"c": ["31-35", "Coup percutant", "2", "1 Sonné"], "off": true}, {"c": ["36-40", "Œil au beurre noir", "2", "2 Aveuglé"], "off": true}, {"c": ["41-45", "Oreille tranchée", "2", "2 Assourdi et 1 Hémorragique"], "off": true}, {"c": ["46-50", "En plein front", "2", "2 Hémorragique et 1 Aveuglé, qui ne part qu'une fois tous les Hémorragique retirés"], "off": true}, {"c": ["51-55", "Mâchoire fracturée", "3", "2 Sonné. Fracture (Mineure)"], "off": true}, {"c": ["56-60", "Blessure majeure à l'œil", "3", "1 Hémorragique et 1 Aveuglé, retiré seulement par Aide médicale"], "off": true}, {"c": ["61-65", "Blessure majeure à l'oreille", "3", "-20 définitif à tout test lié à l'audition. Une seconde fois : surdité totale, que seule la magie guérit"], "off": true}, {"c": ["66-70", "Nez cassé", "3", "2 Hémorragique. Résistance (+0) ou 1 Sonné. Une fois guérie, +1 ou -1 DR aux tests sociaux selon le contexte, jusqu'à Chirurgie"], "off": true}, {"c": ["71-75", "Mâchoire cassée", "4", "3 Sonné. Résistance (+0) ou Inconscient. Fracture (Majeure)"], "off": true}, {"c": ["76-80", "Commotion cérébrale", "4", "1 Assourdi, 2 Hémorragique, 1d10 Sonné, et 1 Exténué pendant 1d10 jours. Un autre critique à la tête pendant ce temps : Résistance (+20) ou Inconscient"], "off": true}, {"c": ["81-85", "Bouche explosée", "4", "2 Hémorragique. 1d10 dents. Amputation (Facile)"], "off": true}, {"c": ["86-90", "Oreille mutilée", "4", "3 Assourdi, 2 Hémorragique. Oreille perdue. Amputation (Accessible)"], "off": true}, {"c": ["91-93", "Œil crevé", "5", "3 Aveuglé, 2 Hémorragique, 1 Sonné. Œil perdu. Amputation (Complexe)"], "off": true}, {"c": ["94-96", "Coup défigurant", "5", "3 Hémorragique, 3 Aveuglé, 2 Sonné. Œil et nez perdus. Amputation (Difficile)"], "off": true}, {"c": ["97-99", "Mâchoire mutilée", "5", "4 Hémorragique, 3 Sonné. Résistance (-30) ou Inconscient. Fracture (Majeure), langue et 1d10 dents perdues. Amputation (Difficile)"], "off": true}, {"c": ["00", "Décapitation", "Mort", "Mort sur le coup"], "off": true}], "foot": ""}, {"kind": "table", "title": "Blessures Critiques : les bras", "note": "Tables du livre de base.", "cols": ["1d100", "Blessure", "Pts", "Effets"], "rows": [{"c": ["01-10", "Choc au bras", "1", "Lâchez ce que vous teniez"], "off": true}, {"c": ["11-20", "Coupure mineure", "1", "1 Hémorragique"], "off": true}, {"c": ["21-25", "Torsion", "1", "Déchirure musculaire (Mineure)"], "off": true}, {"c": ["26-30", "Choc violent au bras", "2", "Lâchez l'objet. Main inutilisable 1d10 moins le Bonus d'Endurance rounds, minimum 1, et comptée comme perdue pendant ce temps"], "off": true}, {"c": ["31-35", "Déchirure musculaire", "2", "1 Hémorragique et Déchirure musculaire (Mineure)"], "off": true}, {"c": ["36-40", "Main ensanglantée", "2", "1 Hémorragique. Tant qu'il dure, Dextérité (+20) avant toute action tenant un objet de cette main, sinon l'objet glisse"], "off": true}, {"c": ["41-45", "Clef de bras", "2", "Lâchez l'objet. Bras inutilisable 1d10 rounds"], "off": true}, {"c": ["46-50", "Blessure béante", "3", "2 Hémorragique. Jusqu'à Chirurgie, tout nouveau dégât au bras donne 1 Hémorragique"], "off": true}, {"c": ["51-55", "Cassure nette", "3", "Lâchez l'objet. Fracture (Mineure). Résistance (-10) ou 1 Sonné"], "off": true}, {"c": ["56-60", "Ligament rompu", "3", "Lâchez l'objet. Déchirure musculaire (Majeure)"], "off": true}, {"c": ["61-65", "Coupure profonde", "3", "2 Hémorragique, 1 Sonné, Déchirure musculaire (Mineure). Résistance (-20) ou Inconscient"], "off": true}, {"c": ["66-70", "Artère endommagée", "4", "4 Hémorragique. Jusqu'à Chirurgie, tout dégât à cette localisation donne 2 Hémorragique"], "off": true}, {"c": ["71-75", "Coude fracassé", "4", "Lâchez l'objet. Fracture (Majeure)"], "off": true}, {"c": ["76-80", "Épaule luxée", "4", "Résistance (-20) ou Sonné et À Terre. Lâchez l'objet, bras inutilisable et compté comme perdu. 1 Sonné jusqu'à Aide médicale, puis test étendu de Guérison (+20) à 6 DR pour récupérer l'usage. -10 aux tests de ce bras pendant 1d10 jours"], "off": true}, {"c": ["81-85", "Doigt sectionné", "4", "1 Hémorragique. Amputation (Accessible)"], "off": true}, {"c": ["86-90", "Main ouverte", "5", "1 doigt perdu, Amputation (Complexe). 2 Hémorragique, 1 Sonné. Un doigt de plus par round sans Aide médicale ; tous les doigts perdus font perdre la main"], "off": true}, {"c": ["91-93", "Biceps déchiqueté", "5", "Lâchez l'objet. Déchirure musculaire (Majeure), 2 Hémorragique, 1 Sonné"], "off": true}, {"c": ["94-96", "Main mutilée", "5", "Main perdue, Amputation (Difficile). 2 Hémorragique. Résistance (-20) ou Sonné et À Terre"], "off": true}, {"c": ["97-99", "Tendons coupés", "5", "Bras inutilisable, Amputation (Très Difficile). 3 Hémorragique, 1 À Terre, 1 Sonné. Résistance (-20) ou Inconscient"], "off": true}, {"c": ["00", "Démembrement brutal", "Mort", "Mort sur le coup"], "off": true}], "foot": ""}, {"kind": "table", "title": "Blessures Critiques : le torse", "note": "Tables du livre de base.", "cols": ["1d100", "Blessure", "Pts", "Effets"], "rows": [{"c": ["01-10", "Rien qu'une égratignure", "1", "1 Hémorragique"], "off": true}, {"c": ["11-20", "Coup au ventre", "1", "1 Sonné. Résistance (+40) ou vomissement et À Terre"], "off": true}, {"c": ["21-25", "Coup bas", "1", "Résistance (-20) ou 3 Sonné"], "off": true}, {"c": ["26-30", "Torsion du dos", "1", "Déchirure musculaire (Mineure)"], "off": true}, {"c": ["31-35", "Souffle coupé", "2", "1 Sonné. Résistance (+20) ou À Terre. Mouvement réduit de moitié pendant 1d10 rounds"], "off": true}, {"c": ["36-40", "Bleus aux côtes", "2", "-10 aux tests d'Agilité pendant 1d10 jours"], "off": true}, {"c": ["41-45", "Clavicule tordue", "2", "Un bras au hasard lâche ce qu'il tenait et reste inutilisable 1d10 rounds"], "off": true}, {"c": ["46-50", "Chairs déchirées", "2", "2 Hémorragique"], "off": true}, {"c": ["51-55", "Côtes fracturées", "3", "1 Sonné. Fracture (Mineure)"], "off": true}, {"c": ["56-60", "Blessure béante", "3", "3 Hémorragique. Jusqu'à Chirurgie, chaque blessure à cette localisation donne 1 Hémorragique"], "off": true}, {"c": ["61-65", "Entaille douloureuse", "3", "2 Hémorragique, 1 Sonné. Résistance (-20) ou Inconscient. En dessous de 4 DR, vous hurlez de douleur"], "off": true}, {"c": ["66-70", "Dégâts artériels", "3", "4 Hémorragique. Jusqu'à Chirurgie, chaque nouvelle blessure ici donne 2 Hémorragique"], "off": true}, {"c": ["71-75", "Dos froissé", "4", "Déchirure musculaire (Majeure)"], "off": true}, {"c": ["76-80", "Hanche fracturée", "4", "1 Sonné. Résistance (+0) ou À Terre. Fracture (Mineure)"], "off": true}, {"c": ["81-85", "Blessure majeure au torse", "4", "4 Hémorragique. Jusqu'à Chirurgie, chaque nouvelle blessure ici donne 2 Hémorragique de plus"], "off": true}, {"c": ["86-90", "Blessure au ventre", "4", "Blessure Purulente contractée, et 2 Hémorragique"], "off": true}, {"c": ["91-93", "Cage thoracique perforée", "5", "1 Sonné retiré seulement par Aide médicale. Fracture (Majeure)"], "off": true}, {"c": ["94-96", "Clavicule cassée", "5", "Inconscient jusqu'à Aide médicale. Fracture (Majeure)"], "off": true}, {"c": ["97-99", "Hémorragie interne", "5", "1 Hémorragique retiré seulement par Chirurgie. Infection du sang contractée"], "off": true}, {"c": ["00", "Éventré", "Mort", "Mort sur le coup"], "off": true}], "foot": ""}, {"kind": "table", "title": "Blessures Critiques : la jambe", "note": "Tables du livre de base.", "cols": ["1d100", "Blessure", "Pts", "Effets"], "rows": [{"c": ["01-10", "Orteil contusionné", "1", "Résistance (+20) ou -10 aux tests d'Agilité jusqu'à la fin du tour suivant"], "off": true}, {"c": ["11-20", "Cheville tordue", "1", "-10 aux tests d'Agilité pendant 1d10 rounds"], "off": true}, {"c": ["21-25", "Coupure mineure", "1", "1 Hémorragique"], "off": true}, {"c": ["26-30", "Perte d'équilibre", "1", "Résistance (+0) ou À Terre"], "off": true}, {"c": ["31-35", "Coup à la cuisse", "2", "1 Hémorragique. Résistance (+20) ou À Terre"], "off": true}, {"c": ["36-40", "Cheville foulée", "2", "Déchirure musculaire (Mineure)"], "off": true}, {"c": ["41-45", "Genou tordu", "2", "-20 aux tests d'Agilité pendant 1d10 rounds"], "off": true}, {"c": ["46-50", "Coupure à l'orteil", "2", "1 Hémorragique. Après la rencontre, Résistance (+0) ou orteil perdu, Amputation (Accessible)"], "off": true}, {"c": ["51-55", "Mauvaise coupure", "3", "2 Hémorragique. Résistance (+0) ou À Terre"], "off": true}, {"c": ["56-60", "Genou méchamment tordu", "3", "Déchirure musculaire (Majeure)"], "off": true}, {"c": ["61-65", "Jambe charcutée", "3", "2 Hémorragique, 1 À Terre, Fracture (Mineure). Résistance (-20) ou Sonné"], "off": true}, {"c": ["66-70", "Cuisse lacérée", "3", "3 Hémorragique. Résistance (+0) ou À Terre. Jusqu'à Chirurgie, chaque dégât à cette jambe donne 1 Hémorragique"], "off": true}, {"c": ["71-75", "Tendon rompu", "4", "À Terre et Sonné. Résistance (-20) ou Inconscient. Jambe inutilisable. Déchirure musculaire (Majeure)"], "off": true}, {"c": ["76-80", "Entaille au tibia", "4", "Sonné et À Terre. Déchirure musculaire (Majeure) et Fracture (Mineure)"], "off": true}, {"c": ["81-85", "Genou cassé", "4", "1 Hémorragique, 1 Sonné, 1 À Terre. Fracture (Majeure)"], "off": true}, {"c": ["86-90", "Genou démis", "4", "À Terre. Résistance (-20) ou Sonné, retiré seulement par Aide médicale. Ensuite test étendu de Guérison (+20) à 6 DR. Mouvement réduit de moitié et -10 aux tests de cette jambe pendant 1d10 jours"], "off": true}, {"c": ["91-93", "Pied écrasé", "5", "Résistance (+20) ou À Terre et perte d'un orteil, plus un par DR en dessous de 0, Amputation (Accessible). 2 Hémorragique. Sans Chirurgie sous 1d10 jours, le pied est perdu"], "off": true}, {"c": ["94-96", "Pied sectionné", "5", "Pied sectionné, Amputation (Difficile). 3 Hémorragique, 2 Sonné, 1 À Terre"], "off": true}, {"c": ["97-99", "Tendon coupé", "5", "2 Hémorragique, 2 Sonné, 1 À Terre. Jambe inutilisable, Amputation (Très Difficile)"], "off": true}, {"c": ["00", "Bassin fracassé", "Mort", "Mort sur le coup"], "off": true}], "foot": ""}, {"kind": "texte", "title": "Fractures", "note": "Règles du livre de base.", "items": ["Mineure. L'os est cassé mais reste aligné. La localisation devient inutilisable jusqu'à guérison. Pour un bras ou une jambe, on applique la règle du membre sectionné. Pour la tête, régime liquide et -30 à tous les tests de Langue. Pour le torse, -30 en Force et en Agilité, Mouvement divisé par deux.", "Guérison d'une mineure. 30+1d10 jours. À la fin, une Résistance (+20) réussie signifie aucune séquelle. Un échec laisse -5 permanent aux tests d'Agilité, ou aux tests de Langue pour une tête mal guérie.", "Le raccourci. Un test de Guérison (+20) réussi dans la semaine qui suit la fracture dispense du test de Résistance, à condition que la zone reste bandée et maintenue pendant toute la guérison. Bandage défait, il faut un second test de Guérison (+20) sous 24 heures.", "Majeure. L'os est brisé de travers ou éclaté. Mêmes effets que la mineure, mais la guérison dure 10 jours de plus, les tests passent en Intermédiaire (+0) et les pénalités d'échec montent à -10."], "foot": ""}, {"kind": "texte", "title": "Déchirures musculaires", "note": "Règles du livre de base.", "items": ["Mineure. -10 à tous les tests concernant cette localisation. Si c'est une jambe, Mouvement réduit de moitié.", "Guérison d'une mineure. 30 moins le Bonus d'Endurance jours. Un test de Guérison réduit cette durée d'un jour, plus un par DR, une seule fois.", "Majeure. Mêmes effets, avec des pénalités à -20.", "Guérison d'une majeure. 30 moins le Bonus d'Endurance jours, après quoi la pénalité tombe à -10. Il faut une seconde période de même durée pour guérir complètement. La compétence Guérison ne sert alors qu'à informer le patient."], "foot": ""}, {"kind": "texte", "title": "Amputations", "note": "Règles du livre de base.", "items": ["Le test. Chaque fois qu'un critique indique Amputation avec une difficulté, il faut réussir un test de Résistance à cette difficulté ou gagner 1 état À Terre. Sur un échec de -2 DR ou pire, 1 état Sonné en plus. Sur un échec de -4 DR ou pire, l'état Inconscient.", "La suite. Toute amputation doit être traitée par la chirurgie. Une Blessure ne guérit pas tant qu'un chirurgien ne s'est pas occupé de l'amputation.", "Doigts. Sur la première perte, tout échec dont le chiffre des unités est 1 devient une Maladresse. Deux doigts, ce sont les 1 et les 2, et ainsi de suite. -5 par doigt perdu aux tests de cette main. Au-delà de quatre doigts, appliquez la règle de la main tranchée.", "Main. -20 à tous les tests employant cette main, et aucune arme à deux mains. Un bouclier reste sanglable au bras. Si c'est la main directrice, -20 aux tests d'arme de la main restante, réduit de 5 par tranche de 100 PX dépensés.", "Bras. Règles de la main perdue, plus l'impossibilité de sangler un bouclier de ce côté.", "Pied. Mouvement réduit de moitié définitivement, et -20 à tous les tests impliquant la mobilité, l'Esquive comprise. Jambe : mêmes règles, plus l'impossibilité totale d'employer le talent Esquive.", "Orteils. -1 définitif en Agilité et en Capacité de Combat par orteil perdu.", "Œil. Un œil se compense. Les deux : -30 à tous les tests liés à la vue. -5 en Sociabilité par orbite vide visible.", "Oreille. Les deux perdues : -20 permanent aux tests de Perception basés sur l'ouïe. -5 en Sociabilité par oreille perdue si le visage se voit.", "Nez. -20 permanent en Sociabilité et -30 à tous les tests d'odorat.", "Dents. -1 en Sociabilité par paire manquante. Au-delà de la moitié, 16 chez les humains, 18 chez les elfes, 20 chez les nains et les halflings, les repas prennent deux fois plus de temps.", "Langue. Tout test de Langue impliquant la parole échoue automatiquement."], "foot": ""}, {"kind": "texte", "title": "Guérison, aide médicale et chirurgie", "note": "Règles du livre de base, entrées Guérison, Aide médicale et Chirurgie.", "items": ["Guérir des Blessures. Une fois par jour, après une bonne nuit de sommeil, un test de Résistance (+20) rend un nombre de Blessures égal aux DR obtenus plus le Bonus d'Endurance. Chaque journée entière de repos rend en plus le Bonus d'Endurance.", "Aller plus vite. Il faut l'assistance de quelqu'un qui possède la compétence Guérison, ou des bandages, un cataplasme de soin ou l'équivalent.", "Aide médicale. Ce terme couvre la compétence Guérison, l'application d'un bandage ou d'un cataplasme, et les sorts ou prières de soin.", "Chirurgie. Une blessure qui l'exige impose ses pénalités jusqu'à ce que le personnage trouve un médecin, un chirurgien barbier, ou une chirurgie divine ou magique. Le talent Chirurgie couvre le reste.", "Ce que fait la compétence Guérison. Un test réussi diagnostique, traite une maladie, rend un nombre de Blessures égal au Bonus d'Intelligence plus les DR, ou retire un état Hémorragique et un de plus par DR. Un patient ne bénéficie que d'un seul jet après chaque rencontre. Avec des liquides stériles et des pansements, aucune infection ne se déclare ensuite.", "L'échec. Si le Bonus d'Intelligence plus les DR donne un total inférieur à zéro, le patient perd des Blessures. Sur un Échec Stupéfiant, il attrape en plus une Infection mineure.", "Veiller un malade. Un test de Guérison réussi protège le soignant pour la journée, et chaque DR protège une autre personne exposée. Chaque journée complète de soins réduit la durée de la maladie de 1, minimum 1."], "foot": "Trois talents comptent ici. Endurci fait ignorer un Point de Blessure perdu par État Hémorragique et par niveau. Robuste réduit les dégâts de 1 par niveau, minimum 1 Blessure. Résistance (Maladie) ou (Poison) fait réussir automatiquement le premier test de la séance."}, {"kind": "table", "title": "Qui peut soigner quoi", "note": "Répartition maison. Elle indique qui, dans un village donné, peut traiter quoi.", "cols": ["Soignant", "Compétence employée", "Ce qu'il traite", "Ce qu'il ne peut pas", "Où le trouver"], "rows": [{"c": ["Un compagnon sans formation", "Premiers Secours, ou rien", "Poser un garrot, immobiliser un membre, porter le blessé", "Rendre des Blessures, refermer un critique", "À côté de vous"], "off": false}, {"c": ["Barbier-chirurgien", "Guérison, souvent avec Chirurgie", "Les critiques qui demandent de la chirurgie, les fractures, les amputations", "Les maladies, qu'il traite par la saignée et donc mal", "Toute ville, souvent au fond d'une échoppe"], "off": false}, {"c": ["Apothicaire", "Guérison et Métier (Apothicaire)", "Les poisons, les infections, les maladies par remède, la douleur", "Ouvrir un corps sans le talent Chirurgie", "Boutique de bourg ou de ville, avec licence"], "off": false}, {"c": ["Herboriste", "Métier (Herboriste), parfois Guérison", "Les plaies légères, les états Hémorragique par cataplasme, les fièvres", "Toute Blessure Critique, tout ce qui demande une lame", "Marché, colportage, cabane à l'écart"], "off": false}, {"c": ["Prêtre ou sœur de Shallya", "Guérison, et parfois un miracle", "Tout, y compris ce que les autres abandonnent", "Refuser de soigner un ennemi, ce que son ordre lui interdit", "Temple, hospice, léproserie"], "off": false}, {"c": ["Sorcière de village", "Métier ou Guérison, charmes et simples", "Les fièvres, les accouchements, les blessures qu'on cache", "Se présenter au grand jour sans risque", "En marge du village, la nuit"], "off": false}, {"c": ["Un vétérinaire ou un maréchal-ferrant", "Soin aux animaux", "Les bêtes, et un homme s'il n'y a personne d'autre", "Faire mieux qu'un boucher sur un humain : tous ses tests à -20", "Toute écurie"], "off": false}], "foot": ""}, {"kind": "table", "title": "Les maladies", "note": "Les neuf maladies du livre de base. Le détail de chaque symptôme est dans la table suivante.", "cols": ["Maladie", "Contraction", "Incubation", "Durée", "Symptômes"], "rows": [{"c": ["Blessure Purulente", "Résistance (+40) après un combat contre une créature au trait Infecté, ou développement d'une Infection mineure", "1d10 jours, ou immédiate si elle naît d'un autre symptôme", "1d10 jours", "Fièvre, Persistant (Intermédiaire), Malaise, Blessé"], "off": true}, {"c": ["Courante galopante", "Endurance (+40) après avoir ingurgité de la matière infectée", "1d10 heures", "1d10 jours", "Intoxication alimentaire (Modérée), Malaise, Nausée"], "off": true}, {"c": ["Fièvre du rongeur", "Résistance (+20) après un combat où des rongeurs au trait Infecté vous ont blessé, ou Résistance (+40) si une source infectée touche votre bouche", "3d10+5 jours", "3d10+10 jours", "Blessé, Convulsions, Démangeaisons, Fièvre, Malaise, Persistant (Accessible)"], "off": true}, {"c": ["Flux sanglant", "Endurance (+40) après avoir ingéré de la matière infectée", "2d10 jours", "1d10 jours", "Fièvre, Intoxication alimentaire (Grave), Malaise, Nausée, Persistant (Intermédiaire)"], "off": true}, {"c": ["Infection du sang", "Développement d'une autre maladie, ou suite d'une Blessure Critique", "Immédiate", "1d10 jours", "Fièvre (Grave), Malaise, Toxine. Mortelle sans traitement"], "off": true}, {"c": ["Infection mineure", "Résistance (+60) après un combat où vous avez subi une Blessure Critique", "1d10 jours", "1d10 jours", "Blessé, Malaise, Persistant (Facile)"], "off": true}, {"c": ["Peste noire", "Résistance (+20) par heure entamée en zone infectée, ou en présence de fluides infectés", "1d10 minutes", "3d10 jours", "Bubons, Fièvre, Gangrène, Malaise, Toxine (Modérée)"], "off": true}, {"c": ["Vérole du Tanneur", "Résistance (+40) après contact avec un animal, une peau ou un cadavre infecté", "1d10 jours", "5d10 jours", "Démangeaisons, Persistant (Intermédiaire)"], "off": true}, {"c": ["Vérole urticante", "Résistance (+20) au contact d'une personne infectée, ou si un malade tousse à côté de vous. Un test par heure", "1d10 jours", "1d10+7 jours", "Démangeaisons, Toux et éternuements. On ne l'attrape jamais deux fois"], "off": true}], "foot": "Le MJ peut en inventer d'autres : il suffit de décider comment on l'attrape, son incubation, sa durée, et de lui attribuer deux ou trois symptômes."}, {"kind": "table", "title": "Les douze symptômes", "note": "Tables du livre de base. La mention entre parenthèses après un symptôme, Modérée ou Grave, aggrave l'effet comme indiqué.", "cols": ["Symptôme", "Effet", "Traitement"], "rows": [{"c": ["Blessé", "Une Blessure par symptôme Blessé ne peut pas guérir. Chaque jour, Résistance (+20) ou Blessure Purulente si vous n'en avez pas déjà une", "Un test de Guérison réussi chaque jour dispense du test de Résistance"], "off": true}, {"c": ["Bubons", "-10 à tous les tests physiques, et à tous les tests de Sociabilité si les bubons se voient ou se sentent", "Un test de Guérison pratiqué par Chirurgie les perce et ôte la pénalité. Échec : Blessure Purulente. Percés, Résistance (-10) ou ils reviennent"], "off": true}, {"c": ["Convulsions", "-10 à tous les tests physiques. -20 si (Modéré). Si (Grave), il faut vous attacher : incapacité totale", "Un mélange préparé avec Métier (Apothicaire) atténue d'un cran pendant une journée. Ingrédients jusqu'à 10 Pa la dose, ou 1 CO chez l'apothicaire"], "off": true}, {"c": ["Démangeaisons", "-10 à tous les tests de Sociabilité. Calme (+20) pour se retenir de gratter", "Onguents et huiles, six à sept sous la semaine, efficaces à 90 %. La crème rend le test de Calme Très facile (+60)"], "off": true}, {"c": ["Fièvre", "-10 à tous les tests physiques et de Sociabilité. Si (Grave), alité et Inconscient, la Détermination pouvant ramener quelques minutes de lucidité", "Un remède efficace, 10 % de ceux du commerce, fait disparaître une Fièvre ordinaire sur une Résistance (+0). Sans effet sur une Grave"], "off": true}, {"c": ["Gangrène", "Tirez la localisation. Corps : rien de plus. Tête : le nez. Bras : les doigts. Jambe : le pied. Chaque jour, Résistance (+20). Plus d'échecs que le Bonus d'Endurance et la localisation est perdue, comme une Amputation. -10 en Sociabilité, symptôme Blessé, et Toxine tant que le tissu n'est pas amputé", "L'amputation de la partie gangrenée, et rien d'autre"], "off": true}, {"c": ["Intoxication alimentaire", "Il faut s'isoler. (Modérée) deux fois par séance, (Grave) trois fois, avec 1 Blessure perdue à chaque fois", "Remèdes efficaces rares, 10 % du commerce. Un bon remède laisse en paix un nombre d'heures égal au Bonus d'Endurance"], "off": true}, {"c": ["Malaise", "1 état Exténué dont on ne se défait qu'une fois la maladie guérie", "Remède efficace à 75 %. Résistance (+0) réussi pour ignorer le symptôme une journée"], "off": true}, {"c": ["Nausée", "Chaque échec à un test impliquant un déplacement physique vous fait vomir et donne 1 état Sonné", "Remèdes efficaces à 60 %, environ 30 Sc. Résistance (+0) pour ignorer les effets pendant un nombre d'heures égal au Bonus d'Endurance"], "off": true}, {"c": ["Persistant", "À la fin de la Durée, test de Résistance à la difficulté indiquée. Échec minime : 1d10 jours de plus. Échec de -2 DR : Blessure Purulente. Échec stupéfiant de -6 DR : Infection du sang", "Traitements abordables mais efficaces à 10 % seulement. Un bon remède dispense du test de Résistance, s'il est pris le bon jour"], "off": true}, {"c": ["Toux et éternuements", "Toute personne autour de vous s'expose à la maladie et doit tester une fois par heure entamée", "Rien ne fonctionne"], "off": true}, {"c": ["Toxine", "Résistance (+60) chaque jour, en général pendant le sommeil, sous peine de mort. Test Facile (+40) si (Modéré), Accessible (+20) si (Grave)", "Rien ne fonctionne"], "off": true}], "foot": ""}, {"kind": "texte", "title": "Autres dégâts", "note": "Règles du livre de base.", "items": ["Exposition. Après 4 heures dans un environnement difficile, un test de Résistance. En conditions extrêmes, toutes les deux heures.", "Chaleur. Premier échec : -10 en Intelligence et en Force Mentale, et 1 Exténué. Deuxième échec : -10 % à toutes les autres caractéristiques et un second Exténué. À partir du troisième : 1d10 dégâts qui ignorent les PA, minimum 1 Blessure. Se débarrasser d'une possession lourde annule un échec.", "Froid. Premier échec : -10 en Capacité de Tir, en Agilité et en Dextérité. Deuxième : -10 % aux autres caractéristiques. À partir du troisième : 1d10 dégâts ignorant les PA, minimum 1. À zéro Blessure, Inconscient immédiat.", "Soif. Un test de Résistance par jour sans eau, de plus en plus difficile de -10 à chaque fois. Premier échec : -10 en Intelligence, Force Mentale et Sociabilité. À partir du deuxième : -10 aux autres caractéristiques et 1d10 dégâts ignorant les PA.", "Faim. Un test de Résistance tous les deux jours. Premier échec : -10 en Force et en Endurance. À partir du deuxième : -10 aux autres et 1d10 dégâts ignorant les PA. Sans nourriture ni boisson, aucune Blessure ne se récupère et aucun état Exténué ne se retire naturellement.", "Noyade et suffocation. On retient son souffle un nombre de secondes égal au Bonus d /* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

/* ---------- lecture initiale : cache local, puis la base fait autorité ---------- */
function charger(){
  try{
    var brut = localStorage.getItem(CACHE);
    if(brut){ data = normaliser(JSON.parse(brut)); }
  }catch(e){}
  if(!data) data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}
function cacher(){
  try{ localStorage.setItem(CACHE, JSON.stringify(data)); }catch(e){}
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  cacher();
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  cacher();
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    cacher();
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') return JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  d.sections = tab(d.sections);
  for(var i = 0; i < d.sections.length; i++){
    var s = d.sections[i];
    s.kind = s.kind || 'texte';
    s.title = s.title || '';
    s.note = s.note || '';
    s.foot = s.foot || '';
    if(s.kind === 'table'){
      s.cols = tab(s.cols);
      s.rows = tab(s.rows);
      for(var r = 0; r < s.rows.length; r++){
        s.rows[r] = s.rows[r] || {};
        s.rows[r].c = tab(s.rows[r].c);
        s.rows[r].off = !!s.rows[r].off;
      }
    } else {
      s.items = tab(s.items);
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def = d.legend[l].def || '';
    d.legend[l].off = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 || n.indexOf('serv') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var si = 0; si < data.sections.length; si++){
    var s = data.sections[si];
    var n = (s.kind === 'table') ? s.rows.length : s.items.length;
    h += '<div class="sec" data-s="' + si + '">';
    h += '<div class="sechead">';
    h +=   '<button data-a="fold">▾</button>';
    h +=   '<span class="t" contenteditable data-t="st" data-s="' + si + '">' + esc(s.title) + '</span>';
    h +=   '<span class="n">' + n + '</span>';
    h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
    h +=   '<button data-a="delsec">Supprimer</button>';
    h += '</div>';
    h += '<div class="snote" contenteditable data-t="sn" data-s="' + si + '">' + esc(s.note || '') + '</div>';
    h += '<div class="secbody">';

    var PIED = s.foot || s.foot === '' ? '<div class="sfoot" contenteditable data-t="sf" data-s="' + si + '">' + esc(s.foot || '') + '</div>' : '';
    if(s.kind === 'table'){
      h += '<table><thead><tr>';
      for(var ci = 0; ci < s.cols.length; ci++)
        h += '<th contenteditable data-t="col" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
      h += '<th></th></tr></thead><tbody>';
      for(var ri = 0; ri < s.rows.length; ri++){
        var r = s.rows[ri];
        h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
        for(var k = 0; k < s.cols.length; k++){
          var mot = (s.cols[k] || '').toLowerCase();
          var cle = (mot.indexOf('atout') === 0 || mot.indexOf('mots') >= 0 || mot.indexOf('effet') === 0) ? ' data-atout="1"' : '';
          h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
               '" data-s="' + si +
               '" data-r="' + ri + '" data-c="' + k + '"' + cle + '>' + esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
        }
        h += '<td class="acts"><button data-a="off" title="Ligne du livre">★</button>' +
             '<button data-a="dup" title="Dupliquer">⧉</button>' +
             '<button data-a="del" title="Supprimer">✕</button></td></tr>';
      }
      h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
    } else {
      h += '<div class="items">';
      for(var ii = 0; ii < s.items.length; ii++){
        h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
             '<div class="txt" contenteditable data-t="item" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
             '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
      }
      h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
    }
    h += '</div>';
    h += '</div>';
  }

  if(data.legend && data.legend.length){
    h += '<h2 class="bloc">Légende</h2><div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Synchronisation automatique avec la base en ligne, sans rien à valider. Survoler une cellule d\'effet affiche les définitions reconnues.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var s = +el.getAttribute('data-s'), r = +el.getAttribute('data-r'),
      c = +el.getAttribute('data-c'), i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent;
  if(t === 'intro') data.intro = v;
  else if(t === 'st') data.sections[s].title = v;
  else if(t === 'sn') data.sections[s].note = v;
  else if(t === 'sf') data.sections[s].foot = v;
  else if(t === 'col') data.sections[s].cols[c] = v;
  else if(t === 'cell') data.sections[s].rows[r].c[c] = v;
  else if(t === 'item') data.sections[s].items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var si = +sec.getAttribute('data-s'), S = data.sections[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'delsec'){
    if(confirm('Supprimer la section « ' + S.title + ' » ?')){ data.sections.splice(si,1); sauver(); rendre(); }
    return;
  }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < data.sections.length){
      var tmp = data.sections[si]; data.sections[si] = data.sections[n]; data.sections[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);
