<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue des Matières</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#c2452a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1280px;margin:0 auto;padding:1rem .9rem 4rem}
  .grp{margin:0 0 1.4rem}
  .grp>h2{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.6rem 0 .5rem}
  .grp>h2:focus{outline:none;background:#0e0c0b}
  .gnote{font-size:.82rem;color:var(--dim);margin:.1rem 0 .8rem;padding:.5rem .7rem;
       background:var(--panel);border-left:2px solid var(--line);border-radius:0 3px 3px 0}
  .gnote:focus{outline:none;background:#0e0c0b}
  .gnote:empty,.grp>h2:empty{display:none}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td.c{text-align:center;white-space:nowrap}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .grp>h2{color:#8B1A1A;border-color:#8B1A1A}
    .gnote{background:#faf7f1;color:#5a524a}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<div class="bar">

  <input type="search" id="q" placeholder="Filtrer…">
  <button id="b-push" title="Publier la version du fichier vers la base en ligne. Le fichier fait autorité.">Push</button>

<script>
var DEFAUT = {"intro": "Document entièrement maison. Les matières déjà chiffrées dans les guides de métier gardent leur prix, reprises ici à l'identique. Monnaie : CO couronne d'or, Pa pistole d'argent, Sc sou de cuivre. 1 CO = 20 Pa, 1 Pa = 12 Sc.", "groups": [{"title": "", "note": "", "sections": [{"kind": "texte", "title": "Comment lire ce catalogue", "note": "", "items": ["Coût. Le prix d'achat courant chez qui en vend, dans un bourg de taille moyenne. Une capitale baisse d'un quart, un village isolé double, une région en guerre triple ou n'en a plus du tout.", "Disponibilité. Commune se trouve partout. Limitée demande un fournisseur précis et parfois l'attente d'une livraison. Rare exige un contact, un déplacement ou une faveur. Exotique ne s'achète pas de façon fiable : on la reçoit, on la prélève soi-même, ou on la vole.", "Maîtrise. Le chiffre de 1 à 4 qu'il faut atteindre pour reconnaître la matière et la travailler sans la gâcher. On le compare à la sienne. Maîtrise 3 veut dire qu'il faut être Maîtrise 3 au minimum. En dessous, on peut posséder la matière et la revendre, mais on la perd si on tente de la travailler.", "Récolte. Le test, le lieu et la saison. Une matière sans ligne de récolte ne se ramasse pas : elle s'achète ou se prélève sur quelque chose de mort.", "Sert à. Ce que la matière permet, en renvoyant aux documents de métier existants quand c'est le cas."]}, {"kind": "texte", "title": "La Maîtrise : un seul chiffre, des deux côtés", "note": "À lire avant tout le reste. Ces deux chiffres se ressemblent et on les confond sans arrêt.", "items": ["Chaque matière porte une Maîtrise, dans la colonne du même nom. Elle dit quel niveau il faut avoir pour la travailler sans la gâcher.", "Chaque personnage a lui aussi une Maîtrise, une par métier. Elle se lit sur le score de sa compétence Métier. Moins de 40 donne 1, de 40 à 49 donne 2, de 50 à 59 donne 3, 60 et plus donne 4.", "Les deux se comparent directement. Une matière de Maîtrise 3 demande un personnage de Maîtrise 3. Le même personnage peut être Maîtrise 3 en Métier (Forgeron) et Maîtrise 1 en Métier (Cuisinier).", "Pour fabriquer un objet, il faut deux choses en même temps. Ma Maîtrise doit atteindre celle de la matière. Ma Maîtrise doit aussi permettre la complexité de l'objet. Si l'une des deux manque, je ne peux pas.", "Exemple. J'ai 44 en Métier (Forgeron), donc Maîtrise 2. Je sais produire jusqu'à la complexité 3. Je veux forger une épée en acier nain. L'acier nain demande une Maîtrise 3. Je gâche l'acier.", "Deux solutions. Soit je monte mon score à 50 pour passer Maîtrise 3. Soit je prends de l'acier de Nuln, qui demande une Maîtrise 2, et je forge la même épée.", "L'autre sens. J'ai 52, donc Maîtrise 3, et l'acier nain me convient. Si je tente une pièce de complexité 5, j'échoue quand même. Cette fois c'est l'objet qui est trop dur, et la matière n'y est pour rien.", "Le mot échelon ne sert qu'aux carrières. Il désigne le niveau atteint dans une voie, de 1 à 4, avec son Statut. Il donne un titre et des compétences à prix normal, sans commander aucune fabrication."], "foot": ""}, {"kind": "texte", "title": "Une chaîne complète : du minerai à la lame", "note": "Trois métiers se relaient sur le même objet. Chacun vérifie les mêmes deux chiffres à son étape.", "items": ["Étape 1, extraire. Un mineur descend chercher du fer de tourbière. C'est une matière Commune, Maîtrise 1, 5 Sc la dose. Il lui faut un test, une demi-journée, et un filon connu. Une réussite donne une dose, chaque +2 DR une de plus, jusqu'à 6 puisque la matière est Commune.", "Étape 2, fondre. Le fer brut ne se forge pas. Il faut du charbon de bois, Commune, Maîtrise 1, et un feu tenu. La fonte est un travail de complexité 1 : DR 2, une heure par tentative. Un forgeron de Maîtrise 1 y arrive. À la sortie, on a du fer marchand utilisable.", "Étape 3, forger. Une épée est une pièce de complexité 3. Il faut donc être Maîtrise 2 au minimum, puisque la Maîtrise 1 plafonne à la complexité 2. Le test est un test étendu de Métier (Forgeron), DR 6 à atteindre, un jour par tentative.", "Étape 4, payer les matières. L'épée se vend 1 CO dans le guide des armes. Les matières coûtent la moitié, soit 10 Pa, perdues si le forgeron abandonne le travail en cours de route.", "Ce qui change avec une meilleure matière. En acier de Nuln, Maîtrise 2, la même épée reste accessible à une Maîtrise 2. En acier nain, Maîtrise 3, il faut passer Maîtrise 3, sinon l'acier est perdu. En gromril, Maîtrise 4, il faut la Maîtrise 4, et qu'un Nain accepte de vendre.", "Le même raisonnement ailleurs. Une herboriste cueille de la belladone, Maîtrise 2, puis en fait un onguent, complexité 2 : il lui faut la Maîtrise 2 pour les deux. Un cuisinier achète du safran, Maîtrise 3, pour un banquet de complexité 4 : il lui faut la Maîtrise 3 pour les deux. La logique ne change jamais."], "foot": ""}, {"kind": "texte", "title": "Récolter soi-même : le moteur", "note": "", "items": ["Un test, une demi-journée, une zone. Un Test de la compétence indiquée, en extérieur et au bon endroit, occupe une demi-journée de marche lente. Une même zone ne rend rien de plus avant une saison entière.", "Ce que rapporte le jet. Un échec ne donne rien et coûte quand même la demi-journée. Une réussite donne une dose. Chaque +2 DR donne une dose supplémentaire, sans jamais dépasser le maximum indiqué par la disponibilité : Commune 6, Limitée 4, Rare 2, Exotique 1.", "Le talent Savant, version maison. Savant (Herbes), Savant (Sciences) ou l'équivalent utile double le nombre de doses obtenues, sans changer le plafond. Le talent officiel ne fait pas cela : il accorde un nombre d'informations connues sans test, égal à son niveau. On garde ici la version maison, plus utile en récolte, mais c'est bien un écart assumé.", "Sans la Maîtrise requise. On peut ramasser sans savoir. Si ma Maîtrise est inférieure à celle de la matière, je l'identifie au jugé. Une fois sur trois, je ramasse la mauvaise plante. On le découvre à l'emploi.", "Hors saison. Une matière ramassée hors de sa saison subit −20 au test de récolte et se conserve deux fois moins longtemps.", "Conservation. Une matière fraîche se gâte en 1d10 jours. Séchée, salée ou mise dans l'alcool, elle tient une saison. Le charme permanent Le Sel sec, la sacoche d'apothicaire et le Coffret du remède règlent la question pour qui les possède."]}, {"kind": "texte", "title": "Identifier une matière", "note": "", "items": ["Test d'Intelligence ou de la compétence de métier, difficulté selon la disponibilité : Commune Facile +40, Limitée Intermédiaire +0, Rare Difficile −20, Exotique Très difficile −30.", "Savoir (Herbes) s'applique aux végétaux et aux champignons, Savoir (Sciences) aux minéraux et aux métaux, Savoir (Bestiaire) aux matières animales, Savoir (Magie) aux matières paranaturelles. Le Métier concerné remplace toujours le Savoir si le personnage l'a plus haut.", "Un échec de −3 DR ou pire donne une identification fausse et convaincante. C'est le meilleur levier d'empoisonnement accidentel du jeu, et il vaut mieux que n'importe quel piège.", "Le marchand. Un fournisseur honnête identifie gratuitement ce qu'il vend. Un receleur affirme n'importe quoi avec aplomb."]}, {"kind": "table", "title": "Disponibilité : ce que chaque cran implique", "note": "", "cols": ["Disponibilité", "Où on l'achète", "Délai", "Doses par récolte", "Ce que le MJ doit demander"], "rows": [{"c": ["Commune", "N'importe quel bourg, marché hebdomadaire", "Immédiat", "6", "Rien, on paie"], "off": false}, {"c": ["Limitée", "Fournisseur spécialisé d'une ville, guilde", "1d10 jours si absent du stock", "4", "Savoir où, ou un jet de Ragot"], "off": false}, {"c": ["Rare", "Contact personnel, comptoir lointain, receleur", "Une à quatre semaines", "2", "Une relation, une somme, ou un service rendu"], "off": false}, {"c": ["Exotique", "Ne s'achète pas de façon fiable", "Aléatoire", "1", "Une aventure, un don, ou un vol"], "off": false}], "foot": ""}, {"kind": "table", "title": "Ce que ma Maîtrise me permet, matière par matière", "note": "On lit la ligne de sa propre Maîtrise, obtenue sur le score de sa compétence Métier. La colonne Maîtrise accessible se compare à la Maîtrise de la matière visée. La colonne Achat légal se compare à sa disponibilité : ce sont deux choses différentes. Une matière Commune peut demander une Maîtrise 2, comme le millepertuis : elle s'achète sans problème, et une Maîtrise 1 la gâche en la travaillant.", "cols": ["Maîtrise", "Score de Métier", "Maîtrise accessible", "Complexité accessible", "Achat légal"], "rows": [{"c": ["1", "Moins de 40", "Maîtrise 1", "1 et 2", "Matières Communes"], "off": false}, {"c": ["2", "De 40 à 49", "Maîtrise 1 et 2", "3", "Communes et Limitées"], "off": false}, {"c": ["3", "De 50 à 59", "Maîtrise 1 à 3", "4", "Rares, avec registre et déclaration"], "off": false}, {"c": ["4", "60 et plus", "Toutes, Maîtrise 4 comprise", "5", "Tout ce qui n'est pas prohibé"], "off": false}], "foot": ""}]}, {"title": "Le végétal", "note": "", "sections": [{"kind": "table", "title": "Herbes communes des bords de chemin", "note": "Ce que n'importe qui ramasse en marchant, et que seul un œil formé distingue de son sosie inutile.", "cols": ["Matière", "Coût", "Dispo", "Maîtrise", "Récolte", "Sert à"], "rows": [{"c": ["Achillée", "6 Sc", "Commune", "1", "Savoir (Herbes), talus et prés, du printemps à l'automne", "Arrête un saignement. Un cataplasme retire un État Hémorragique sans test de Guérison"], "off": false}, {"c": ["Consoude", "8 Sc", "Commune", "1", "Savoir (Herbes), fossés humides, printemps", "Emplâtre d'os brisé. Réduit d'un jour la convalescence d'une fracture"], "off": false}, {"c": ["Plantain", "4 Sc", "Commune", "1", "Savoir (Herbes), partout où l'on marche, toute l'année", "Piqûres, brûlures légères, ampoules. La plante du soldat en marche"], "off": false}, {"c": ["Ortie", "3 Sc", "Commune", "1", "Aucun test, friches et décombres, printemps et été", "Fibre textile grossière, soupe, teinture verte, tisane fortifiante"], "off": false}, {"c": ["Camomille sauvage", "8 Sc", "Commune", "1", "Savoir (Herbes), champs moissonnés, été", "Calmant léger. Une tasse le soir donne +10 au premier Test de Calme du lendemain"], "off": false}, {"c": ["Ail des ours", "5 Sc", "Commune", "1", "Savoir (Herbes), sous-bois humide, printemps seulement", "Cuisine, antiseptique, et tout le folklore que le village y attache"], "off": false}, {"c": ["Écorce de saule", "10 Sc", "Commune", "1", "Aucun test, berges, toute l'année", "Décoction contre la douleur. Retire un État Exténué dû à la douleur, une fois par jour"], "off": false}, {"c": ["Bardane", "6 Sc", "Commune", "1", "Savoir (Herbes), terrains vagues, été et automne", "Purgatif doux, teinture, cataplasme d'abcès"], "off": false}, {"c": ["Mousse de chêne", "4 Sc", "Commune", "1", "Aucun test, troncs au nord, toute l'année", "Bourre de plaie propre, fixateur de parfum, isolation de bottes"], "off": false}, {"c": ["Prêle", "7 Sc", "Commune", "1", "Savoir (Herbes), fossés, printemps", "Abrasif végétal. Polit le bois et le métal fin sans les rayer"], "off": false}, {"c": ["Millepertuis", "1 Pa", "Commune", "2", "Savoir (Herbes), lisières ensoleillées, plein été", "Baume de brûlure et remontant. Trois jours de cure retirent un point de Corruption temporaire"], "off": false}, {"c": ["Bourrache", "8 Sc", "Commune", "1", "Savoir (Herbes), jardins et friches, été", "Fièvre et refroidissements. Base de la plupart des tisanes de convalescence"], "off": false}], "foot": ""}, {"kind": "table", "title": "Simples de valeur", "note": "Le fonds de commerce d'un herboriste. Les prix rejoignent ceux du document Apothicaire, qui regroupe la fleur de lune et le faxtoryll sous une seule ligne, Simples rares, au même prix de 3 CO.", "cols": ["Matière", "Coût", "Dispo", "Maîtrise", "Récolte", "Sert à"], "rows": [{"c": ["Racines et écorces séchées", "10 Pa", "Commune", "1", "Achat, ou cueillette en automne", "Infusions, décoctions, drogue trises et raccords", "note": "", "sections": [{"kind": "texte", "title": "Acheter, revendre, fabriquer : les quatre prix", "note": "", "items": ["Une même matière a quatre valeurs différentes selon ce qu'on en fait. Le catalogue ne donne que la première ; les trois autres s'en déduisent, et ces règles sont celles déjà en vigueur dans les documents de métier.", "Prix d'achat. C'est la colonne Coût. Il vaut chez un fournisseur ordinaire d'un bourg de taille moyenne. Grande ville, moins un quart. Village isolé ou région en guerre, le double, voire rien du tout. Le Marchandage s'applique normalement, dans la limite de deux crans.", "Prix de revente d'une matière. La moitié du prix d'achat chez un artisan du métier concerné, le quart chez un receleur ou pour une matière dont la provenance ne se raconte pas. Une matière Exotique ne se revend pas à prix affiché : elle se négocie, et la scène vaut mieux que le tableau.", "Coût en matières d'un objet fabriqué. La moitié du prix de vente de l'objet fini, conformément au moteur commun. Une réparation coûte le quart. C'est le sens de lecture le plus utile à la table : on part du prix de l'objet dans les documents de métier, et on divise.", "Prix de vente d'un objet fini. Le prix des documents de métier, sans changement. Une pièce vendue d'occasion part à la moitié, une pièce non homologuée ou sans marque de guilde au quart. Cette règle vient de l'Ingénieur et vaut pour tous les métiers.", "Ce qu'on gagne réellement à fabriquer. La moitié du prix de vente, moins le temps passé. Un artisan de Maîtrise 2 qui travaille huit heures par jour dégage environ 1 CO par semaine, une fois l'atelier et la cotisation payés. C'est un revenu modeste, et c'est voulu."]}, {"kind": "table", "title": "Repères de prix, en un coup d'œil", "note": "Toutes ces règles existent déjà dans les documents de métier. Elles sont réunies ici pour éviter d'avoir à les chercher.", "cols": ["Opération", "Prix", "Source"], "rows": [{"c": ["Acheter une matière", "Colonne Coût du catalogue", "Ce document"], "off": false}, {"c": ["Revendre une matière à un artisan", "La moitié du coût", "Usage commun"], "off": false}, {"c": ["Revendre une matière à un receleur", "Le quart du coût", "Usage commun"], "off": false}, {"c": ["Matières pour fabriquer un objet", "La moitié du prix de vente de l'objet", "Moteur commun, Artisanat"], "off": false}, {"c": ["Matières pour réparer un objet", "Le quart du prix de l'objet", "Moteur commun, Ingénieur"], "off": false}, {"c": ["Vendre un objet neuf marqué", "Prix plein des documents de métier", "Documents de métier"], "off": false}, {"c": ["Vendre un objet d'occasion", "La moitié", "Ingénieur"], "off": false}, {"c": ["Vendre un objet non homologué ou sans marque", "Le quart, et risque de saisie", "Ingénieur"], "off": false}, {"c": ["Cotisation de guilde", "2 CO par an, +10 aux achats de matières", "Ingénieur, Artisanat"], "off": false}, {"c": ["Commande d'une matière absente du stock", "Prix plein, délai de 1d10 jours à 4 semaines", "Ce document"], "off": false}], "foot": ""}, {"kind": "texte", "title": "Maîtrise et complexité : le rappel", "note": "Version courte du bloc placé en tête du document.", "items": ["La Maîtrise de la matière est dans la colonne du même nom de ce catalogue.", "La Maîtrise du personnage se lit sur le score de sa compétence Métier, selon le barème donné en tête de document.", "La complexité appartient à l'objet. Elle est dans le guide du métier.", "Les trois se vérifient à chaque fabrication. Ma Maîtrise doit atteindre celle de la matière, et permettre la complexité de l'objet. La contrainte la plus haute décide."], "foot": ""}, {"kind": "table", "title": "Ce qu'une Maîtrise permet de fabriquer, par métier", "note": "Rappel condensé des tables « Les quatre niveaux de Maîtrise » de chaque guide. En cas de doute, le guide fait foi.", "cols": ["Maîtrise", "Complexité accessible", "Forge", "Apothicaire", "Cuisine", "Ingénieur", "Artisanat"], "rows": [{"c": ["1", "1 et 2", "Clous, ferrures, réparations", "Infusions, cataplasmes, séchage", "Ordinaire de troupe, conserves", "Entretien, pièces détachées", "Courroies, sacs, cordages"], "off": false}, {"c": ["2", "3", "Armes simples, cuir clouté, maille légère", "Onguents, teintures, remèdes courants", "Table d'auberge, rations de route", "Modifications d'armes, pièges", "Bottes, coffres, vêtements, verrerie simple"], "off": false}, {"c": ["3", "4", "Maille complète, plates, armes de qualité", "Distillats, poisons, remèdes de complexité 4", "Banquet, plats à effet", "Machines de guerre, lentilles", "Selles, chariots, vitraux, gravure"], "off": false}, {"c": ["4", "5", "Pièces d'apparat, gromril", "Préparations paranaturelles", "Table nobiliaire", "Prototypes, engins uniques", "Carrosses, parures, pièces signées"], "off": false}], "foot": ""}, {"kind": "table", "title": "Qui gouverne quoi", "note": "En cas de divergence entre deux documents, celui de la colonne de droite fait autorité.", "cols": ["Question", "Où chercher", "Autorité"], "rows": [{"c": ["Prix et provenance d'une matière première", "Ce catalogue", "Le document de métier concerné, s'il la cite déjà"], "off": false}, {"c": ["Où ramasser une matière, à quelle saison", "Ce catalogue", "Ce catalogue"], "off": false}, {"c": ["Maîtrise requise pour reconnaître et employer une matière", "Ce catalogue", "Ce catalogue"], "off": false}, {"c": ["Maîtrise requise pour fabriquer un objet donné", "Table « Les quatre niveaux de Maîtrise » de chaque guide", "Le document de métier"], "off": false}, {"c": ["Complexité, DR requis, temps par tentative", "Table de complexité, identique partout", "Artisanat, qui fait référence"], "off": false}, {"c": ["Prix d'un objet fini", "Le document de métier", "Up in Arms puis le livre de base"], "off": false}, {"c": ["Armes, armures et leurs qualités", "Armes et Munitions, Les Armures", "Ces deux documents"], "off": false}, {"c": ["Effets d'une drogue, d'un poison, d'un remède", "Drogues et Potions", "Ce document"], "off": false}, {"c": ["Procédés, formes galéniques, doses", "Métier Apothicaire", "Ce document"], "off": false}, {"c": ["Poudre noire, patente, machines", "Métier Ingénieur", "Ce document"], "off": false}, {"c": ["Composants d'un sort ou d'un charme", "Domaine des Traditions, Domaine des Charmes", "Ces documents"], "off": false}, {"c": ["Légalité de la détention", "Ce catalogue, table « Ce qui attire l'attention »", "Justice de l'Empire"], "off": false}], "foot": ""}]}, {"title": "", "note": "", "sections": [{"kind": "texte", "title": "Notes de MJ", "note": "", "items": ["Ce catalogue est un moteur d'aventure. La ligne Récolte de chaque matière rare est une raison d'aller quelque part. La mandragore pousse sous les gibets, la soie d'araignée est dans un nid, la graisse de troll suppose un troll mort depuis moins de six heures.", "Le délai de prélèvement est ton meilleur outil de tension. Six heures pour la graisse de troll, une heure pour le venin et le cuir de bête des bois, l'heure pour l'œil de corbeau. Un groupe qui veut la matière doit rester sur place, ce qui n'est jamais confortable.", "L'identification ratée vaut mieux qu'un piège. Un échec de −3 DR donne une réponse fausse et assurée. Le personnage prépare son remède, le donne à quelqu'un, et personne ne comprend avant la nuit suivante.", "Ne fais jamais payer deux fois. Si une matière est déjà chiffrée dans La Forge, l'Apothicaire, la Cuisine ou l'Artisanat, c'est ce prix qui vaut. Ce catalogue les reprend à l'identique, il ne les corrige pas.", "La légalité est un levier de campagne. Un personnage qui monte en Maîtrise achète des matières de plus en plus surveillées. À la troisième Maîtrise, il est inscrit dans trois registres différents et il ne s'en rend pas compte.", "Ce que ce catalogue rend obsolète : rien. Les documents de métier gardent leurs tables de matières, qui sont leur résumé pratique. Celui-ci les complète par l'amont, la récolte, la saisonnalité et la légalité, et il ajoute environ cent matières qui n'existaient nulle part."]}, {"kind": "texte", "title": "Résumé pour le joueur, en cinq lignes", "note": "", "items": ["Une matière a un prix, une disponibilité, une Maîtrise minimum et parfois un lieu où la ramasser. Récolter demande un test, une demi-journée, la bonne saison et le bon biome, et rend une dose plus une par +2 DR. Identifier demande un test dont la difficulté dépend de la disponibilité, et un échec franc donne une réponse fausse. En dessous de la Maîtrise requise, on peut posséder la matière mais on la gâche en la travaillant. Et plus une matière est rare, plus quelqu'un note votre nom quand vous l'achetez."]}]}], "legend": [{"off": true, "term": "Échelon", "def": "Le niveau atteint dans une carrière, de 1 à 4, avec son Statut. Il donne un titre et des compétences à prix normal. Le mot ne désigne rien d'autre."}]};

/* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

/* ---------- amorçage : le fichier, puis la base prend la main dès sa réponse ---------- */
function charger(){
  data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') d = JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  /* ancien format à sections plates : on l'enveloppe dans un groupe unique */
  if(!d.groups && d.sections) d.groups = [{title:'', note:'', sections: d.sections}];
  delete d.sections;
  d.groups = tab(d.groups);
  for(var g = 0; g < d.groups.length; g++){
    var G = d.groups[g];
    G.title = G.title || '';
    G.note  = G.note  || '';
    G.sections = tab(G.sections);
    for(var i = 0; i < G.sections.length; i++){
      var s = G.sections[i];
      s.kind  = s.kind || (s.cols ? 'table' : 'texte');
      s.title = s.title || '';
      s.note  = s.note  || '';
      s.foot  = s.foot  || '';
      if(s.kind === 'table'){
        s.cols = tab(s.cols);
        s.rows = tab(s.rows);
        for(var r = 0; r < s.rows.length; r++){
          s.rows[r] = s.rows[r] || {};
          s.rows[r].c = tab(s.rows[r].c);
          s.rows[r].off = !!s.rows[r].off;
        }
      } else {
        s.items = tab(s.items);
      }
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def  = d.legend[l].def  || '';
    d.legend[l].off  = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 ||
     n.indexOf('compl') === 0 || n.indexOf('pa') === 0 || n.indexOf('dégâts') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var gi = 0; gi < data.groups.length; gi++){
    var G = data.groups[gi];
    h += '<div class="grp" data-g="' + gi + '">';
    h += '<h2 contenteditable data-t="gt" data-g="' + gi + '">' + esc(G.title) + '</h2>';
    h += '<div class="gnote" contenteditable data-t="gn" data-g="' + gi + '">' + esc(G.note) + '</div>';

    for(var si = 0; si < G.sections.length; si++){
      var s = G.sections[si];
      var n = (s.kind === 'table') ? s.rows.length : s.items.length;
      h += '<div class="sec" data-g="' + gi + '" data-s="' + si + '">';
      h += '<div class="sechead">';
      h +=   '<button data-a="fold">▾</button>';
      h +=   '<span class="t" contenteditable data-t="st" data-g="' + gi + '" data-s="' + si + '">' + esc(s.title) + '</span>';
      h +=   '<span class="n">' + n + '</span>';
      h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
      h += '</div>';
      h += '<div class="snote" contenteditable data-t="sn" data-g="' + gi + '" data-s="' + si + '">' + esc(s.note) + '</div>';
      h += '<div class="secbody">';

      var PIED = '<div class="sfoot" contenteditable data-t="sf" data-g="' + gi + '" data-s="' + si + '">' + esc(s.foot) + '</div>';

      if(s.kind === 'table'){
        h += '<table><thead><tr>';
        for(var ci = 0; ci < s.cols.length; ci++)
          h += '<th contenteditable data-t="col" data-g="' + gi + '" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
        h += '<th></th></tr></thead><tbody>';
        for(var ri = 0; ri < s.rows.length; ri++){
          var r = s.rows[ri];
          h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
          for(var k = 0; k < s.cols.length; k++){
            h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
                 '" data-g="' + gi + '" data-s="' + si + '" data-r="' + ri + '" data-c="' + k + '">' +
                 esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
          }
          h += '<td class="acts"><button data-a="off" title="Ligne officielle">★</button>' +
               '<button data-a="dup" title="Dupliquer">⧉</button>' +
               '<button data-a="del" title="Supprimer">✕</button></td></tr>';
        }
        h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
      } else {
        h += '<div class="items">';
        for(var ii = 0; ii < s.items.length; ii++){
          h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
               '<div class="txt" contenteditable data-t="item" data-g="' + gi + '" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
               '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
        }
        h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
      }
      h += '</div></div>';
    }
    h += '</div>';
  }

  h += '<h2 class="bloc">Légende</h2>';
  {
    h += '<div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div><button class="addrow" data-a="addleg">+ Entrée de légende</button>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Chaque frappe part vers la base en ligne, ' +
       'rien à valider. L\'étoile marque une ligne officielle, en italique. Survoler une cellule affiche ' +
       'les définitions reconnues. Le bouton PDF imprime la page, le bouton Push republie le contenu du ' +
       'fichier par-dessus la base.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var g = +el.getAttribute('data-g'), s = +el.getAttribute('data-s'),
      r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c'),
      i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent, S = (data.groups[g] && data.groups[g].sections) ? data.groups[g].sections[s] : null;
  if(t === 'intro') data.intro = v;
  else if(t === 'gt') data.groups[g].title = v;
  else if(t === 'gn') data.groups[g].note = v;
  else if(t === 'st') S.title = v;
  else if(t === 'sn') S.note = v;
  else if(t === 'sf') S.foot = v;
  else if(t === 'col') S.cols[c] = v;
  else if(t === 'cell') S.rows[r].c[c] = v;
  else if(t === 'item') S.items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(a === 'addleg'){
    if(!data.legend) data.legend = [];
    data.legend.push({off:false, term:'Nouveau mot-clé', def:'Définition.'});
    sauver(); rendre();
    var els = document.querySelectorAll('.leg .term');
    if(els.length) els[els.length - 1].focus();
    return;
  }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var gi = +sec.getAttribute('data-g'), si = +sec.getAttribute('data-s');
  var LST = data.groups[gi].sections, S = LST[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < LST.length){
      var tmp = LST[si]; LST[si] = LST[n]; LST[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('b-print').onclick = function(){ window.print(); };
document.getElementById('b-push').onclick = pousserFichier;

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var grps = document.querySelectorAll('.grp');
  for(var g = 0; g < grps.length; g++){
    var restant = grps[g].querySelectorAll('.sec:not(.hid)').length;
    grps[g].classList.toggle('hid', !!q && restant === 0);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
