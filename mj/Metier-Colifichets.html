<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Métier des Colifichets</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#4f8f7a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1240px;margin:0 auto;padding:1rem .9rem 4rem}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>

<script>
var DEFAUT = {"sections": [{"kind": "texte", "title": "Comment lire ce guide, en six points", "note": "À lire avant le reste. Ces six points suffisent à jouer le métier.", "items": ["Le métier se fait en deux ouvrages successifs. D'abord fabriquer l'objet. Ensuite le préparer à recevoir un charme. Ce sont deux tests étendus séparés, avec chacun son seuil.", "La fabrication suit le moteur commun. Complexité du support, DR à atteindre, durée d'une période, matières à la moitié du prix de vente. Elle donne la qualité et la solidité de l'objet.", "La préparation est le cœur du métier. Elle donne à l'objet une Réceptivité, qui dit quel charme il pourra porter. Son seuil dépend du charme visé, pas de la forme de l'objet.", "Un support simple va vite. Un clou se fabrique en une heure et se prépare en périodes d'une heure. Un coffret demande des journées entières pour les deux ouvrages.", "Les conditions font tout. Le moment, le lieu, le silence, la main nue, la matière vierge. Trois conditions réunies au maximum, et chacune donne un bonus au test de préparation.", "Deux chiffres à vérifier avant de commencer, comme partout ailleurs. La Maîtrise de la matière dans le Catalogue des Matières, et la complexité du support dans ce guide. Ma propre Maîtrise doit couvrir les deux."], "foot": ""}, {"kind": "texte", "title": "Le partage du travail", "note": "", "items": ["Le colifichetier fabrique et prépare. Il emploie Métier (Colifichets), une spécialisation de la compétence Métier, et il n'a aucun besoin de savoir lancer un sort.", "La lanceuse ensorcelle. Les Charmes Permanents demande un Test d'Incantation au moment de la fabrication du charme : NI 4 pour un mineur après 1d6+2 heures de travail, NI 8 pour un majeur après 2d10+2 heures. C'est ce test unique que la préparation du colifichetier facilite. Une fois le charme posé, son effet est automatique et aucun jet ne se lance plus jamais.", "Les deux métiers se rencontrent sur un seul chiffre : la Réceptivité de l'objet. Le colifichetier la fabrique, la lanceuse la consomme.", "Un même personnage peut tenir les deux rôles. Une sorcière de village fait souvent ses colifichets elle-même, et c'est pour cela qu'elle est lente.", "Un objet ordinaire acheté au marché est Sourd. Une lanceuse qui tente de l'ensorceler perd ses heures de travail et son Test d'Incantation."], "foot": ""}, {"kind": "texte", "title": "Le test étendu, la mécanique", "note": "Le mécanisme du test étendu vient du livre de base. Le nombre de DR par complexité, la durée d'un jet et la qualité gagnée au dépassement sont maison.", "items": ["Un test ordinaire se joue en un jet. Un test étendu se joue en plusieurs jets d'affilée, jusqu'à ce qu'on ait accumulé assez de degrés de réussite.", "Le MJ annonce deux chiffres avant qu'on commence. Le nombre total de DR à atteindre, et la durée que représente un seul jet.", "Le DR d'un jet se calcule toujours de la même façon. On prend le chiffre des dizaines de la compétence, on lui retire le chiffre des dizaines du jet. Avec une compétence à 48, un jet de 31 donne 4 moins 3, soit +1 DR.", "Un jet raté donne un DR négatif, puisque le jet dépasse la compétence. Toujours avec 48, un jet de 51 donne 4 moins 5, soit -1 DR. Ce chiffre négatif se retranche du total.", "On additionne les DR d'un jet au suivant. Le travail est fini à l'instant où le total atteint le seuil annoncé.", "Ce dernier jet décide de la qualité de la pièce, d'après ce qui dépasse le seuil. De 0 à 3 DR au-dessus, elle est Normale. De 4 à 7, elle est Bonne. À 8 et plus, c'est un Chef d'œuvre.", "Rien ne limite le nombre de jets. Ce qui limite, c'est le temps, les matières déjà payées et l'échéance du client.", "Une Maladresse, c'est-à-dire un double raté comme 66 ou 77, n'arrête pas le travail. Elle déclenche un incident, coûte un cran de qualité finale et retire 2 au jet de solidité de la pièce."], "foot": ""}, {"kind": "table", "title": "Exemple chiffré : un clou pour Le Chien du seuil", "note": "Le colifichetier a Métier (Colifichets) à 45, donc 4 en chiffre des dizaines. Le clou est un support de complexité 1 : 2 DR pour la fabrication, une heure par jet. La préparation vise une Réceptivité mineure : 4 DR, une heure par jet, puisque le support est de complexité 1.", "cols": ["Tentative", "Jet", "Calcul du DR", "DR", "Total", "Ce qui se passe"], "rows": [{"c": ["Fab. 1", "35", "4 − 3", "+1", "1", "Le clou est forgé et redressé"], "off": false}, {"c": ["Fab. 2", "08", "4 − 0", "+4", "5", "Seuil de 2 franchi, dépassement de 3"], "off": false}, {"c": ["Prép. 1", "21", "4 − 2", "+2", "2", "Minuit, sur le seuil, main nue"], "off": false}, {"c": ["Prép. 2", "54", "4 − 5", "−1", "1", "Un chien aboie, le silence est rompu"], "off": false}, {"c": ["Prép. 3", "13", "4 − 1", "+3", "4", "Seuil de 4 franchi"], "off": false}], "foot": "La fabrication finit à 5 pour un seuil de 2, donc 3 de dépassement : le clou est de qualité Normale. La préparation finit à 4 pour un seuil de 4, sans dépassement, donc Réceptif mineur tout juste. Cinq heures en tout, et le clou est prêt pour Le Chien du seuil. Le forgeron l'aurait fait en cinq minutes, mais son clou aurait été Sourd."}, {"kind": "table", "title": "Les quatre niveaux de Maîtrise du colifichetier", "note": "La Maîtrise se lit sur le score de la compétence Métier concernée, et sur rien d'autre. Un personnage a donc une Maîtrise par métier : il peut être Maîtrise 3 dans l'un et Maîtrise 1 dans l'autre. Le titre d'usage vient de la carrière suivie, avec son Statut officiel.", "cols": ["Maîtrise", "Score de Métier", "Ce qu’il fabrique", "Ce qu’il prépare", "Titre d'usage"], "rows": [{"c": ["1", "Moins de 40", "Supports de complexité 1 et 2", "Réceptivité mineure, avec une condition réunie au moins", "Apprenti artisan · Bronze 2"], "off": false}, {"c": ["2", "De 40 à 49", "Supports de complexité 3", "Réceptivité mineure sans condition. Réceptivité majeure avec deux conditions réunies", "Artisan · Argent 1"], "off": false}, {"c": ["3", "De 50 à 59", "Supports de complexité 4, gravure et mécanisme", "Réceptivité majeure. Peut préparer pour une personne nommée", "Maître artisan · Argent 3"], "off": false}, {"c": ["4", "60 et plus", "Tout, y compris les matières paranaturelles", "Consécration, et préparation d'un support qui a déjà porté un charme", "Maître de guilde · Or 1"], "off": false}], "foot": "Sans avoir suivi une carrière qui contient cette compétence Métier, la Maîtrise plafonne à 2, quel que soit le score. L'apprentissage compte autant que l'adresse."}, {"kind": "table", "title": "Les supports, par complexité physique", "note": "Ce sont les supports que les charmes déjà écrits réclament. Chaque entrée de Charmes Permanents nomme le sien, et il se retrouve dans une de ces quatre lignes.", "cols": ["Complexité", "DR et durée d’une période", "Supports", "Prix de vente"], "rows": [{"c": ["1 · Menu", "DR 2, une heure", "Clou, fil de lin, ficelle, cordon, caillou percé, dé à coudre, chandelle de suif, galet plat, épingle, aiguille, lanière, bouton", "1 Sc à 6 Sc"], "off": false}, {"c": ["2 · Ouvré", "DR 4, quatre heures", "Anneau de cuir, bague simple, peigne de corne, bol de bois, écuelle, gourde, sac, besace, poids de balance, broche, disque de bois, figurine", "6 Sc à 12 Pa"], "off": false}, {"c": ["3 · Assemblé", "DR 6, une journée", "Coffret, étui, lanterne, lampe à huile, serrure, cadenas, miroir de poche, mortier et pilon, balance, râtelier, bague à sceller", "12 Pa à 3 CO"], "off": false}, {"c": ["4 · Ouvragé", "DR 8, trois jours", "Cachet gravé aux armes, coffret à compartiments et à secret, lampe à mécanisme, corne appariée à ses jetons, miroir apparié à une serrure", "3 CO à 15 CO"], "off": false}], "foot": "La durée d'une période vaut pour la fabrication et pour la préparation. C'est ce qui rend un clou si intéressant : deux ouvrages menés en heures plutôt qu'en journées."}, {"kind": "texte", "title": "La préparation : rendre un objet réceptif", "note": "", "items": ["Un second test étendu de Métier (Colifichets), mené sur l'objet fini. Le seuil dépend du charme visé : 4 DR pour une Réceptivité mineure, 8 DR pour une Réceptivité majeure, 12 DR pour une consécration.", "La durée d'une période suit la complexité du support, comme pour la fabrication. Une heure pour un clou, quatre heures pour un anneau, une journée pour un coffret.", "Le travail se fait d'une traite, l'objet en main. Une interruption ramène le total à zéro, et le travail recommence au premier jet.", "Les conditions réunies s'ajoutent au test, dans la limite de trois. On les annonce avant de commencer, et le MJ vérifie qu'elles tiennent jusqu'au bout.", "Un composant de préparation se consomme, qu'on réussisse ou qu'on échoue. C'est la seule dépense du métier qui fasse vraiment mal.", "Le résultat s'écrit sur la fiche, dans le champ Propriété de l'objet : Réceptif mineur, Réceptif majeur, ou Consacré."], "foot": ""}, {"kind": "table", "title": "Les niveaux de Réceptivité", "note": "Un objet ne porte qu'un charme à la fois, et ce charme est définitif : Les Charmes Permanents dit qu'un charme ne s'épuise pas et ne s'efface pas. La consécration donne deux choses : un bonus au test de pose, et un objet qui attend indéfiniment sa lanceuse au lieu de se refermer au bout d'un mois.", "cols": ["Niveau", "Seuil à atteindre", "Ce que l’objet accepte", "Effet sur le Test d’Incantation"], "rows": [{"c": ["Sourd", "—", "Aucun charme. C'est l'état de tout objet ordinaire", "Le test échoue automatiquement"], "off": false}, {"c": ["Réceptif mineur", "4 DR", "Un charme mineur, ou un charme du Domaine des Charmes de NI 8 ou moins", "Aucun changement"], "off": false}, {"c": ["Réceptif majeur", "8 DR", "Un charme majeur, ou un charme du Domaine des Charmes de tout NI", "Aucun changement"], "off": false}, {"c": ["Consacré", "12 DR", "Un charme majeur, quel qu'il soit", "+10 au Test d'Incantation de fabrication. L'objet reste Réceptif indéfiniment, au lieu de retomber Sourd au bout d'une lunaison"], "off": false}], "foot": "Un objet Consacré est un objet de famille, un objet d'atelier de maître ou un objet volé. Il se compte à l'unité dans une campagne."}, {"kind": "table", "title": "Les conditions de préparation", "note": "Trois conditions au maximum, annoncées avant le premier jet. Au delà, les bonus supplémentaires sont ignorés.", "cols": ["Condition", "Bonus", "Ce qu’elle exige"], "rows": [{"c": ["Matière vierge", "+10", "La matière n'a jamais servi à rien. Un clou neuf, un fil filé le jour même, un caillou jamais ramassé"], "off": false}, {"c": ["Matière chargée", "+20", "La matière porte une histoire : fer d'un gond de temple, bois de gibet, cendre de bûcher. Rare, cher, et parfois illégal"], "off": false}, {"c": ["Le bon moment", "+10", "Aube, minuit, pleine lune, veille de fête, ou l'heure exacte que le charme nomme"], "off": false}, {"c": ["Le bon lieu", "+10", "Un seuil, un carrefour, un âtre, une source, ou le lieu où l'objet servira"], "off": false}, {"c": ["Le silence", "+10", "Aucune parole pendant tout le travail, ou une seule voix qui ne s'arrête jamais. Un bruit rompt la condition et son bonus"], "off": false}, {"c": ["La main nue", "+10", "Aucun outil de fer ne touche l'objet. Vaut pour les supports de fil, de cuir, de bois, de cire et de corne"], "off": false}, {"c": ["Le jeûne", "+10", "Le colifichetier n'a rien mangé depuis l'aube. Un état Exténué à la fin du travail"], "off": false}, {"c": ["La personne nommée", "+10", "L'objet est fait pour quelqu'un dont on a le nom, une mèche ou un vêtement. Il ne servira qu'à cette personne"], "off": false}, {"c": ["Le sang volontaire", "+20", "Une dose donnée librement. Pris de force, il annule toutes les conditions"], "off": false}], "foot": "Deux conditions se contredisent parfois. La main nue et la matière chargée s'excluent quand la matière est du fer : il faut choisir."}, {"kind": "texte", "title": "Travailler pour une personne nommée", "note": "Le consentement de la personne est une question de jeu, jamais une question de règle. Le MJ tranche ce que ça coûte socialement.", "items": ["Un colifichet peut être fait pour quelqu'un en particulier. Le colifichetier a besoin d'un lien : quelque chose qui vient de cette personne, du simple nom d'usage jusqu'au nom véritable.", "Le lien s'ajoute au test de préparation, à la place de la condition La personne nommée. Plus le lien est intime, plus le bonus est fort.", "Le prix à payer est le même dans tous les cas : l'objet ne sert qu'à elle. Un autre porteur n'obtient rien, et l'objet redevient Sourd s'il le met à même la peau.", "Le consentement change tout. Un lien donné librement fonctionne. Un lien volé fonctionne aussi, à ceci près que le sang pris de force annule toutes les conditions, et que la personne finit toujours par apprendre qu'on a sa mèche.", "Trois de tes charmes existants demandent déjà un lien. Le Fil du nom, Le Cordon des absents qui porte un nœud par compagnon nommé, et Le Nom cousu du Domaine des Charmes. La préparation de leur support passe par cette table.", "Un lien se conserve. Une mèche dans un pli de papier, une dent dans une boîte, un fil de vêtement noué. Un colifichetier prévoyant en garde une réserve, et c'est exactement ce qu'un répurgateur cherche dans un atelier."], "foot": ""}, {"kind": "table", "title": "Les liens personnels", "note": "Un seul lien par objet. Le bonus remplace celui de la condition La personne nommée : on ne cumule pas les deux.", "cols": ["Lien", "Ce qu’il faut", "Force du lien", "Comment on se le procure"], "rows": [{"c": ["Le nom d’usage", "Le nom sous lequel la personne se fait appeler", "+5, et l'objet ne sert qu'à elle", "On le demande. La plupart des gens le donnent sans y penser"], "off": false}, {"c": ["Un vêtement porté", "Une pièce portée à même la peau, jamais lavée depuis", "+10", "Un cadeau, un oubli chez le tailleur, un vol au séchoir"], "off": false}, {"c": ["Une mèche de cheveux", "Coupée sur la personne, fraîche ou conservée au sec", "+10", "Le barbier en garde. La mère en garde aussi"], "off": false}, {"c": ["Une dent de lait", "Une dent tombée d'elle-même, jamais arrachée", "+10, et le lien tient toute la vie", "La famille les conserve. Le Domaine des Charmes en fait déjà un usage"], "off": false}, {"c": ["Le sang volontaire", "Une dose donnée librement, en connaissance de cause", "+20", "Elle se donne. Prise de force, elle annule toutes les conditions"], "off": false}, {"c": ["Une signature ou une marque", "Tracée de sa main, sur parchemin", "+5", "Un contrat, une quittance, une lettre"], "off": false}, {"c": ["Une empreinte de pas", "Relevée dans l'argile ou la cire, encore fraîche", "+5", "Un seuil de terre battue après la pluie"], "off": false}, {"c": ["Le nom véritable écrit", "Obtenu par le sort Nom Véritable, ou par un aveu", "+20, et le lien ne se rompt jamais", "Le composant le plus cher du jeu, et le seul qui ne se vole pas dans une besace"], "off": false}], "foot": "Un objet lié à quelqu'un ne fonctionne que pour cette personne. Entre les mains d'un autre, il est inerte, et il redevient Sourd s'il est porté à même la peau."}, {"kind": "table", "title": "Les composants de préparation", "note": "Trente composants. Chacun est une matière du Catalogue des Matières, reprise sous son nom exact, avec son prix, son cran de disponibilité et sa Maîtrise. Un composant se consomme même en cas d'échec.", "cols": ["Composant", "Coût", "Disponibilité", "Maîtrise", "Ce qu'il apporte"], "rows": [{"c": ["Sel, une pincée", "2 Sc", "Commune", "1", "Requis par toute préparation. Sans lui, aucun test ne se lance"], "off": false}, {"c": ["Lin, fil écru filé le jour même", "4 Sc", "Commune", "1", "Vaut la condition Matière vierge sur les supports de fil et de tissu"], "off": false}, {"c": ["Suif fondu et refroidi trois fois", "6 Sc", "Commune", "1", "Vaut la condition Matière vierge sur les chandelles et les cires"], "off": false}, {"c": ["Cire d’abeille pure", "8 Sc", "Commune", "1", "Scelle la préparation. La Réceptivité tient une saison au lieu d'une lunaison"], "off": false}, {"c": ["Charbon de bois éteint à l’eau", "3 Sc", "Commune", "1", "Trace les marques du travail. Sans lui, la préparation subit -10"], "off": false}, {"c": ["Craie, un bâton", "4 Sc", "Commune", "1", "Trace le cercle de travail. Vaut la condition Le bon lieu dans une pièce close"], "off": false}, {"c": ["Chanvre, étoupe", "2 Sc", "Commune", "1", "Emballe l'objet préparé. Retarde d'une semaine la perte de Réceptivité"], "off": false}, {"c": ["Achillée séchée", "6 Sc", "Commune", "1", "+5 au test sur un support destiné à un charme de veille ou d'alerte"], "off": false}, {"c": ["Millepertuis cueilli à la Saint-Jean", "1 Pa", "Commune", "2", "+5 au test, et vaut Le bon moment si le travail se fait le même jour"], "off": false}, {"c": ["Verveine fraîche", "8 Sc", "Commune", "1", "+5 au test sur un support de maison, de seuil ou de foyer"], "off": false}, {"c": ["Aubépine, une épine", "4 Sc", "Commune", "1", "Vaut Matière vierge sur les supports d'épingle, d'aiguille et d'alêne"], "off": false}, {"c": ["Sureau, moelle de branche", "1 Pa", "Limitée", "2", "+5 au test. La tradition dit qu'on demande l'autorisation à l'arbre"], "off": false}, {"c": ["Sorbier des oiseleurs, une baie séchée", "2 Pa", "Limitée", "2", "+10 au test contre les charmes destinés à repousser quelque chose"], "off": false}, {"c": ["Gui coupé sans fer", "3 Pa", "Limitée", "3", "Vaut la condition La main nue, même si l'objet est de fer"], "off": false}, {"c": ["Poil de chat noir", "6 Sc", "Commune", "1", "+5 au test sur les supports de veille nocturne et de discrétion"], "off": false}, {"c": ["Plume de vol, pie ou corbeau", "8 Sc", "Commune", "1", "+5 au test sur les supports qui doivent signaler ou avertir"], "off": false}, {"c": ["Coquille vide", "2 Sc", "Commune", "1", "Vaut Matière vierge sur les supports de pierre percée et de coquille"], "off": false}, {"c": ["Corne, un copeau", "1 Pa", "Commune", "1", "Vaut Matière vierge sur les supports de corne et de peigne"], "off": false}, {"c": ["Laine brute, non lavée", "1 Pa", "Commune", "2", "+5 au test sur les supports de vêtement, de couverture et de cape"], "off": false}, {"c": ["Fiel de brochet", "2 Pa", "Limitée", "2", "+10 au test sur les supports liés à l'eau, au puits et à la gourde"], "off": false}, {"c": ["Œuf pondu sans coq", "1 Pa", "Limitée", "2", "Absorbe une Maladresse pendant le travail : l'œuf noircit et l'incident tombe"], "off": false}, {"c": ["Fer marchand, limaille", "6 Sc", "Commune", "1", "Vaut Matière vierge sur les supports de fer, clou et épingle compris"], "off": false}, {"c": ["Poudre d’argent, un grain", "3 Pa", "Limitée", "2", "+10 au test sur les supports destinés à repousser un Éthéré"], "off": false}, {"c": ["Eau de source prise avant l’aube", "1 Pa", "Limitée", "2", "+5 au test. Se garde une journée, ensuite c'est de l'eau"], "off": false}, {"c": ["Terre de sépulture", "—", "Rare", "3", "+10 au test sur un charme de garde ou de souvenir. Se prend, ne s'achète pas"], "off": false}, {"c": ["Éclat de pierre à sorcière brut", "6 CO", "Exotique", "4", "+20 au test, et 1 point de Corruption par jour de contact. Détention illégale"], "off": false}, {"c": ["Cendre de bûcher", "2 CO", "Rare", "3", "Vaut la condition Matière chargée. Attire l'attention du répurgateur"], "off": false}, {"c": ["Bois de gibet, un éclat", "2 CO", "Rare", "3", "Vaut Matière chargée sur les supports de bois"], "off": false}, {"c": ["Fer d’un gond de temple", "4 CO", "Rare", "4", "Vaut Matière chargée. Le Chien du seuil et Le Clou du seuil lui doivent leur effet contre les Éthérés"], "off": false}, {"c": ["Larme de statue", "8 CO", "Exotique", "4", "+10 au test, et la Réceptivité ne se perd plus jamais"], "off": false}], "foot": "Le sel est la seule dépense obligatoire, et elle coûte deux sous. Un seul composant à bonus chiffré s'emploie par préparation : les +5 et les +10 de cette table ne se cumulent pas entre eux. Ceux qui valent une condition comptent en revanche dans les trois conditions autorisées."}, {"kind": "texte", "title": "Ce que la qualité et la solidité changent ici", "note": "", "items": ["La qualité du colifichet s'ajoute au Test d'Incantation de fabrication du charme. Un objet Chef d'œuvre donne +10 à la lanceuse, un objet Bonne qualité +5, un objet Médiocre -5. C'est la raison pour laquelle une lanceuse choisit son fournisseur. Une fois le charme posé, la qualité ne joue plus sur rien.", "La solidité décide de la durée de vie du charme. Un charme disparaît avec l'objet qui le porte, et un clou Très fragile se tord au premier coup de marteau.", "Un objet abîmé, tombé à la moitié de sa durabilité, perd sa Réceptivité tant qu'il n'est pas réparé. Un objet déjà ensorcelé garde son charme, mais son effet cesse jusqu'à réparation.", "Un objet tombé à zéro perd son charme définitivement. Une remise à neuf rend l'objet, jamais le charme.", "Les règles complètes de qualité, de solidité et de réparation sont dans Qualité et Solidité."], "foot": ""}, {"kind": "texte", "title": "Perdre la Réceptivité", "note": "Ces délais donnent au métier son rythme. Un colifichetier prépare à la commande, jamais en avance.", "items": ["Une lunaison. Un objet préparé qui n'a pas été ensorcelé dans le mois redevient Sourd. La cire d'abeille pure étend ce délai à une saison, la larme de statue le supprime.", "Une autre peau. Un objet préparé porté à même la peau par quelqu'un d'autre que son destinataire redevient Sourd immédiatement.", "Un coup. Toute perte de durabilité suspend la Réceptivité jusqu'à réparation.", "Le sel et l'eau bénite. Une aspersion volontaire efface une préparation. C'est le geste du répurgateur qui trouve un atelier.", "La préparation se refait. Même seuil, mêmes conditions, mêmes composants consommés. C'est du temps perdu, sans autre conséquence."], "foot": ""}, {"kind": "texte", "title": "Défaire un charme", "note": "C'est la seule façon d'ôter un charme permanent à un objet. Les Charmes Permanents rappelle qu'un charme ne s'épuise pas et ne s'efface pas de lui-même : il faut ce travail, ou détruire l'objet.", "items": ["Un objet ensorcelé peut être ramené à l'état Sourd. Le charme s'efface, l'objet survit, et il pourra être préparé de nouveau plus tard.", "Qui. Un colifichetier de Maîtrise 3 au moins. La lanceuse qui a posé le charme peut le faire dès la Maîtrise 2, puisqu'elle sait ce qu'elle a mis dedans.", "Comment. Un test étendu de Métier (Colifichets), 6 DR pour un charme mineur et 10 DR pour un charme majeur. La durée d'une période suit la complexité du support, comme partout ailleurs.", "Ce qu'il faut. Du sel, de l'eau de source, et le feu. L'objet passe les trois, dans cet ordre, et le travail se fait d'une traite.", "Ce que ça coûte. La solidité de l'objet descend d'un cran de façon définitive. Un objet Normal devient Fragile, un objet Fragile devient Très fragile, et un objet Très fragile se brise à la fin du travail.", "En cas d'échec. Le charme tient, l'objet perd quand même son cran de solidité, et une nouvelle tentative demande un nouveau composant. Un objet s'use vite à ce jeu-là.", "Sur une Maladresse. Le charme se défait à moitié : il fonctionne encore, mais à contretemps, une fois sur deux, ou pour la mauvaise personne. Le MJ décide de quelle façon, et il ne le dit pas."], "foot": "Un objet Consacré résiste. Défaire son charme demande 4 DR de plus, et le MJ est en droit de refuser si l'objet a une histoire."}, {"kind": "texte", "title": "Les talents officiels qui pèsent sur ces tables", "note": "Rappel des règles du livre de base, non modifiées. Tout le reste de ce document est maison.", "items": ["Le travail ordinaire se fait sans jet. Avoir la compétence Métier suffit à faire son travail de tous les jours, avec ses outils et ses matières. On lance les dés dans trois cas : je veux aller vite, les conditions sont mauvaises, ou je vise une pièce de qualité. La préparation d'un colifichet compte toujours comme un de ces trois cas.", "Travailleur qualifié (Colifichets). Talent officiel. Retire son niveau au DR exigé par tout test étendu de la compétence Métier concernée. Au niveau 2, une Réceptivité majeure tombe de 8 DR à 6 DR, ce qui change tout sur un travail mené d'une traite.", "Maître artisan (Métier). Talent officiel. Ajoute la compétence Métier à toute carrière entamée, ou la rend moins chère de 5 PX par Augmentation. Il agit sur la progression, jamais sur un test.", "Où on les gagne. La carrière Artisan donne Maître artisan au choix dès le premier niveau, et Travailleur qualifié au choix au troisième, tous deux sur la spécialisation du personnage."], "foot": ""}, {"kind": "table", "title": "Quand ça tourne mal", "note": "À tirer sur une Maladresse pendant la fabrication ou la préparation. Un maître travaillant dans son propre atelier tire deux fois et garde le résultat qui l'arrange.", "cols": ["1d10", "Incident", "Conséquence"], "rows": [{"c": ["1", "Le silence rompu", "Un bruit, une voix, un chien. La condition tombe et son bonus avec elle, pour le reste du travail"], "off": false}, {"c": ["2", "La matière refuse", "Le clou se tord, le fil casse, la cire fend. Le support est perdu, la préparation recommence sur un autre"], "off": false}, {"c": ["3", "Le composant gâché", "La dose est consommée sans effet. Il en faut une autre pour continuer"], "off": false}, {"c": ["4", "L'heure passée", "Le moment choisi est dépassé. Le bonus tombe, et il faut attendre le prochain"], "off": false}, {"c": ["5", "La main entaillée", "1 état Hémorragique et une dose de sang qui n'était pas volontaire. Toutes les conditions tombent"], "off": false}, {"c": ["6", "L'objet devient bavard", "Il tinte, il chauffe ou il pèse quand on l'approche d'un lieu saint. Réceptif quand même, et repérable"], "off": false}, {"c": ["7", "Le voisin curieux", "Quelqu'un a vu la lumière ou entendu la formule. Une rumeur part dans le village"], "off": false}, {"c": ["8", "La préparation courte", "L'objet est Réceptif un jour seulement au lieu d'une lunaison"], "off": false}, {"c": ["9", "Le charme de travers", "L'objet accepte le premier charme qu'on lui présente, y compris celui d'un autre lanceur, y compris par accident"], "off": false}, {"c": ["10", "La bonne surprise", "Le travail sort mieux que prévu. La Réceptivité monte d'un cran, sans changer le seuil atteint"], "off": false}], "foot": ""}, {"kind": "texte", "title": "Notes de MJ", "note": "", "items": ["Ce métier existe pour donner une raison d'aller quelque part. Un charme majeur demande une matière chargée, et une matière chargée demande un gond de temple, une potence démontée ou une place d'exécution. C'est là qu'est l'aventure, pas dans le test.", "Fais annoncer les conditions à voix haute avant le premier jet. Minuit, sur le seuil, main nue, sans parler. La scène s'écrit toute seule, et le joueur qui rate son silence sait exactement pourquoi.", "La lunaison est ton meilleur outil de tension. Un colifichet préparé pour une lanceuse qui voyage encore, c'est un compte à rebours posé sur la table.", "Le répurgateur ne cherche pas le charme, il cherche l'atelier. Un pot de cendre de bûcher, un éclat de bois de gibet et trois clous alignés suffisent à un procès.", "Laisse le forgeron du groupe fabriquer les supports. Il ira plus vite et son travail sera plus solide. Il ne saura pas les préparer, et cette division du travail vaut mieux qu'un personnage qui sait tout faire."], "foot": ""}, {"kind": "texte", "title": "Résumé pour le joueur, en sept lignes", "note": "", "items": ["Je fabrique l'objet, puis je le prépare. Deux tests étendus, deux seuils.", "La fabrication suit la complexité du support : 2 DR pour un clou, 8 DR pour un cachet gravé.", "La préparation vise 4 DR pour un charme mineur, 8 DR pour un charme majeur, 12 DR pour une consécration qui donne +10 à la lanceuse.", "La durée d'une période suit le support. Un clou se travaille en heures, un coffret en journées.", "Trois conditions au maximum, annoncées d'avance, et une pincée de sel dans tous les cas.", "Un objet préparé attend sa lanceuse pendant un mois. Passé ce délai, il redevient Sourd et la préparation est à refaire en entier.", "Un charme posé s'ôte par un travail de défaisage, qui coûte un cran de solidité à l'objet."], "foot": ""}], "legend": [{"off": true, "term": "Échelon", "def": "Le niveau atteint dans une carrière, de 1 à 4, avec son Statut. Il donne un titre et des compétences à prix normal. Le mot ne désigne rien d'autre."}, {"off": false, "term": "Réceptivité", "def": "Le chiffre que la préparation donne à un objet. Il dit quel charme l'objet peut recevoir. Sourd, Réceptif mineur, Réceptif majeur, Consacré."}, {"off": false, "term": "Sourd", "def": "État de tout objet ordinaire. Un Test d'Incantation lancé dessus échoue automatiquement."}, {"off": false, "term": "Support", "def": "L'objet physique qui portera le charme. Chaque charme nomme le sien dans Les Charmes Permanents."}, {"off": false, "term": "Condition", "def": "Une exigence de moment, de lieu, de matière ou de comportement, annoncée avant le premier jet. Trois au maximum, chacune donnant un bonus."}, {"off": false, "term": "Matière vierge", "def": "Matière qui n'a jamais servi. Un clou neuf, un fil filé le jour même."}, {"off": false, "term": "Matière chargée", "def": "Matière qui porte une histoire. Fer d'un gond de temple, bois de gibet, cendre de bûcher. Rare, chère, souvent illégale."}, {"off": false, "term": "Lunaison", "def": "Un mois. Délai au terme duquel une préparation non employée retombe à Sourd."}, {"off": true, "term": "Test d'Incantation", "def": "Le test unique que la lanceuse effectue à la fin de la fabrication d'un charme, NI 4 pour un mineur et NI 8 pour un majeur. Il se fait sur un objet déjà réceptif. Voir Les Charmes Permanents."}], "intro": "Document maison. Le colifichetier fabrique le support et le prépare, la lanceuse pose le charme. L'ensorcellement lui-même se lit dans Les Charmes Permanents et dans le Domaine des Charmes. Monnaie : CO couronne d'or, Pa pistole d'argent, Sc sou de cuivre. 1 CO = 20 Pa, 1 Pa = 12 Sc."};

/* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

  }catch(e){}
  if(!data) data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}
function cacher(){
  try{ localStorage.setItem(CACHE, JSON.stringify(data)); }catch(e){}
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  cacher();
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  cacher();
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    cacher();
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') return JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  d.sections = tab(d.sections);
  for(var i = 0; i < d.sections.length; i++){
    var s = d.sections[i];
    s.kind = s.kind || 'texte';
    s.title = s.title || '';
    s.note = s.note || '';
    s.foot = s.foot || '';
    if(s.kind === 'table'){
      s.cols = tab(s.cols);
      s.rows = tab(s.rows);
      for(var r = 0; r < s.rows.length; r++){
        s.rows[r] = s.rows[r] || {};
        s.rows[r].c = tab(s.rows[r].c);
        s.rows[r].off = !!s.rows[r].off;
      }
    } else {
      s.items = tab(s.items);
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def = d.legend[l].def || '';
    d.legend[l].off = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 || n.indexOf('serv') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var si = 0; si < data.sections.length; si++){
    var s = data.sections[si];
    var n = (s.kind === 'table') ? s.rows.length : s.items.length;
    h += '<div class="sec" data-s="' + si + '">';
    h += '<div class="sechead">';
    h +=   '<button data-a="fold">▾</button>';
    h +=   '<span class="t" contenteditable data-t="st" data-s="' + si + '">' + esc(s.title) + '</span>';
    h +=   '<span class="n">' + n + '</span>';
    h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
    h +=   '<button data-a="delsec">Supprimer</button>';
    h += '</div>';
    h += '<div class="snote" contenteditable data-t="sn" data-s="' + si + '">' + esc(s.note || '') + '</div>';
    h += '<div class="secbody">';

    var PIED = s.foot || s.foot === '' ? '<div class="sfoot" contenteditable data-t="sf" data-s="' + si + '">' + esc(s.foot || '') + '</div>' : '';
    if(s.kind === 'table'){
      h += '<table><thead><tr>';
      for(var ci = 0; ci < s.cols.length; ci++)
        h += '<th contenteditable data-t="col" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
      h += '<th></th></tr></thead><tbody>';
      for(var ri = 0; ri < s.rows.length; ri++){
        var r = s.rows[ri];
        h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
        for(var k = 0; k < s.cols.length; k++){
          var mot = (s.cols[k] || '').toLowerCase();
          var cle = (mot.indexOf('atout') === 0 || mot.indexOf('mots') >= 0 || mot.indexOf('effet') === 0) ? ' data-atout="1"' : '';
          h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
               '" data-s="' + si +
               '" data-r="' + ri + '" data-c="' + k + '"' + cle + '>' + esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
        }
        h += '<td class="acts"><button data-a="off" title="Ligne du livre">★</button>' +
             '<button data-a="dup" title="Dupliquer">⧉</button>' +
             '<button data-a="del" title="Supprimer">✕</button></td></tr>';
      }
      h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
    } else {
      h += '<div class="items">';
      for(var ii = 0; ii < s.items.length; ii++){
        h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
             '<div class="txt" contenteditable data-t="item" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
             '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
      }
      h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
    }
    h += '</div>';
    h += '</div>';
  }

  if(data.legend && data.legend.length){
    h += '<h2 class="bloc">Légende</h2><div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Synchronisation automatique avec la base en ligne, sans rien à valider. Survoler une cellule d\'effet affiche les définitions reconnues.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var s = +el.getAttribute('data-s'), r = +el.getAttribute('data-r'),
      c = +el.getAttribute('data-c'), i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent;
  if(t === 'intro') data.intro = v;
  else if(t === 'st') data.sections[s].title = v;
  else if(t === 'sn') data.sections[s].note = v;
  else if(t === 'sf') data.sections[s].foot = v;
  else if(t === 'col') data.sections[s].cols[c] = v;
  else if(t === 'cell') data.sections[s].rows[r].c[c] = v;
  else if(t === 'item') data.sections[s].items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var si = +sec.getAttribute('data-s'), S = data.sections[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'delsec'){
    if(confirm('Supprimer la section « ' + S.title + ' » ?')){ data.sections.splice(si,1); sauver(); rendre(); }
    return;
  }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < data.sections.length){
      var tmp = data.sections[si]; data.sections[si] = data.sections[n]; data.sections[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('b-tab').onclick = function(){
  var modele = null;
  for(var i = 0; i < data.sections.length; i++) if(data.sections[i].kind === 'table'){ modele = data.sections[i]; break; }
  data.sections.push({kind:'table', title:'Nouveau tableau', note:'', foot:'',
    cols: modele ? modele.cols.slice() : ['Objet','Coût','Disponibilité','Effet'], rows:[]});
  sauver(); rendre();
};
document.getElementById('b-txt').onclick = function(){
  data.sections.push({kind:'texte', title:'Nouvelle section', note:'', foot:'', items:['À rédiger.']});
  sauver(); rendre();
};
document.getElementById('b-leg').onclick = function(){
  if(!data.legend) data.legend = [];
  data.legend.push({off:false, term:'Nouveau mot-clé', def:'Définition.'});
  sauver(); rendre();
  var els = document.querySelectorAll('.leg .term');
  if(els.length) els[els.length-1].focus();
};
document.getElementById('b-fold').onclick = function(){
  var secs = document.querySelectorAll('.sec');
  var fermer = !document.querySelector('.sec.closed');
  for(var i = 0; i < secs.length; i++) secs[i].classList.toggle('closed', fermer);
  this.textContent = fermer ? 'Déplier tout' : 'Replier tout';
};
document.getElementById('b-print').onclick = function(){ window.print(); };
document.getElementById('b-push').onclick = pousserFichier;

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
</script>
