<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Forge</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#c2452a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1280px;margin:0 auto;padding:1rem .9rem 4rem}
  .grp{margin:0 0 1.4rem}
  .grp>h2{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.6rem 0 .5rem}
  .grp>h2:focus{outline:none;background:#0e0c0b}
  .gnote{font-size:.82rem;color:var(--dim);margin:.1rem 0 .8rem;padding:.5rem .7rem;
       background:var(--panel);border-left:2px solid var(--line);border-radius:0 3px 3px 0}
  .gnote:focus{outline:none;background:#0e0c0b}
  .gnote:empty,.grp>h2:empty{display:none}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td.c{text-align:center;white-space:nowrap}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .grp>h2{color:#8B1A1A;border-color:#8B1A1A}
    .gnote{background:#faf7f1;color:#5a524a}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
var DEFAUT = {"intro": "Document presque entièrement maison. Les valeurs d'armes, d'armures et de boucliers suivent le livre de base et Up in Arms, ce dernier faisant autorité en cas de divergence. Les catalogues sont dans Armes et Munitions et dans Armures. Monnaie : CO couronne d'or, Pa pistole d'argent, Sc sou de cuivre. 1 CO = 20 Pa, 1 Pa = 12 Sc.", "groups": [{"title": "", "note": "", "sections": [{"kind": "texte", "title": "Comment lire ce guide, en six points", "note": "À lire avant le reste. Ces six points suffisent à jouer le métier. Tout ce qui suit ne fait que les détailler.", "items": ["Deux chiffres à vérifier. La matière porte une Maîtrise, dans le Catalogue des Matières. L'objet porte une complexité, dans les tables de ce guide. Ma propre Maîtrise doit couvrir les deux.", "Ma Maîtrise est le niveau que j'ai atteint dans ce métier. Elle se lit sur le score de ma compétence Métier : moins de 40 donne la Maîtrise 1, de 40 à 49 la Maîtrise 2, de 50 à 59 la Maîtrise 3, 60 et plus la Maîtrise 4. Sans avoir suivi une carrière qui contient ce Métier, elle plafonne à 2.", "Le travail ordinaire se fait sans jet. Avoir la compétence Métier suffit à faire son travail de tous les jours, avec ses outils et ses matières. On lance les dés dans trois cas : je veux aller vite, les conditions sont mauvaises, ou je vise une pièce de qualité.", "Comment on jette. Test étendu de Métier (Forgeron), un jet par période de travail. La complexité donne le DR à atteindre et la durée d'une période. Complexité 1 : DR 2, une heure. Complexité 2 : DR 4, quatre heures. Complexité 3 : DR 6, un jour. Complexité 4 : DR 8, trois jours. Complexité 5 : DR 12, une semaine. Le talent Travailleur qualifié retire son niveau au DR à atteindre.", "Ce que coûtent les matières. La moitié du prix de vente de l'objet fini. Une réparation coûte le quart. Les matières sont perdues si j'abandonne le travail. Leur prix, leur disponibilité et leur Maîtrise sont dans le Catalogue des Matières.", "Sur une Maladresse. On tire sur la table Quand ça tourne mal, plus bas dans ce guide."], "foot": ""}, {"kind": "texte", "title": "Le test étendu, la mécanique", "note": "Le mécanisme du test étendu vient du livre de base. Le nombre de DR par complexité, la durée d'un jet et la qualité gagnée au dépassement sont maison.", "items": ["Un test ordinaire se joue en un jet. Un test étendu se joue en plusieurs jets d'affilée, jusqu'à ce qu'on ait accumulé assez de degrés de réussite.", "Le MJ annonce deux chiffres avant qu'on commence. Le nombre total de DR à atteindre, donné par la complexité de l'objet. Et la durée que représente un seul jet, donnée par cette même complexité.", "Le DR d'un jet se calcule toujours de la même façon. On prend le chiffre des dizaines de la compétence, on lui retire le chiffre des dizaines du jet. Avec une compétence à 48, un jet de 31 donne 4 moins 3, soit +1 DR.", "Un jet raté donne un DR négatif, puisque le jet dépasse la compétence. Toujours avec 48, un jet de 51 donne 4 moins 5, soit -1 DR. Ce chiffre négatif se retranche du total. Une mauvaise journée défait le travail de la veille.", "On additionne les DR d'un jet au suivant. Le travail est fini à l'instant où le total atteint le seuil annoncé.", "Ce dernier jet décide de la qualité de la pièce, d'après ce qui dépasse le seuil. De 0 à 3 DR au-dessus, elle est Normale. De 4 à 7, elle est Bonne. À 8 et plus, c'est un Chef d'œuvre.", "Rien ne limite le nombre de jets. Ce qui limite, c'est le temps, les matières déjà payées et l'échéance du client.", "Une Maladresse, c'est-à-dire un double raté comme 66 ou 77, n'arrête pas le travail. Elle déclenche un incident, coûte un cran de qualité finale et retire 2 au jet de solidité de la pièce."], "foot": ""}, {"kind": "table", "title": "Exemple chiffré : forger une épée", "note": "Le forgeron a Métier (Forgeron) à 48, donc 4 en chiffre des dizaines. L'épée est de complexité 3 : il faut 6 DR au total, et un jet représente une journée de travail.", "cols": ["Tentative", "Jet", "Calcul du DR", "DR", "Total", "Ce qui se passe"], "rows": [{"c": ["Jour 1", "31", "4 − 3", "+1", "1", "La lame est ébauchée"], "off": false}, {"c": ["Jour 2", "51", "4 − 5", "−1", "0", "Raté. La trempe a pris de travers, le total recule"], "off": false}, {"c": ["Jour 3", "12", "4 − 1", "+3", "3", "Bonne journée"], "off": false}, {"c": ["Jour 4", "04", "4 − 0", "+4", "7", "Le seuil de 6 est franchi"], "off": false}], "foot": "Le total finit à 7 pour un seuil de 6 : le dépassement est de 1, donc l'épée est de qualité Normale, forgée en quatre jours. Avec 4 de dépassement elle aurait été Bonne. Le forgeron lance pour finir 1d10 plus sa Maîtrise, ce qui fixe la solidité de la lame."}, {"kind": "texte", "title": "Un exemple suivi, du minerai à la lame", "note": "Le même déroulé vaut pour toutes les pièces de ce guide. Seuls la complexité, la matière et le prix changent.", "items": ["Le personnage. Artisan forgeron, Métier (Forgeron) à 48, donc Maîtrise 2.", "L'objectif. Une épée, complexité 3, qui se vend 1 CO.", "Vérification 1, la matière. Il vise l'acier de Nuln, Maîtrise 2. Sa Maîtrise est 2. C'est bon. S'il avait voulu de l'acier nain, Maîtrise 3, il aurait gâché le métal.", "Vérification 2, l'objet. Complexité 3 demande la Maîtrise 2. C'est bon aussi.", "Le coût. Les matières valent la moitié du prix de vente, soit 10 Pa, à sortir avant de commencer.", "Le travail. Test étendu de Métier (Forgeron), DR 6 à atteindre, un jour par tentative. Il obtient 2 DR le premier jour, 3 le deuxième, 2 le troisième. Total 7, l'épée est finie en trois jours.", "Avec le talent. Travailleur qualifié (Forgeron) niveau 2 ramène le DR à atteindre de 6 à 4. La même épée sort en deux jours.", "Si un jet tombe en Maladresse. Il tire sur la table Quand ça tourne mal."], "foot": ""}, {"kind": "texte", "title": "Ce que le métier est réellement", "note": "", "items": ["Le forgeron est l'artisan dont le travail sert tous les autres personnages, chaque soir de campagne. Il ne crée pas des merveilles, il entretient : une cotte recousue, un tranchant redressé, une jambière refaite après un coup de hache. Trois réalités qui en font un métier de jeu :", "La guilde tient la ville. Forger sans être affilié est toléré dans un hameau, impossible dans une ville. La guilde fixe les prix, contrôle la qualité et poinçonne les pièces. Un objet sans poinçon se vend mal et se saisit facilement.", "Le métal se compte. Il n'y a pas d'acier dans un village d'Averland, seulement du fer de mauvaise qualité. Une bonne lame demande de l'acier de Nuln, donc un voyage, un fournisseur, un crédit.", "La réparation vaut mieux que la fabrication. Refaire une armure prend des semaines, la réparer prend une soirée. Un forgeron dans le groupe change le rapport de la table aux dégâts d'armure, qui deviennent une contrariété au lieu d'une perte définitive.", "Compétences employées : Métier (Forgeron) et sa variante Métier (Armurier) selon ce que fabrique le personnage, Savoir (Métallurgie) pour évaluer un métal ou identifier une facture, Évaluation pour estimer une pièce, Force comme caractéristique de travail, Outils de profession obligatoires. Une forge fixe, avec soufflet et enclume, est nécessaire pour tout ce qui dépasse la complexité 2 : un feu de camp ne fait pas fondre du métal."], "foot": ""}, {"kind": "texte", "title": "Les cinq choses qu'un forgeron fait à la table", "note": "", "items": ["Entretenir. Test simple après chaque bataille. Sans entretien, une arme perd son tranchant : le MJ peut lui appliquer −1 aux dégâts jusqu'au prochain affûtage.", "Réparer. Le geste le plus utile. Rendre à une armure les points d'armure perdus, redresser une lame, refaire un rivet. Rapide, bon marché, et systématiquement demandé.", "Fabriquer. Test étendu de Métier, un jet par période de travail, jusqu'au nombre de DR requis. Matières premières : la moitié du prix de vente.", "Améliorer. Trempe, ajustement, renfort, argenture. Un DR de moins que la fabrication, une contrepartie à chaque fois, deux améliorations au maximum par pièce.", "Expertiser. Un test de Savoir (Métallurgie) sur une lame dit d'où elle vient, qui l'a faite et souvent ce qu'elle a coupé. C'est l'apport d'enquête du métier."], "foot": ""}, {"kind": "table", "title": "Complexité : le seul curseur à retenir", "note": "", "cols": ["Complexité", "DR requis", "Par tentative", "Matières", "Exemples"], "rows": [{"c": ["1 · Simple", "2", "1 heure", "Commune", "Clous, rivets, fers à cheval, pointes de flèche, affûtage, redressage"], "off": false}, {"c": ["2 · Soignée", "4", "4 heures", "Commune", "Dague, masse, hache, pièce de cotte, casque simple, serrure grossière"], "off": false}, {"c": ["3 · Précise", "6", "2 jours", "Limitée", "Épée, hallebarde, cotte de mailles, brassards, bouclier cerclé, pic d'armes"], "off": false}, {"c": ["4 · Complexe", "8", "1 semaine", "Rare", "Espadon, plates ajustées, harnois complet, lame de rapière"], "off": false}, {"c": ["5 · Exceptionnelle", "12", "1 mois", "Exotique", "Pièce de gromril, lame signée, armure de parade, commande d'un noble"], "off": false}], "foot": "Chaque arme, munition et pièce d'armure porte son métier et sa complexité dans les documents Armes et Munitions et Armures, colonnes Métier et Compl. C'est le seul endroit à consulter pour savoir si un forgeron peut produire un objet donné."}, {"kind": "table", "title": "Les quatre niveaux de Maîtrise du forgeron", "note": "La Maîtrise se lit sur le score de la compétence Métier concernée, et sur rien d'autre. Un personnage a donc une Maîtrise par métier : il peut être Maîtrise 3 dans l'un et Maîtrise 1 dans l'autre. Le titre d'usage vient de la carrière suivie, avec son Statut officiel.", "cols": ["Maîtrise", "Score de Métier", "Travaux reconnus", "Autorisations et limites", "Titre d'usage"], "rows": [{"c": ["1", "Moins de 40", "Entretien, affûtage, complexité 1 et 2, tenue du feu, préparation du métal", "Travaille sous le poinçon d'un maître. Ne peut ni signer une pièce ni acheter d'acier de qualité", "Apprenti artisan · Bronze 2"], "off": false}, {"c": ["2", "De 40 à 49", "Complexité 3, réparation d'armures complètes, améliorations courantes, vente au détail", "Affiliation, poinçon personnel, atelier, achat d'acier réglementé", "Artisan · Argent 1"], "off": false}, {"c": ["3", "De 50 à 59", "Complexité 4, plates ajustées, argenture, formation d'apprentis, expertise", "Peut poinçonner le travail d'autrui, accepter une commande militaire, témoigner sur l'origine d'une arme", "Maître artisan · Argent 3"], "off": false}, {"c": ["4", "60 et plus", "Complexité 5, pièces signées, gromril si un Nain le lui confie, direction d'un atelier collectif", "Fixe les prix locaux, siège aux instances de la ville, répond des malfaçons de la guilde", "Maître de guilde · Or 1"], "off": false}], "foot": "Sans avoir suivi une carrière qui contient cette compétence Métier, la Maîtrise plafonne à 2, quel que soit le score. L'apprentissage compte autant que l'adresse."}, {"kind": "texte", "title": "Les talents officiels qui pèsent sur ces tables", "note": "Rappel des règles du livre de base, non modifiées. Tout le reste de ce document est maison.", "items": ["Métier suffit, le plus souvent. Le livre de base est explicite : posséder la compétence Métier permet d'accomplir automatiquement les tâches de sa profession, dès lors qu'on dispose des outils et des ressources. Le test n'est exigé que si l'on travaille vite, si les conditions sont défavorables, ou si l'on vise une pièce de grande qualité. Les tables de complexité de ce guide valent pour ces cas-là, pas pour le travail ordinaire d'une journée.", "Travailleur qualifié (Forgeron). Talent officiel. Retire son niveau au DR exigé par tout test étendu de la compétence Métier concernée. Un forgeron de niveau 2 dans ce talent ramène une complexité 4, qui exige 8 DR, à 6 DR. C'est le levier officiel le plus puissant sur les tables de ce guide, et il s'applique avant tout autre modificateur.", "Maître artisan (Métier). Talent officiel. Ajoute la compétence Métier correspondante à toute carrière entamée, ou la rend moins chère de 5 PX par Augmentation si elle y figure déjà. Il agit sur la progression du personnage, jamais sur un test.", "Où on les gagne. La carrière Artisan donne Maître artisan dès le premier niveau et Travailleur qualifié au troisième, l'un et l'autre sur la spécialisation choisie, ici Forgeron."], "foot": ""}, {"kind": "table", "title": "Matières", "note": "Prix pour une quantité suffisant à une pièce de complexité 3, ou à trois pièces de complexité inférieure.", "cols": ["Matière", "Coût", "Disponibilité", "Provenance", "Usage et particularité"], "rows": [{"c": ["Fer de tourbière", "8 Pa", "Commune", "Marais, réduction locale", "Le fer des villages. Toute pièce faite avec lui subit −1 DR au test"], "off": false}, {"c": ["Fer marchand", "15 Pa", "Commune", "Forge de bourg, colporteur", "Le standard. Aucun modificateur"], "off": false}, {"c": ["Acier de Nuln", "1 CO 10 Pa", "Limitée", "Fonderies impériales", "+1 DR au test de fabrication. Obligatoire pour la complexité 4"], "off": false}, {"c": ["Acier nain", "4 CO", "Rare", "Comptoir nain, karak", "+1 DR et la pièce obtenue gagne Incassable"], "off": false}, {"c": ["Gromril", "40 CO", "Exotique", "Ne s'achète pas, se reçoit", "Complexité 5 obligatoire. Perforante et Incassable, et un clan qui suit sa trace"], "off": false}, {"c": ["Ithilmar", "–", "Exotique", "Forges elfiques uniquement", "Ne se travaille pas dans une forge humaine. Une pièce d'ithilmar se répare, jamais ne se fabrique"], "off": false}, {"c": ["Argent en lingot", "5 CO", "Rare", "Orfèvre, fondeur", "Argenture d'une arme ou d'une pièce d'armure"], "off": false}, {"c": ["Charbon de bois", "6 Pa", "Commune", "Charbonnier de forêt", "Combustible ordinaire. Une journée de forge par sac"], "off": false}, {"c": ["Coke de Nuln", "12 Pa", "Limitée", "Bassin industriel", "Chauffe plus fort : +10 aux tests de fabrication, indispensable au-delà de la complexité 4"], "off": false}, {"c": ["Cuir de garniture et rivets", "10 Pa", "Commune", "Tanneur", "Doublures, courroies, jointures. Aucune armure ne se monte sans"], "off": false}, {"c": ["Bois de hampe et poignée", "5 Pa", "Commune", "Menuisier, forêt", "Manches, hampes, crosses. Le frêne pour les hastes, le noyer pour les crosses"], "off": false}, {"c": ["Trempe à l'huile ou à l'urine", "2 Pa", "Commune", "Atelier", "Nécessaire à toute trempe. L'odeur d'une forge vient d'abord de là"], "off": false}, {"c": ["Ferraille récupérée", "–", "Commune", "Champ de bataille, épave", "Gratuite, mais −1 DR et une chance sur dix de contenir un défaut invisible"], "off": false}], "foot": ""}, {"kind": "table", "title": "Armures : fabrication et réparation", "note": "Prix et DR identiques à ceux du document Armures, où figure le catalogue complet des pièces. Coût de réparation : un dixième du prix de la pièce par point rendu, trois dixièmes si elle est brisée.", "cols": ["Pièce", "Prix indicatif", "DR", "Fabrication", "Réparation d'1 PA", "Notes"], "rows": [{"c": ["Veste de cuir", "12 Pa", "4", "1 jour", "1 heure, 1 Pa", "Travail partagé avec le tanneur"], "off": false}, {"c": ["Jaque de cuir clouté", "1 CO 10 Pa", "6", "2 jours", "1 heure, 3 Pa", "Rivetage : deux métiers, tanneur et forgeron"], "off": false}, {"c": ["Heaume ouvert", "2 CO", "4", "1 jour", "1 heure, 4 Pa", "La pièce la plus rentable de l'atelier"], "off": false}, {"c": ["Cotte de mailles", "3 CO", "6", "2 semaines", "2 heures, 6 Pa", "Se répare maille par maille, presque indéfiniment"], "off": false}, {"c": ["Brassards", "8 CO", "6", "4 jours", "2 heures, 16 Pa", "Doivent être ajustés au porteur"], "off": false}, {"c": ["Jambières d'acier", "10 CO", "6", "5 jours", "2 heures, 1 CO", "Les plus lourdes à porter comme à forger"], "off": false}, {"c": ["Plastron de plates", "10 CO", "8", "3 semaines", "4 heures, 1 CO", "Acier de Nuln obligatoire"], "off": false}, {"c": ["Harnois complet", "45 CO", "8", "2 mois", "Par pièce", "Une commande de ce genre change la vie d'un atelier"], "off": false}, {"c": ["Bouclier", "2 CO", "4", "1 jour", "1 heure, 4 Pa", "Bois cintré et cerclage. Le consommable de la mêlée"], "off": false}, {"c": ["Bocle", "18 Pa 2 Sc", "2", "4 heures", "1 heure, 2 Pa", "Tout en acier. La pièce du duelliste"], "off": false}, {"c": ["Grand bouclier", "3 CO", "4", "2 jours", "1 heure, 6 Pa", "Trois points de Protectrice, trois d'encombrement"], "off": false}], "foot": "Une pièce dont les PA tombent sous zéro n'est plus réparable : il faut la refaire. Une armure réparée plus de trois fois perd définitivement 1 PA, le métal ne pardonne pas indéfiniment."}, {"kind": "table", "title": "Améliorations et finitions", "note": "Deux améliorations au maximum par pièce. Les effets sur les armures sont détaillés dans le document Armures.", "cols": ["Travail", "Éch.", "Surcoût", "DR", "Effet et contrepartie"], "rows": [{"c": ["Affûtage soigné", "1", "2 Pa", "2", "+1 aux dégâts jusqu'au prochain combat sérieux. À refaire sans cesse"], "off": false}, {"c": ["Trempe différentielle", "3", "×2", "6", "L'arme gagne Précise, soit +10 à tout test effectué avec elle. Sur une Maladresse au travail, la lame se fend"], "off": false}, {"c": ["Ajustement au porteur", "3", "×1,5", "6", "Armure : Enc réduit de 1 et la pièce gagne Ajustée. Inutilisable par quelqu'un d'autre sans réajustement"], "off": false}, {"c": ["Renfort de plaques", "3", "×2", "6", "+1 PA à la localisation, la pièce gagne Renforcée. Enc +1 et −10 % en Agilité"], "off": false}, {"c": ["Allègement", "4", "×3", "8", "Enc réduit de 2, la pièce gagne Allégée. Elle perd 1 PA et devient Fragile"], "off": false}, {"c": ["Argenture", "3", "×10", "6", "L'arme gagne Argentée. La couche s'use : à refaire après une vingtaine de coups"], "off": false}, {"c": ["Noircissement", "2", "×1,5", "4", "Le métal ne reflète plus la lumière : +10 en Discrétion de nuit avec cet équipement"], "off": false}, {"c": ["Gravure et damasquinure", "4", "×4", "8", "Aucun effet mécanique. La pièce vaut un cran de Statut à qui la porte en public"], "off": false}, {"c": ["Poinçon de maître", "3", "–", "6", "Garantit l'origine et double le prix de revente. Engage la responsabilité du signataire"], "off": false}, {"c": ["Requalification en qualité supérieure", "4", "×5", "8", "La pièce devient de qualité supérieure. Un échec la ruine définitivement"], "off": false}, {"c": ["Doublure rembourrée", "2", "×1,5", "4", "La pièce d'armure gagne Rembourrée. Enc +1"], "off": false}, {"c": ["Doublure de cuir silencieuse", "3", "×2", "6", "L'armure gagne Silencieuse et perd Bruyante. À refaire chaque saison"], "off": false}, {"c": ["Blasonnement", "2", "×2", "4", "L'armure gagne Blasonnée et vaut un cran de Statut apparent. Et rend son porteur identifiable"], "off": false}], "foot": ""}, {"kind": "table", "title": "Quand ça tourne mal", "note": "Sur une Maladresse à un test de Métier pendant un travail de forge, jeter 1d10. Les matières sont perdues dans tous les cas.", "cols": ["1d10", "Incident"], "rows": [{"c": ["1", "Pièce manquée. Rien de plus que du temps et du métal perdus"], "off": false}, {"c": ["2", "Fer brûlé. Le métal est cassant : la pièce paraît réussie et gagne Fragile sans que personne le sache"], "off": false}, {"c": ["3", "Soudure froide. La pièce tient jusqu'au premier coup violent, puis casse net"], "off": false}, {"c": ["4", "Étincelle dans l'œil. Test d'Endurance ou état Aveuglé pendant 1d10 minutes"], "off": false}, {"c": ["5", "Brûlure. 1d10 dégâts à la main ou au bras, armure inapplicable, et un test de Guérison à prévoir"], "off": false}, {"c": ["6", "Marteau ou tenailles brisés. Outils endommagés : −10 aux tests jusqu'à remplacement, un jour et 1 CO"], "off": false}, {"c": ["7", "Trempe explosive. Vapeur brûlante : dégâts 6 sans armure au forgeron et à tout voisin"], "off": false}, {"c": ["8", "Enclume fendue ou soufflet crevé. La forge est inutilisable pendant 1d10 jours"], "off": false}, {"c": ["9", "Feu échappé. L'atelier prend feu. Test d'Agilité pour sauver le travail en cours, sinon tout brûle"], "off": false}, {"c": ["10", "Incendie sérieux. Le feu gagne le bâtiment voisin. Dans une ville de bois, c'est le début d'une très mauvaise nuit"], "off": false}], "foot": "Un forgeron travaillant dans son propre atelier, avec du métal qu'il a lui-même choisi, soustrait 2 au résultat, minimum 1. Comme pour les autres métiers, le professionnel corrige la table que les autres subissent."}, {"kind": "texte", "title": "Atelier, guilde et clientèle", "note": "", "items": ["Revenus. Une forge tenue une semaine complète rapporte 1 CO par DR obtenu à un test de Métier, doublé en temps de guerre ou juste après un passage de troupes. C'est régulier, modeste, et ça oblige à rester en ville.", "Commandes. Une commande militaire ou nobiliaire vaut dix fois une semaine de détail, avec un délai ferme. Un retard coûte un cran de Statut et parfois la commande entière.", "Guilde. L'affiliation coûte 3 CO par an, donne accès aux fournisseurs, aux apprentis et au poinçon. Travailler en ville sans affiliation entraîne saisie du matériel et amende.", "Poinçon. Une pièce poinçonnée se vend le double d'une pièce anonyme, et se retrouve. Une arme signée retrouvée sur une scène de crime est une piste directe vers son fabricant, ce qui vaut bien une intrigue.", "Récupération. Une armure détruite fournit assez de métal pour la moitié d'une pièce neuve de même type. Les champs de bataille sont des mines pour qui sait trier vite.", "Prix du travail. Un forgeron facture la moitié du prix de l'objet en main-d'œuvre. Un personnage qui forge lui-même ne paie donc que les matières, ce qui reste l'avantage le plus concret du métier."], "foot": ""}, {"kind": "texte", "title": "Notes de MJ", "note": "", "items": ["Fais tomber les points d'armure. Les règles officielles endommagent les armures constamment, et sans forgeron cette perte est définitive. Avec un forgeron dans le groupe, applique l'atout Taille sans hésiter : le personnage devient indispensable.", "Le temps est la limite, pas l'argent. Une cotte de mailles se fabrique en deux semaines. C'est une décision de campagne.", "Deux améliorations maximum par pièce, sinon tout le groupe finit en plates allégées, ajustées, argentées et gravées, et il n'y a plus de danger.", "Le poinçon est un levier narratif équivalent à la patente de l'ingénieur ou au registre de l'apothicaire. Il transforme un objet en témoignage.", "Pour un forgeron nain, remplace la guilde par le clan et le poinçon par la rune de fabrication. Les matières Rares deviennent Limitées, le gromril reste inaccessible sans retour au karak, et une pièce mal faite déshonore la lignée."], "foot": ""}, {"kind": "texte", "title": "Résumé pour le joueur, en cinq lignes", "note": "", "items": ["Ta compétence clé est Métier (Forgeron), tes outils et une vraie forge sont obligatoires au-delà de la complexité 2, et tout se résout par un test étendu dont le nombre de DR dépend de la complexité, de 2 pour un rivet à 12 pour une lame signée. Le métal que tu emploies modifie directement ce test : le fer de tourbière te pénalise, l'acier de Nuln t'avantage. Tu ne paies que les matières, soit la moitié du prix d'un objet acheté. Ton service le plus précieux est de rendre à tes compagnons les points d'armure qu'ils perdent à chaque combat. Et ton poinçon te suit : tout ce que tu signes peut te revenir."], "foot": ""}]}], "legend": [{"off": true, "term": "Échelon", "def": "Le niveau atteint dans une carrière, de 1 à 4, avec son Statut. Il donne un titre et des compétences à prix normal. Le mot ne désigne rien d'autre."}, {"off": false, "term": "Fragile", "def": "La pièce casse sur une Maladresse au combat."}, {"off": false, "term": "Incassable", "def": "La pièce ne se brise pas, ne se corrode pas et ne s'émousse pas."}, {"off": false, "term": "Argentée", "def": "Blesse normalement les créatures que seules les armes d'argent ou magiques peuvent atteindre."}, {"off": false, "term": "Perforante", "def": "Les PA non métalliques sont ignorés, et le premier point de toute autre armure l'est également."}, {"off": false, "term": "Précise", "def": "+10 à tout test effectué avec l'arme."}, {"off": false, "term": "Qualité supérieure", "def": "+1 aux dégâts ou l'atout Précise, jamais les deux, pour cinq fois le prix."}, {"off": false, "term": "PA", "def": "Points d'armure d'une localisation. Chaque dégât d'armure en retire 1."}, {"off": false, "term": "Poinçon", "def": "Marque de garantie d'un artisan affilié. Double le prix de revente et identifie le fabricant."}, {"off": false, "term": "Rembourrée", "def": "Ignore le premier point de dégât de toute attaque Assommante ou contondante."}, {"off": false, "term": "Ajustée", "def": "Forgée pour un porteur précis : Enc réduit de 1, inutilisable par un autre sans réajustement."}, {"off": false, "term": "Renforcée", "def": "+1 PA à la localisation, Enc +1 et −10 % en Agilité."}, {"off": false, "term": "Allégée", "def": "Enc réduit de 2, au prix d'un point d'armure et du défaut Fragile."}, {"off": false, "term": "Blasonnée", "def": "Porte des armes identifiables : le porteur est reconnu, et son affiliation avec lui."}, {"off": false, "term": "Silencieuse", "def": "Annule Bruyante et la pénalité de Discrétion de la pièce."}, {"off": false, "term": "Rouillée", "def": "Négligée ou trempée : −1 PA jusqu'à une remise en état."}]};

};

var db = null, refData = null, refSave = null;
try{
  if(typeof firebase !== 'undefined'){
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    db = firebase.database();
    refData = db.ref(RACINE + '/donnees');
    refSave = db.ref(RACINE + '/sauvegardes');
  }
}catch(e){ console.warn('Firebase indisponible :', e); }

/* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

/* ---------- amorçage : le fichier, puis la base prend la main dès sa réponse ---------- */
function charger(){
  data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') d = JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  /* ancien format à sections plates : on l'enveloppe dans un groupe unique */
  if(!d.groups && d.sections) d.groups = [{title:'', note:'', sections: d.sections}];
  delete d.sections;
  d.groups = tab(d.groups);
  for(var g = 0; g < d.groups.length; g++){
    var G = d.groups[g];
    G.title = G.title || '';
    G.note  = G.note  || '';
    G.sections = tab(G.sections);
    for(var i = 0; i < G.sections.length; i++){
      var s = G.sections[i];
      s.kind  = s.kind || (s.cols ? 'table' : 'texte');
      s.title = s.title || '';
      s.note  = s.note  || '';
      s.foot  = s.foot  || '';
      if(s.kind === 'table'){
        s.cols = tab(s.cols);
        s.rows = tab(s.rows);
        for(var r = 0; r < s.rows.length; r++){
          s.rows[r] = s.rows[r] || {};
          s.rows[r].c = tab(s.rows[r].c);
          s.rows[r].off = !!s.rows[r].off;
        }
      } else {
        s.items = tab(s.items);
      }
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def  = d.legend[l].def  || '';
    d.legend[l].off  = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 ||
     n.indexOf('compl') === 0 || n.indexOf('pa') === 0 || n.indexOf('dégâts') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var gi = 0; gi < data.groups.length; gi++){
    var G = data.groups[gi];
    h += '<div class="grp" data-g="' + gi + '">';
    h += '<h2 contenteditable data-t="gt" data-g="' + gi + '">' + esc(G.title) + '</h2>';
    h += '<div class="gnote" contenteditable data-t="gn" data-g="' + gi + '">' + esc(G.note) + '</div>';

    for(var si = 0; si < G.sections.length; si++){
      var s = G.sections[si];
      var n = (s.kind === 'table') ? s.rows.length : s.items.length;
      h += '<div class="sec" data-g="' + gi + '" data-s="' + si + '">';
      h += '<div class="sechead">';
      h +=   '<button data-a="fold">▾</button>';
      h +=   '<span class="t" contenteditable data-t="st" data-g="' + gi + '" data-s="' + si + '">' + esc(s.title) + '</span>';
      h +=   '<span class="n">' + n + '</span>';
      h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
      h += '</div>';
      h += '<div class="snote" contenteditable data-t="sn" data-g="' + gi + '" data-s="' + si + '">' + esc(s.note) + '</div>';
      h += '<div class="secbody">';

      var PIED = '<div class="sfoot" contenteditable data-t="sf" data-g="' + gi + '" data-s="' + si + '">' + esc(s.foot) + '</div>';

      if(s.kind === 'table'){
        h += '<table><thead><tr>';
        for(var ci = 0; ci < s.cols.length; ci++)
          h += '<th contenteditable data-t="col" data-g="' + gi + '" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
        h += '<th></th></tr></thead><tbody>';
        for(var ri = 0; ri < s.rows.length; ri++){
          var r = s.rows[ri];
          h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
          for(var k = 0; k < s.cols.length; k++){
            h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
                 '" data-g="' + gi + '" data-s="' + si + '" data-r="' + ri + '" data-c="' + k + '">' +
                 esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
          }
          h += '<td class="acts"><button data-a="off" title="Ligne officielle">★</button>' +
               '<button data-a="dup" title="Dupliquer">⧉</button>' +
               '<button data-a="del" title="Supprimer">✕</button></td></tr>';
        }
        h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
      } else {
        h += '<div class="items">';
        for(var ii = 0; ii < s.items.length; ii++){
          h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
               '<div class="txt" contenteditable data-t="item" data-g="' + gi + '" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
               '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
        }
        h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
      }
      h += '</div></div>';
    }
    h += '</div>';
  }

  h += '<h2 class="bloc">Légende</h2>';
  {
    h += '<div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div><button class="addrow" data-a="addleg">+ Entrée de légende</button>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Chaque frappe part vers la base en ligne, ' +
       'rien à valider. L\'étoile marque une ligne officielle, en italique. Survoler une cellule affiche ' +
       'les définitions reconnues. Le bouton PDF imprime la page, le bouton Push republie le contenu du ' +
       'fichier par-dessus la base.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var g = +el.getAttribute('data-g'), s = +el.getAttribute('data-s'),
      r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c'),
      i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent, S = (data.groups[g] && data.groups[g].sections) ? data.groups[g].sections[s] : null;
  if(t === 'intro') data.intro = v;
  else if(t === 'gt') data.groups[g].title = v;
  else if(t === 'gn') data.groups[g].note = v;
  else if(t === 'st') S.title = v;
  else if(t === 'sn') S.note = v;
  else if(t === 'sf') S.foot = v;
  else if(t === 'col') S.cols[c] = v;
  else if(t === 'cell') S.rows[r].c[c] = v;
  else if(t === 'item') S.items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(a === 'addleg'){
    if(!data.legend) data.legend = [];
    data.legend.push({off:false, term:'Nouveau mot-clé', def:'Définition.'});
    sauver(); rendre();
    var els = document.querySelectorAll('.leg .term');
    if(els.length) els[els.length - 1].focus();
    return;
  }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var gi = +sec.getAttribute('data-g'), si = +sec.getAttribute('data-s');
  var LST = data.groups[gi].sections, S = LST[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < LST.length){
      var tmp = LST[si]; LST[si] = LST[n]; LST[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('b-print').onclick = function(){ window.print(); };
document.getElementById('b-push').onclick = pousserFichier;

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var grps = document.querySelectorAll('.grp');
  for(var g = 0; g < grps.length; g++){
    var restant = grps[g].querySelectorAll('.sec:not(.hid)').length;
    grps[g].classList.toggle('hid', !!q && restant === 0);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
