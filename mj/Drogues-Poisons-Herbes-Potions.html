<title>Drogues, Poisons, Herbes et Potions</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#7a9b3a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1240px;margin:0 auto;padding:1rem .9rem 4rem}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>

<script>
var DEFAUT = {"sections": [{"kind": "table", "title": "Drogues", "note": "Non interdites dans la majeure partie de l'Empire, mais mal vues des sigmarites, et vendues dans des lieux qui posent leurs propres problèmes. Complexité : 1 vaut DR 2 et une heure de travail, 2 vaut DR 4 et quatre heures, 3 vaut DR 6 et un jour, 4 vaut DR 8 et trois jours, 5 vaut DR 12 et une semaine. Les matières coûtent la moitié du prix indiqué. Barème complet et table d'incidents dans le guide de l'Apothicaire. Récolte signifie que l'objet se cueille, se prélève ou se vole, mais ne se fabrique pas ; Temple, qu'il s'obtient d'un culte et jamais d'un atelier.", "cols": ["Objet", "Coût", "Enc", "Disponibilité", "Compl.", "Administration", "Effet", "Durée, dose, mots-clés"], "rows": [{"c": ["Bave", "1 CO 5 Pa", "0", "Rare", "4", "Ingérée", "Hallucination d'un désir profond. Endurance Très difficile (−30) ou fantasme incontrôlable géré par le MJ.", "1d10 minutes. Addictive 2"], "off": true}, {"c": ["Bonnet de fou", "5 CO", "0", "Exotique", "Récolte", "Mâchée", "Rage berserk : +10 en F, +4 Blessures, talent Frénésie. Perte de 1d10 Blessures à la fin. Non peaux-vertes : Résistance (+0) ou Infection mineure.", "Tant que mâché, +2d10 min. Contrecoup"], "off": true}, {"c": ["Délice de Ranald", "18 Pa", "0", "Limitée", "3", "Inhalée", "+1 Mouvement et +10 en F, E, Ag, CC. Puis −2 Mouvement et −20 aux mêmes caractéristiques.", "3 heures, contrecoup 1 jour. Addictive 3"], "off": true}, {"c": ["Mystracine", "4 Pa", "0", "Rare", "4", "Mâchée", "+10 en Endurance et Force Mentale, −10 en Agilité, Initiative et Intelligence.", "Tant que mâchée, +1d10 × 10 min. Addictive 1"], "off": true}, {"c": ["Racine de mandragore", "1 CO", "0", "Rare", "2", "Mâchée", "+20 aux tests de Calme, mais Mouvement réduit de moitié et un test de FM par round pour agir.", "Tant que mâchée, +1d10 × 10 min. Addictive 3"], "off": true}, {"c": ["Feuille de sonstill", "8 Pa", "0", "Commune", "Récolte", "Mâchée", "+10 aux tests de Calme, −10 en Perception. La drogue du guet de nuit et des veillées funèbres.", "2 heures. Addictive 1"], "off": false}, {"c": ["Chique de charretier", "3 Pa", "0", "Commune", "1", "Mâchée", "+20 aux tests pour rester éveillé, −10 en Sociabilité (haleine et crachats).", "6 heures. Addictive 1"], "off": false}, {"c": ["Sang-de-pierre", "2 CO", "0", "Rare", "3", "Ingérée", "Ignore un état Exténué, −10 en Agilité. Préparation naine, amère et grasse.", "4 heures. Contrecoup"], "off": false}, {"c": ["Poussière de silène", "15 CO", "0", "Exotique", "4", "Inhalée", "+20 en Perception et aucun besoin de sommeil. À la fin, deux états Exténué qui ne se retirent que par une nuit complète.", "24 heures. Addictive 3, Contrecoup"], "off": false}, {"c": ["Rêve-de-Morr", "3 CO", "0", "Rare", "5", "Fumée", "+20 aux tests d'Intuition concernant un mort ou le lieu de sa mort. Ensuite, test de Force Mentale ou état Brisé.", "1 heure. Addictive 2"], "off": false}], "foot": ""}, {"kind": "table", "title": "Poisons", "note": "Posséder du poison est légal, et soulève des questions. L'employer sur une personne est un crime capital dans tout l'Empire.", "cols": ["Objet", "Coût", "Enc", "Disponibilité", "Compl.", "Administration", "Effet", "Durée, dose, mots-clés"], "rows": [{"c": ["Brise-cœur", "40 CO", "0", "Exotique", "5", "Ingéré", "Inodore et incolore. Inflige 4 états Empoisonné. Résistance Complexe (−10) pour lutter.", "1 dose. Indétectable"], "off": true}, {"c": ["Lotus noir", "20 CO", "0", "Exotique", "Récolte", "Lame", "Toute cible qui subit au moins 1 Blessure de la lame enduite gagne 2 états Empoisonné. Résistance Complexe (−10).", "1 dose"], "off": true}, {"c": ["Belladone", "3 CO", "0", "Rare", "2", "Ingérée", "Sommeil profond au bout de deux à trois heures, sauf réussite d'un test de Résistance.", "Sommeil 1d10 + 4 h. 1 dose par personne"], "off": true}, {"c": ["Venin de vipère des roseaux", "8 Pa", "0", "Rare", "3", "Lame", "1 état Empoisonné sur une blessure. Résistance Intermédiaire (+0).", "1 dose. Périssable"], "off": false}, {"c": ["Fiel de crapaud tacheté", "2 CO", "0", "Rare", "2", "Lame", "1 état Empoisonné et −10 en CC pendant une heure : les muscles répondent mal.", "1 dose"], "off": false}, {"c": ["Mort-aux-rats de Nuln", "10 Pa", "0", "Commune", "2", "Ingéré", "1 état Empoisonné, Résistance Intermédiaire (+0). Goût métallique très reconnaissable.", "1 dose. Détectable +20"], "off": false}, {"c": ["Poudre du sommeil", "3 CO", "0", "Rare", "3", "Inhalée", "Endurance Difficile (−10) ou état Inconscient en 1d10 rounds. Ne blesse pas : sert aux prises vivantes.", "1 dose, sommeil 1d10 heures"], "off": false}, {"c": ["Larmes de la sorcière", "6 CO", "0", "Exotique", "4", "Lame", "2 états Hémorragique qu'aucun test de Guérison ne referme : il faut cautériser ou un cataplasme coagulant.", "1 dose"], "off": false}, {"c": ["Curare de chasse", "5 CO", "0", "Rare", "4", "Munition", "2 états Empoisonné, Résistance Difficile (−10). Prévu pour les pointes, pas pour les lames.", "1 dose = 3 munitions. Périssable"], "off": false}, {"c": ["Élixir du bourreau", "15 CO", "0", "Exotique", "5", "Ingéré", "3 états Empoisonné, Résistance Difficile (−10). Employé pour les exécutions discrètes.", "1 dose. Détectable −10"], "off": false}], "foot": ""}, {"kind": "table", "title": "Herbes et remèdes", "note": "Se cueillent (test de Survie en extérieur ou de Savoir approprié) ou s'achètent. La préparation demande en général des Outils de profession (Herboriste).", "cols": ["Objet", "Coût", "Enc", "Disponibilité", "Compl.", "Administration", "Effet", "Durée, dose, mots-clés"], "rows": [{"c": ["Cataplasme de guérison", "12 Pa", "0", "Commune", "1", "Contact", "Une Blessure Critique traitée avec ce cataplasme n'entraîne aucune Infection mineure.", "1 dose par critique"], "off": true}, {"c": ["Faxtoryll", "15 Pa", "0", "Exotique", "Récolte", "Contact", "Coagulant végétal : retire tous les états Hémorragique sans test de Guérison.", "1 dose par Blessure Critique"], "off": true}, {"c": ["Racine de terre", "5 CO", "0", "Limitée", "Récolte", "Ingérée", "Annule les bubons de la Peste noire et donne +10 à tous les tests liés à la maladie.", "1 dose par jour"], "off": true}, {"c": ["Soude commune", "12 Pa", "0", "Commune", "1", "Inhalée", "Une branche écrasée sous le nez retire 1 état Sonné.", "1 dose par rencontre"], "off": true}, {"c": ["Tonique digestif", "3 Pa", "0", "Commune", "1", "Ingéré", "+20 aux tests pour se remettre des maux d'estomac, Courante galopante et Flux sanglant compris.", "1 dose"], "off": true}, {"c": ["Fleur de lune", "5 CO", "0", "Limitée", "Récolte", "Ingérée", "Anesthésique des médecins réputés. Traite la Peste noire, +20 aux tests de Calme et 1 état Exténué. Échec au test de FM Très difficile (−30) : état Inconscient.", "1d10 + 5 heures"], "off": true}, {"c": ["Sigmafoil", "5 Pa", "0", "Commune", "Récolte", "Contact", "+10 au prochain test de Guérison sur la plaie traitée. L'herbe la plus banale de l'Empire.", "1 dose"], "off": false}, {"c": ["Tarrabeth", "8 Pa", "0", "Limitée", "Récolte", "Ingérée", "Infusion amère : retire 1 état Exténué. Une seule fois par jour, ensuite le corps ne répond plus.", "1 dose par jour"], "off": false}, {"c": ["Valériane", "4 Pa", "0", "Commune", "1", "Ingérée", "+10 aux tests de Calme et sommeil facilité. Ne se cumule pas avec la fleur de lune.", "4 heures"], "off": false}, {"c": ["Mousse de tourbière", "3 Pa", "0", "Commune", "1", "Contact", "Retire 1 état Hémorragique sur un test de Guérison réussi. Le remède du fossoyeur et du braconnier.", "1 dose"], "off": false}, {"c": ["Onguent d'os brisé", "1 CO", "0", "Limitée", "2", "Contact", "Réduit d'un jour le temps de convalescence d'une Blessure Critique par soin réussi.", "1 dose par critique"], "off": false}, {"c": ["Bourgeon de sorbier", "1 CO", "0", "Limitée", "Récolte", "Ingéré", "+10 aux tests de Force Mentale contre la Corruption pendant une journée. Amer, et jamais suffisant.", "1 jour"], "off": false}, {"c": ["Sels de réveil", "6 Pa", "0", "Commune", "1", "Inhalés", "Retire 1 état Sonné, ou réveille un Inconscient dont les Blessures sont supérieures à 0.", "1 dose par heure"], "off": false}], "foot": ""}, {"kind": "table", "title": "Potions et onctions", "note": "Se brassent avec la compétence Métier (Apothicaire). Les onctions s'appliquent sur une arme et renvoient aux atouts de la table des armes.", "cols": ["Objet", "Coût", "Enc", "Disponibilité", "Compl.", "Administration", "Effet", "Durée, dose, mots-clés"], "rows": [{"c": ["Potion de guérison", "10 Pa", "0", "Limitée", "2", "Ingérée", "Si les Blessures sont supérieures à 0, récupération immédiate d'un nombre de Blessures égal au Bonus d'Endurance.", "1 dose par rencontre"], "off": true}, {"c": ["Potion de vitalité", "18 Pa", "0", "Limitée", "3", "Ingérée", "Retire instantanément tous les états Exténué.", "1 dose"], "off": true}, {"c": ["Élixir de constitution", "2 CO", "0", "Limitée", "3", "Ingéré", "+10 aux tests de Résistance, y compris contre la maladie et le poison.", "4 heures"], "off": false}, {"c": ["Philtre de veine froide", "3 CO", "0", "Rare", "4", "Ingéré", "Réduit d'un cran les effets de la Peur et de la Terreur. À la fin, 1 état Exténué.", "10 rounds. Contrecoup"], "off": false}, {"c": ["Baume d'argent", "5 CO", "0", "Rare", "4", "Onction", "Une arme enduite gagne l'atout Argentée. Ne fonctionne pas sur les munitions, la couche part au tir.", "1 heure. 1 dose par arme"], "off": false}, {"c": ["Onction de Morr", "4 CO", "0", "Rare", "4", "Onction", "Une arme enduite gagne Bénie (Mort-vivant). Consacrée par un prêtre, jamais vendue par lui.", "1 heure. 1 dose par arme"], "off": false}, {"c": ["Eau bénite (fiole)", "2 CO", "0", "Limitée", "Temple", "Contact", "Jetée ou montée sur un carreau creux : atout Aspergée. Voir la table des munitions.", "1 dose"], "off": false}, {"c": ["Sels de Morr", "2 CO", "0", "Rare", "3", "Répandus", "Une ligne de sel consacré : les morts-vivants mineurs doivent réussir un test de Force Mentale pour la franchir.", "10 minutes. 1 dose par seuil"], "off": false}, {"c": ["Distillat de pierre à sorcière", "8 CO", "0", "Exotique", "5", "Ingéré", "+10 aux tests de Force Mentale contre la magie. Sur une Maladresse à l'un de ces tests, jet de Corruption.", "1 heure. Contrecoup"], "off": false}, {"c": ["Fumigation de vieux-lierre", "1 CO", "1", "Limitée", "3", "Fumée", "Une pièce enfumée pendant dix minutes : les insectes, rats et vermine mineure la fuient. Utile avant de dormir dans une ruine.", "1 nuit. 1 dose par pièce"], "off": false}], "foot": ""}, {"kind": "texte", "title": "Les recettes, mode d'emploi", "note": "", "items": ["Chaque recette donne les composants, leur coût, le procédé et la durée. Les composants viennent tous du Catalogue des Matières ou de la table des matières premières du guide de l'Apothicaire. Rien n'est inventé en dehors de ces deux listes.", "La règle générale reste celle de l'Artisanat : les matières coûtent la moitié du prix de vente. Elle tient pour les remèdes et les potions. Elle ne tient pas pour les poisons, où le prix paie l'illégalité et non la matière, et où les composants reviennent souvent au quart du prix de vente. La colonne Note le signale à chaque fois.", "Un composant peut se prendre en fraction. Une demi-mesure d'esprit-de-vin coûte 4 Pistoles, un quart de fiole de vif-argent 10 Pistoles. Le coût indiqué en colonne Matières est celui de la dose unique, arrondi.", "Les procédés cités sont ceux de la table Procédés et formes du guide de l'Apothicaire, et ceux de la table Sécher, saler, conserver du guide de l'Herboriste. Appliquer un procédé en plus de la recette de base ajoute son propre DR et son propre surcoût.", "Le mortier et pilon de pierre est requis pour toute poudre et tout cataplasme. L'alambic de cuivre est requis pour toute distillation, donc pour la complexité 4 et au-delà. Sans l'outil, la préparation est impossible et non pénalisée."], "foot": ""}, {"kind": "table", "title": "Recettes · herbes et remèdes", "note": "Toutes les recettes qui suivent sont maison. Les composants viennent du Catalogue des Matières et de la table des matières premières du guide de l'Apothicaire. Le DR indiqué est celui de la complexité, sans procédé supplémentaire. Ces sept préparations sont à la portée d'un herboriste de Maîtrise 1 ou 2, sans alambic.", "cols": ["Préparation", "Compl. · DR", "Composants et quantités", "Matières", "Procédé et durée", "Note"], "rows": [{"c": ["Cataplasme de guérison", "1 · DR 2", "Graisse animale clarifiée (3 Pa) · achillée (6 Sc) · plantain (4 Sc) · mousse de chêne (4 Sc) · bande de toile (8 Sc)", "5 Pa", "Broyer au mortier, chauffer dans la graisse, étaler tiède sur la toile. 1 heure.", "Mortier requis. Le plantain peut se remplacer par de la bourrache sans changer l'effet."]}, {"c": ["Soude commune", "1 · DR 2", "Cendre d'ortie et de bardane brûlées (9 Sc) · alun et sel gemme (5 Pa)", "6 Pa", "Brûler, tamiser, mêler au sel. Se garde en flacon bouché. 1 heure.", "La branche fraîche écrasée sous le nez fait le même effet sans aucune préparation, mais une seule fois."]}, {"c": ["Tonique digestif", "1 · DR 2", "Camomille sauvage (8 Sc) · bardane (6 Sc) · écorce de saule (10 Sc)", "2 Pa", "Décoction, un quart d'heure à petits bouillons. 1 heure.", "Le procédé Décoction donne deux doses au lieu d'une, pour 2 Pistoles de plus."]}, {"c": ["Valériane préparée", "1 · DR 2", "Racine de valériane fraîche (2 Pa)", "2 Pa", "Séchage à l'ombre trois jours, puis infusion. 1 heure de travail effectif.", "Le séchage au four ramène les trois jours à une nuit, au prix de DR 3 et d'une Maladresse qui brûle tout le lot."]}, {"c": ["Mousse de tourbière", "1 · DR 2", "Sphaigne de tourbière, ramassée sans test (aucun coût) · vesse-de-loup géante (8 Sc) · achillée (6 Sc)", "1 Pa 4 Sc", "Sécher, mêler la poudre de vesse-de-loup, presser en tampons. 1 heure.", "La préparation la moins chère du document, et l'une des plus utiles. Un herboriste en fait vingt doses dans un après-midi."]}, {"c": ["Onguent d'os brisé", "2 · DR 4", "Consoude (8 Sc) · prêle (7 Sc) · graisse animale clarifiée (3 Pa) · cire et miel (4 Pa)", "8 Pa 15 Sc", "Mise à l'huile, puis liaison à la cire au bain-marie. 4 heures.", "La consoude est la clé : sans elle, ce n'est qu'un baume ordinaire et l'effet tombe."]}, {"c": ["Sels de réveil", "1 · DR 2", "Alun et sel gemme, demi-mesure (2 Pa 6 Sc) · ortie séchée (3 Sc)", "3 Pa", "Réduction en poudre, flacon bouché à la cire. 1 heure.", "Se conserve indéfiniment tant que le flacon reste fermé. Ouvert, il perd sa force en une semaine."]}], "foot": "Un groupe qui compte un herboriste devrait avoir en permanence des cataplasmes, de la mousse de tourbière et des sels de réveil. Ces trois-là coûtent moins de dix Pistoles pour dix doses et changent une soirée de soins."}, {"kind": "table", "title": "Recettes · potions et onctions", "note": "Toutes les recettes qui suivent sont maison. Les composants viennent du Catalogue des Matières et de la table des matières premières du guide de l'Apothicaire. Le DR indiqué est celui de la complexité, sans procédé supplémentaire. La complexité 4 et au-delà demande un alambic de cuivre et la responsabilité d'un apothicaire de Maîtrise 3.", "cols": ["Préparation", "Compl. · DR", "Composants et quantités", "Matières", "Procédé et durée", "Note"], "rows": [{"c": ["Potion de guérison", "2 · DR 4", "Esprit-de-vin, demi-mesure (4 Pa) · achillée (6 Sc) · consoude (8 Sc)", "5 Pa 2 Sc", "Teinture, macération de quatre heures. 4 heures.", "La teinture se conserve un an. En infusion simple, la potion est Périssable et ne tient qu'un jour."]}, {"c": ["Potion de vitalité", "3 · DR 6", "Tarrabeth (8 Pa) · camomille sauvage (8 Sc)", "8 Pa 8 Sc", "Décoction longue, réduite au tiers. 1 jour.", "La tarrabeth ne se cumule pas avec elle-même. Deux potions dans la journée n'en valent qu'une."]}, {"c": ["Élixir de constitution", "3 · DR 6", "Racines et écorces séchées (10 Pa) · millepertuis (1 Pa) · bourrache (8 Sc) · esprit-de-vin, demi-mesure (4 Pa)", "15 Pa 8 Sc", "Teinture, macération de trois jours, filtrage. 1 jour de travail.", "Un peu moins cher que la moitié du prix de vente, parce que les racines séchées servent aussi à trois autres recettes du même lot."]}, {"c": ["Philtre de veine froide", "4 · DR 8", "Racine de mandragore, un quart de racine (15 Pa) · fleur de lune, un quart de fleur (15 Pa)", "30 Pa", "Distillation à l'alambic, puis dilution à l'eau claire. 3 jours.", "Alambic requis. La mandragore se récolte de nuit sur une terre de gibet, avec Savoir (Herbes) à −30."]}, {"c": ["Baume d'argent", "4 · DR 8", "Poudre d'argent, demi-mesure (2 CO) · graisse animale clarifiée (3 Pa) · cire et miel (4 Pa) · térébenthine (2 Pa)", "49 Pa", "Liaison à chaud, brassage jusqu'au refroidissement complet. 3 jours.", "La poudre d'argent s'obtient chez un orfèvre, qui la pèse et la note. Aucune boutique de l'Empire n'en vend au comptant sans nom."]}, {"c": ["Onction de Morr", "4 · DR 8", "Eau consacrée (1 CO) · cendre d'os calcinée (6 Pa) · alun et sel gemme (5 Pa) · graisse animale clarifiée (3 Pa) · cire et miel (4 Pa)", "38 Pa", "Liaison à froid sur trois jours, remuée chaque matin. 3 jours.", "L'eau consacrée ne s'achète pas, elle s'obtient d'un temple contre service rendu. Sans elle, la recette donne un baume ordinaire et rien de plus."]}, {"c": ["Sels de Morr", "3 · DR 6", "Alun et sel gemme (5 Pa) · cendre d'os calcinée (6 Pa) · eau consacrée, demi-mesure (10 Pa)", "21 Pa", "Dissoudre, évaporer lentement, recueillir les cristaux. 1 jour.", "Le chapeau-de-fossoyeur remplace la cendre d'os et double la durée d'effet, pour 3 Couronnes de plus."]}, {"c": ["Distillat de pierre à sorcière", "5 · DR 12", "Éclat de pierre à sorcière, un fragment de la taille d'un ongle (2 CO) · vif-argent, un quart de fiole (10 Pa) · esprit-de-vin (8 Pa) · cendre d'os calcinée (6 Pa) · alun et sel gemme (5 Pa)", "69 Pa", "Distillation, trois passes successives à l'alambic. 1 semaine.", "Alambic requis. Chaque passe demande un test d'Endurance contre les vapeurs. Une Maladresse ici ne casse pas le lot, elle donne un point de Corruption."]}, {"c": ["Fumigation de vieux-lierre", "3 · DR 6", "Soufre et salpêtre, demi-mesure (7 Pa 6 Sc) · résine de pin (6 Sc) · ortie séchée (3 Sc) · vieux lierre, ramassé sans test (aucun coût)", "8 Pa 5 Sc", "Réduction en poudre, liaison à la résine, moulage en cônes. 1 jour.", "Le procédé Fumigation frappe aussi le préparateur. Travailler dehors, ou porter un linge mouillé sur le visage."]}], "foot": "L'onction de Morr et les sels de Morr dépendent d'une eau consacrée qui ne se vend pas. C'est la contrainte principale de la Voie de la Purification, et elle est délibérée."}, {"kind": "table", "title": "Recettes · poisons", "note": "Toutes les recettes qui suivent sont maison. Les composants viennent du Catalogue des Matières et de la table des matières premières du guide de l'Apothicaire. Le DR indiqué est celui de la complexité, sans procédé supplémentaire. Le prix de vente d'un poison paie l'illégalité, pas la matière. Les composants reviennent souvent au quart, parfois au douzième du prix affiché.", "cols": ["Préparation", "Compl. · DR", "Composants et quantités", "Matières", "Procédé et durée", "Note"], "rows": [{"c": ["Mort-aux-rats de Nuln", "2 · DR 4", "Vif-argent, une goutte, un dixième de fiole (4 Pa) · rouille des blés (6 Sc) · graisse animale clarifiée (3 Pa)", "7 Pa 6 Sc", "Liaison à la graisse, moulage en boulettes. 4 heures.", "Se vend librement chez tout droguiste. C'est le seul poison de cette table qu'un personnage peut acheter sans se faire remarquer."]}, {"c": ["Fiel de crapaud tacheté", "2 · DR 4", "Fiel et bile de crapaud (12 Pa) · alun et sel gemme (5 Pa)", "17 Pa", "Réduction au tiers sur feu doux, puis salaison. 4 heures.", "Le prix de vente est deux fois et demie celui des matières. La marge paie le risque, pas le travail."]}, {"c": ["Belladone préparée", "2 · DR 4", "Baies et feuilles de belladone (3 Pa) · esprit-de-vin, demi-mesure (4 Pa) · cire et miel (4 Pa)", "11 Pa", "Mise en alcool trois jours, puis mise au miel. 4 heures de travail.", "Le miel masque l'amertume et fait passer la dose dans un plat sucré. Sans lui, la victime recrache."]}, {"c": ["Venin de vipère des roseaux", "3 · DR 6", "Venin frais, un prélèvement (1 CO) donnant trois doses", "6 Pa 8 Sc par dose", "Épaissir à la chaleur du corps, appliquer sur la lame. 1 jour pour le lot.", "Le venin doit être prélevé dans l'heure sur la bête vivante. Périssable : trois jours, sauf procédé de Stabilisation."]}, {"c": ["Poudre du sommeil", "3 · DR 6", "Belladone (3 Pa) · racine de valériane (2 Pa) · amanite blanche (2 Pa) · cendre d'os calcinée comme support (6 Pa)", "13 Pa", "Séchage au four, réduction en poudre très fine, tamisage. 1 jour.", "Mortier requis. Une poudre ne s'identifie qu'à un cran de difficulté supplémentaire, ce qui est tout son intérêt."]}, {"c": ["Curare de chasse", "4 · DR 8", "Aconit (5 Pa) · venin frais (1 CO) · résine de pin (6 Sc) · poix de bois (1 Pa)", "26 Pa 6 Sc", "Réduction, liaison à la résine pour l'adhérence à la pointe. 3 jours.", "Un prélèvement donne trois munitions, comme indiqué à la table des poisons. La résine est ce qui empêche l'enduit de partir au tir."]}, {"c": ["Larmes de la sorcière", "4 · DR 8", "Digitale (3 Pa) · ergot de seigle (2 Pa) · venin frais (1 CO) · esprit-de-vin (8 Pa)", "33 Pa", "Distillation à l'alambic, une seule passe. 3 jours.", "Alambic requis. L'ergot est ce qui empêche la plaie de se refermer : sans lui, on obtient un poison ordinaire."]}, {"c": ["Élixir du bourreau", "5 · DR 12", "Aconit (5 Pa) · digitale (3 Pa) · amanite blanche (2 Pa) · vif-argent (2 CO) · esprit-de-vin (8 Pa)", "58 Pa", "Distillation, deux passes, puis concentration au bain de sable. 1 semaine.", "Alambic requis. Détenir ce flacon suffit à la pendaison, quelle que soit l'explication. Voir le guide de la Justice."]}, {"c": ["Brise-cœur", "5 · DR 12", "Digitale, triple dose (9 Pa) · amanite blanche, double dose (4 Pa) · vif-argent (2 CO) · cire et miel (4 Pa) · esprit-de-vin (8 Pa)", "65 Pa", "Distillation, trois passes, puis édulcoration au miel. 1 semaine.", "Alambic requis. Les matières valent le douzième du prix de vente. Ce qu'on achète à quarante Couronnes, c'est l'indétectabilité et le silence du vendeur."]}], "foot": "Détenir un poison de complexité 4 ou 5 sans registre nominatif suffit à ouvrir une procédure. Voir le poids de preuve dans le guide de la Justice de l'Empire."}, {"kind": "table", "title": "Recettes · drogues", "note": "Toutes les recettes qui suivent sont maison. Les composants viennent du Catalogue des Matières et de la table des matières premières du guide de l'Apothicaire. Le DR indiqué est celui de la complexité, sans procédé supplémentaire. Deux entrées de la table des Drogues, le bonnet de fou et la feuille de sonstill, ne se fabriquent pas : elles se récoltent.", "cols": ["Préparation", "Compl. · DR", "Composants et quantités", "Matières", "Procédé et durée", "Note"], "rows": [{"c": ["Chique de charretier", "1 · DR 2", "Écorce de saule (10 Sc) · ortie séchée (3 Sc) · achillée (6 Sc)", "1 Pa 7 Sc", "Séchage, hachage grossier, pressage en pain de plante. 1 heure.", "Cinq doses pour un point d'Encombrement avec la presse à herbes. Le charretier en fait lui-même et n'en achète jamais."]}, {"c": ["Racine de mandragore préparée", "2 · DR 4", "Une racine de mandragore entière (3 CO), donnant six doses", "10 Pa par dose", "Séchage à l'ombre deux semaines, découpe en chiques. 4 heures de travail.", "La racine coûte trois fois le prix d'une dose parce qu'elle en donne six. Récolte de nuit, terre de gibet, Savoir (Herbes) à −30."]}, {"c": ["Délice de Ranald", "3 · DR 6", "Racines et écorces séchées, demi-lot (5 Pa) · esprit-de-vin, quart de mesure (2 Pa) · camomille sauvage (8 Sc) · millepertuis (1 Pa)", "8 Pa 8 Sc", "Teinture, puis sublimation en poudre inhalable. 1 jour.", "Le procédé Sublimation est d'échelon 4 : un apprenti ne peut pas le tenir. Sans lui, la préparation s'ingère et le contrecoup double."]}, {"c": ["Sang-de-pierre", "3 · DR 6", "Herbe-à-jurons, demi-dose (10 Pa) · graisse animale clarifiée (3 Pa) · écorce de saule (10 Sc) · alun et sel gemme (5 Pa)", "18 Pa 10 Sc", "Réduction, liaison à la graisse, mise en pot. 1 jour.", "Préparation naine. Un forgeron de Gromnil-Bak en fait sans être apothicaire, et il vous dira que la vôtre est trop douce."]}, {"c": ["Bave", "4 · DR 8", "Amanite tue-mouches, double dose (2 Pa) · fiel et bile (12 Pa)", "14 Pa", "Macération de trois jours, filtrage à la toile. 3 jours.", "Se boit tiède, et personne ne devrait en boire. La table des Drogues en donne l'effet, qui est géré par le MJ et non par le joueur."]}, {"c": ["Mystracine", "4 · DR 8", "Racines et écorces séchées (10 Pa) · térébenthine (2 Pa)", "12 Pa", "Macération au solvant, puis réduction en pain à mâcher. 3 jours.", "Se vend 4 Pistoles et coûte 12 à fabriquer. On l'importe en masse des Royaumes Frontaliers, et personne dans l'Empire n'a intérêt à en produire."]}, {"c": ["Poussière de silène", "4 · DR 8", "Racine de nuit-blanche (4 CO) · alun et sel gemme (5 Pa) · cendre d'os calcinée (6 Pa)", "91 Pa", "Séchage au four, réduction, sublimation. 3 jours.", "La racine se récolte dans les grottes et les caves profondes, avec Savoir (Herbes) à −30. Le contrecoup de la drogue est celui de la racine, et il ne se corrige pas."]}, {"c": ["Rêve-de-Morr", "5 · DR 12", "Chapeau-de-fossoyeur, demi-mesure (1 CO 10 Pa) · cendre d'os calcinée (6 Pa) · résine de pin (6 Sc)", "36 Pa 6 Sc", "Séchage, réduction, liaison à la résine, moulage en cônes à fumer. 1 semaine.", "Le chapeau-de-fossoyeur pousse là où un corps s'est décomposé. Un apothicaire qui en achète régulièrement finit dans le carnet d'un répurgateur."]}], "foot": "La mystracine et la poussière de silène coûtent plus cher à fabriquer qu'à acheter. C'est normal et c'est écrit : certaines drogues arrivent en gros des Frontaliers, et l'Empire n'en produit pas."}, {"kind": "texte", "title": "Fabriquer soi-même une de ces préparations", "note": "Vaut aussi pour un personnage qui possède la compétence Métier appropriée sans exercer comme apothicaire.", "items": ["Lis la complexité dans la colonne Compl. de la table. Elle donne tout le reste : le DR à atteindre en test étendu, le temps par tentative, et la disponibilité des matières nécessaires.", "Vérifie la Maîtrise. Une Maîtrise 1 fabrique jusqu'à la complexité 2, une Maîtrise 2 jusqu'à 3, une Maîtrise 3 jusqu'à 4, une Maîtrise 4 jusqu'à 5. Au-delà de la sienne, le personnage tente quand même, avec un malus de deux crans de difficulté et un incident sur toute Maladresse.", "Compte les matières à la moitié du prix indiqué pour l'objet fini. Les matières précises sont dans la table des Matières premières du guide de l'Apothicaire, avec leur provenance : c'est là qu'on trouve pourquoi il faut un ossuaire, un orfèvre ou un temple complaisant.", "Applique un procédé si tu veux modifier la forme : teinture, pilule, huile de lame, concentré, édulcoré, fumigation. Chaque procédé a son propre surcoût et son propre DR, et transforme l'administration ou la détectabilité de la préparation.", "En cas d'échec au test étendu, tire sur la table des incidents du guide de l'Apothicaire, avec deux crans de faveur pour un professionnel travaillant dans son propre laboratoire.", "Les lignes marquées Récolte ne se fabriquent pas : elles se cueillent au bon endroit et à la bonne saison, ce qui relève de Survie en extérieur ou de Savoir approprié, ou s'achètent à qui l'a fait. Celles marquées Temple s'obtiennent d'un culte, contre un service et jamais contre de l'argent seul."], "foot": "Une complexité 1 se prépare pendant une pause, une complexité 3 occupe une journée entière de temps mort, une complexité 5 est un objectif de scénario avec ses matières à trouver."}, {"kind": "texte", "title": "Règles d'emploi", "note": "", "items": ["Administration. Ingérée demande de faire avaler la substance, Mâchée reste active tant qu'on la garde en bouche, Inhalée agit sur un round mais se dissipe au vent, Contact s'applique sur une plaie ou la peau, Lame et Munition enduisent une arme, Onction traite l'arme elle-même, Fumée et Répandus affectent un lieu.", "Poison sur une arme. Une dose couvre une arme de mêlée ou trois munitions. L'effet se perd après trois touches réussies, ou au bout de 1d10 heures, ou dès que l'arme est nettoyée. Enduire une lame prend une action et un test d'Agilité en cas de précipitation : un échec, et c'est le porteur qui se coupe.", "Cumul. Deux doses d'une même substance ne se cumulent jamais, la seconde prolonge simplement la durée. Deux substances différentes agissant sur la même caractéristique imposent un test d'Endurance Difficile (−10) ou l'état Nauséeux au choix du MJ.", "Contrecoup. Les substances marquées Contrecoup infligent leur pénalité à la fin de l'effet, et cette pénalité ne se soigne pas : elle passe avec le temps.", "Addictive X. Après chaque usage, test d'Endurance avec un malus de 10 × X. Un échec crée une dépendance : le personnage doit réussir un test de Force Mentale pour refuser une occasion de consommer, et un jour sans dose lui vaut un état Exténué qui ne part qu'avec la substance.", "Détectable X. Modificateur au test de Perception ou d'Intuition pour repérer la substance dans un plat ou une boisson. Un poison sans mention est décelable à un test Difficile (−10).", "Périssable. Perd tout effet un mois après sa préparation, une semaine s'il fait chaud. Les poisons animaux sont les plus fragiles.", "Fabrication. Test étendu de Métier (Apothicaire) pour une potion, un poison ou un distillat, de Métier (Herboriste) pour un cataplasme, une infusion ou un onguent simple. Les Outils de profession correspondants sont requis dans les deux cas : sans eux, tout test subit au minimum -20. Le DR à atteindre et le temps par tentative se lisent dans la colonne Compl. de la table, jama var db = null, refData = null, refSave = null;
try{
  if(typeof firebase !== 'undefined'){
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    db = firebase.database();
    refData = db.ref(RACINE + '/donnees');

  }
}catch(e){ console.warn('Firebase indisponible :', e); }

/* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

/* ---------- lecture initiale : cache local, puis la base fait autorité ---------- */
function charger(){
  try{
    var brut = localStorage.getItem(CACHE);
    if(brut){ data = normaliser(JSON.parse(brut)); }
  }catch(e){}
  if(!data) data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}
function cacher(){
  try{ localStorage.setItem(CACHE, JSON.stringify(data)); }catch(e){}
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  cacher();
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  cacher();
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    cacher();
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') return JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  d.sections = tab(d.sections);
  for(var i = 0; i < d.sections.length; i++){
    var s = d.sections[i];
    s.kind = s.kind || 'texte';
    s.title = s.title || '';
    s.note = s.note || '';
    s.foot = s.foot || '';
    if(s.kind === 'table'){
      s.cols = tab(s.cols);
      s.rows = tab(s.rows);
      for(var r = 0; r < s.rows.length; r++){
        s.rows[r] = s.rows[r] || {};
        s.rows[r].c = tab(s.rows[r].c);
        s.rows[r].off = !!s.rows[r].off;
      }
    } else {
      s.items = tab(s.items);
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def = d.legend[l].def || '';
    d.legend[l].off = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 || n.indexOf('serv') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var si = 0; si < data.sections.length; si++){
    var s = data.sections[si];
    var n = (s.kind === 'table') ? s.rows.length : s.items.length;
    h += '<div class="sec" data-s="' + si + '">';
    h += '<div class="sechead">';
    h +=   '<button data-a="fold">▾</button>';
    h +=   '<span class="t" contenteditable data-t="st" data-s="' + si + '">' + esc(s.title) + '</span>';
    h +=   '<span class="n">' + n + '</span>';
    h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
    h +=   '<button data-a="delsec">Supprimer</button>';
    h += '</div>';
    h += '<div class="snote" contenteditable data-t="sn" data-s="' + si + '">' + esc(s.note || '') + '</div>';
    h += '<div class="secbody">';

    var PIED = s.foot || s.foot === '' ? '<div class="sfoot" contenteditable data-t="sf" data-s="' + si + '">' + esc(s.foot || '') + '</div>' : '';
    if(s.kind === 'table'){
      h += '<table><thead><tr>';
      for(var ci = 0; ci < s.cols.length; ci++)
        h += '<th contenteditable data-t="col" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
      h += '<th></th></tr></thead><tbody>';
      for(var ri = 0; ri < s.rows.length; ri++){
        var r = s.rows[ri];
        h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
        for(var k = 0; k < s.cols.length; k++){
          var mot = (s.cols[k] || '').toLowerCase();
          var cle = (mot.indexOf('atout') === 0 || mot.indexOf('mots') >= 0 || mot.indexOf('effet') === 0) ? ' data-atout="1"' : '';
          h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
               '" data-s="' + si +
               '" data-r="' + ri + '" data-c="' + k + '"' + cle + '>' + esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
        }
        h += '<td class="acts"><button data-a="off" title="Ligne du livre">★</button>' +
             '<button data-a="dup" title="Dupliquer">⧉</button>' +
             '<button data-a="del" title="Supprimer">✕</button></td></tr>';
      }
      h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
    } else {
      h += '<div class="items">';
      for(var ii = 0; ii < s.items.length; ii++){
        h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
             '<div class="txt" contenteditable data-t="item" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
             '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
      }
      h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
    }
    h += '</div>';
    h += '</div>';
  }

  if(data.legend && data.legend.length){
    h += '<h2 class="bloc">Légende</h2><div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Synchronisation automatique avec la base en ligne, sans rien à valider. Survoler une cellule d\'effet affiche les définitions reconnues.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var s = +el.getAttribute('data-s'), r = +el.getAttribute('data-r'),
      c = +el.getAttribute('data-c'), i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent;
  if(t === 'intro') data.intro = v;
  else if(t === 'st') data.sections[s].title = v;
  else if(t === 'sn') data.sections[s].note = v;
  else if(t === 'sf') data.sections[s].foot = v;
  else if(t === 'col') data.sections[s].cols[c] = v;
  else if(t === 'cell') data.sections[s].rows[r].c[c] = v;
  else if(t === 'item') data.sections[s].items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var si = +sec.getAttribute('data-s'), S = data.sections[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'delsec'){
    if(confirm('Supprimer la section « ' + S.title + ' » ?')){ data.sections.splice(si,1); sauver(); rendre(); }
    return;
  }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < data.sections.length){
      var tmp = data.sections[si]; data.sections[si] = data.sections[n]; data.sections[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

  for(var i = 0; i < data.sections.length; i++) if(data.sections[i].kind === 'table'){ modele = data.sections[i]; break; }
  data.sections.push({kind:'table', title:'Nouveau tableau', note:'', foot:'',
    cols: modele ? modele.cols.slice() : ['Objet','Coût','Disponibilité','Effet'], rows:[]});
  sauver(); rendre();
};

};

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
</script>
