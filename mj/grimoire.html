<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#c2452a; --acc2:#c9a227; --off:#8d8375;
    --cuir:#241d17; --rail:220px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.34rem .6rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.8rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.on{background:#3a1512;border-color:#5d201a;color:#fff}
  input{background:#0e0c0b;border:1px solid var(--line);color:var(--txt);padding:.36rem .55rem;
       border-radius:4px;font-family:inherit;font-size:.85rem}
  input:focus{outline:none;border-color:var(--acc2)}

  /* ---------- porte ---------- */
  #porte{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(circle at 50% 40%,#1d1813,#0b0a09 70%)}
  #porte .boite{width:min(360px,90vw);text-align:center;padding:1.6rem 1.4rem;background:var(--panel);
       border:1px solid var(--line);border-radius:6px;position:relative}
  #porte .boite::after{content:'';position:absolute;inset:5px;border:1px solid #3d332a;
       border-radius:3px;pointer-events:none;opacity:.55}
  #porte h1{margin:0 0 .2rem;font-size:1.3rem;letter-spacing:.28em;text-transform:uppercase;font-weight:600}
  #porte h1 span{color:var(--acc)}
  #porte p{margin:.1rem 0 1.1rem;font-size:.78rem;color:var(--dim);letter-spacing:.06em}
  #porte input{width:100%;text-align:center;margin:0 0 .6rem}
  #porte button{width:100%;padding:.5rem}
  #porte .err{color:#e08a80;font-size:.78rem;min-height:1.1em;margin:.5rem 0 0}

  /* ---------- charpente ---------- */
  #app{display:none;flex-direction:column;height:100%}
  #app.vu{display:flex}

  #haut{flex:0 0 auto;display:flex;align-items:center;gap:.45rem;padding:.45rem .7rem;
       background:linear-gradient(180deg,#221c16,#161311);border-bottom:1px solid var(--line);
       box-shadow:0 2px 10px #0007;z-index:20;flex-wrap:wrap}
  #haut .marque{font-size:.95rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
       margin-right:.4rem;white-space:nowrap}
  #haut .marque span{color:var(--acc)}
  #haut .vide{flex:1}
  .groupe{display:flex;gap:2px;background:#0e0c0b;border:1px solid var(--line);border-radius:5px;padding:2px}
  .groupe button{border-color:transparent;background:transparent;padding:.28rem .6rem}
  .groupe button.on{background:#3a1512;border-color:#5d201a}
  #zval{font-size:.75rem;color:var(--dim);min-width:3.1rem;text-align:center}
  #b-plein{font-size:1rem;line-height:1;padding:.3rem .55rem}

  #corps{flex:1;display:flex;min-height:0}

  /* ---------- tranche et marque-pages ---------- */
  #rail{flex:0 0 var(--rail);display:flex;flex-direction:column;min-height:0;
       background:linear-gradient(90deg,var(--cuir),#1a1511);border-right:1px solid var(--line);
       position:relative;transition:flex-basis .18s}
  #rail::after{content:'';position:absolute;top:0;right:0;bottom:0;width:3px;
       background:linear-gradient(90deg,transparent,#0009);pointer-events:none}
  #app.rail-plie #rail{flex-basis:0;overflow:hidden;border-right:none}
  #rail .tete{padding:.45rem .5rem;border-bottom:1px solid var(--line)}
  #rail .tete input{width:100%}
  #listes{flex:1;overflow-y:auto;padding:.4rem .35rem 1.2rem}
  .famille{margin:0 0 .55rem}
  .famille>.nom{font-size:.62rem;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);
       padding:.25rem .45rem;display:flex;align-items:center;gap:.4rem}
  .famille>.nom i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .mp{display:block;width:100%;text-align:left;background:#1e1915;border:1px solid #2b241e;
       border-left:3px solid var(--line);border-radius:0 4px 4px 0;color:var(--txt);
       padding:.32rem .5rem;margin:0 0 3px;font-size:.82rem;cursor:pointer;line-height:1.25;
       font-family:inherit;transition:background .1s,transform .1s}
  .mp:hover{background:#2a231d;transform:translateX(2px);color:#fff}
  .mp.actif{background:#33291f;color:#fff;box-shadow:inset 0 0 0 1px rgba(201,162,39,.35)}
  .mp .zn{float:right;font-size:.62rem;color:var(--acc2);letter-spacing:.08em;opacity:.85}
  .mp.masque{display:none}

  /* ---------- scène ---------- */
  #scene{flex:1;min-width:0;display:grid;gap:5px;padding:5px;background:#0d0b0a;position:relative}
  #scene.mosaique{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  #scene.lecture{grid-template-columns:1fr;grid-template-rows:1fr}
  #scene.lecture .zone{display:none}
  #scene.lecture .zone[data-z="0"]{display:flex}
  #scene.zoomee .zone{display:none}
  #scene.zoomee .zone.grande{display:flex;grid-column:1/-1;grid-row:1/-1}

  #scenarios{position:absolute;inset:0;z-index:6;visibility:hidden}
  #scenarios.vu{visibility:visible}
  .scn{position:absolute;inset:0;visibility:hidden;background:var(--bg);
       border:1px solid var(--acc2);border-radius:5px;overflow:hidden}
  .scn.vu{visibility:visible}
  .scn iframe{width:100%;height:100%;border:0;display:block}
  .scn-ferme{position:absolute;bottom:10px;right:14px;z-index:3;opacity:.3;
       background:#0d0b0ae8;box-shadow:0 2px 10px #000a}
  .scn-ferme:hover{opacity:1}

  .zone{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);
       border:1px solid var(--line);border-radius:5px;overflow:hidden;position:relative}
  .zone.visee{border-color:var(--acc2);box-shadow:0 0 0 1px rgba(201,162,39,.25)}
  .ztete{flex:0 0 auto;display:flex;align-items:center;gap:.3rem;padding:.28rem .35rem;
       background:linear-gradient(180deg,#241d17,#191512);border-bottom:1px solid var(--line);cursor:pointer}
  .ztete .num{font-size:.62rem;letter-spacing:.1em;color:var(--dim);padding:0 .25rem;flex:0 0 auto}
  .ztete select{flex:1;min-width:0;background:#0e0c0b;border:1px solid var(--line);color:var(--txt);
       font-family:inherit;font-size:.78rem;padding:.22rem .3rem;border-radius:3px;cursor:pointer}
  .ztete select:focus{outline:none;border-color:var(--acc2)}
  .ztete button{padding:.16rem .38rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .ztete button:hover{color:#fff;border-color:var(--line)}
  .ztete a{padding:.16rem .38rem;font-size:.72rem;color:var(--dim);text-decoration:none;border-radius:3px}
  .ztete a:hover{color:#fff;background:#2a2521}
  .zcadre{flex:1;position:relative;min-height:0;background:var(--bg)}
  .zcadre iframe{width:100%;height:100%;border:0;display:block}
  .zvide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       text-align:center;color:var(--off);font-size:.8rem;font-style:italic;padding:1rem;
       background:repeating-linear-gradient(45deg,#141110,#141110 12px,#161312 12px,#161312 24px)}
  .zerr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:.5rem;text-align:center;color:#e08a80;font-size:.82rem;padding:1rem;background:#140f0e}
  .zerr code{color:var(--dim);font-size:.76rem}

  /* ---------- recherche transversale ---------- */
  #trouve{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:none;
       background:#0b0a09f2;padding:8px}
  #trouve.vu{display:flex;flex-direction:column}
  #trouve .tete{flex:0 0 auto;display:flex;gap:.4rem;align-items:center;padding:0 0 .5rem}
  #trouve .tete input{flex:1}
  #trouve .corps{flex:1;overflow-y:auto;padding:0 .2rem}
  #trouve .etat{color:var(--dim);font-size:.82rem;font-style:italic;padding:.6rem .2rem}
  .res-doc{margin:0 0 .7rem}
  .res-doc>.nom{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);
       padding:.25rem .2rem;border-bottom:1px solid var(--line);margin:0 0 .3rem;
       display:flex;align-items:center;gap:.4rem}
  .res-doc>.nom i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .res{display:block;width:100%;text-align:left;background:#191512;border:1px solid #2b241e;
       border-radius:4px;color:var(--txt);padding:.4rem .6rem;margin:0 0 3px;font-size:.83rem;
       cursor:pointer;font-family:inherit;line-height:1.4}
  .res:hover{background:#2a231d;border-color:var(--acc2)}
  .res .t{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
       margin:0 0 .15rem}
  .res mark{background:rgba(201,162,39,.28);color:#fff;border-radius:2px;padding:0 1px}

  /* ---------- rapport de liens ---------- */
  #rapport{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:#000a}
  #rapport.vu{display:flex}
  #rapport .boite{width:min(520px,92vw);max-height:80vh;overflow:auto;background:var(--panel);
       border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem}
  #rapport h2{margin:0 0 .6rem;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2)}
  #rapport ul{margin:0;padding:0;list-style:none;font-size:.82rem}
  #rapport li{padding:.22rem 0;border-bottom:1px solid #262019;display:flex;gap:.5rem}
  #rapport li b{flex:0 0 4.2rem;font-weight:400;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
  #rapport li.ok b{color:#8fae7e}
  #rapport li.ko b{color:#e08a80}
  #rapport .fin{margin:.8rem 0 0;display:flex;gap:.5rem;justify-content:flex-end}

  #aide{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:120;
       background:#0d0b0ae8;border:1px solid var(--line);border-radius:4px;padding:.35rem .7rem;
       font-size:.74rem;color:var(--dim);letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity .3s}
  #aide.vu{opacity:1}

  @media(max-width:900px){
    #scene.mosaique{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(220px,1fr));overflow-y:auto}
    #rail{position:absolute;left:0;top:0;bottom:0;z-index:30;flex-basis:200px}
    #app:not(.rail-plie) #scene{opacity:.35}
  }
</style>
</head>
<body>

<div id="porte">
  <div class="boite">
    <h1>Le <span>Grimoire</span></h1>
    <p>Réservé au meneur</p>
    <input type="password" id="mdp" placeholder="Mot de passe" autocomplete="off">
    <button id="b-entrer">Ouvrir</button>
    <p class="err" id="mdp-err"></p>
  </div>
</div>

<div id="app">
  <header id="haut">
    <button id="b-rail" title="Replier la tranche (T)">☰</button>
    <div class="marque">Le <span>Grimoire</span></div>
    <div class="groupe" id="modes">
      <button data-mode="lecture">Lecture</button>
      <button data-mode="mosaique">Mosaïque</button>
    </div>
    <div class="groupe" id="scenarios-bt">
      <button data-scn="bds" title="Afficher le scénario De Boue et de Sang (B)">BDS</button>
      <button data-scn="eclipse" title="Afficher le scénario L’Éclipse (E)">Éclipse</button>
    </div>
    <div class="vide"></div>
    <button id="b-verrou" title="Empêche toute modification des documents">Lecture seule</button>
    <button id="b-plier" title="Ouvrir les documents avec toutes les sections repliées">Sections repliées</button>
    <div class="groupe">
      <button id="b-zmoins" title="Réduire le texte de la zone visée">A−</button>
      <span id="zval">100 %</span>
      <button id="b-zplus" title="Agrandir le texte de la zone visée">A+</button>
    </div>
    <button id="b-trouve" title="Chercher dans les vingt-cinq documents à la fois (Ctrl+K)">⌕ Chercher partout</button>
    <button id="b-liens" title="Vérifier que chaque document existe bien dans mj/">Vérifier les liens</button>
    <button id="b-plein" title="Plein écran (F)">⌕</button>
  </header>

  <div id="corps">
    <nav id="rail">
      <div class="tete"><input type="search" id="filtre" placeholder="Filtrer les marque-pages…"></div>
      <div id="listes"></div>
    </nav>
    <main id="scene" class="mosaique">
      <div id="scenarios"></div>
      <div id="trouve">
        <div class="tete">
          <input type="search" id="trouve-q" placeholder="Chercher dans tous les documents…">
          <button id="trouve-relire" title="Relire la base">⟳</button>
          <button id="trouve-fermer" title="Fermer (Échap)">Fermer</button>
        </div>
        <div class="corps" id="trouve-corps"><div class="etat">Tape au moins trois lettres.</div></div>
      </div>
    </main>
  </div>
</div>

<div id="rapport">
  <div class="boite">
    <h2>Vérification des liens</h2>
    <ul id="rapport-liste"></ul>
    <div class="fin"><button id="b-rapport-fermer">Fermer</button></div>
  </div>
</div>

<div id="aide"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   Le Grimoire — fenêtre de consultation MJ
   Les documents restent des pages autonomes chargées en iframe.
   Le Grimoire n'est qu'un cadre : aucune donnée n'est stockée ici.
   ============================================================ */

var MDP     = 'Von Carstein';
var CLE_SES = 'grimoire_mj';
var CLE_ETAT= 'grimoire_etat_v1';

var FAMILLES = [
  { id:'regles',    nom:'Règles et Équipement', c:'#c2452a' },
  { id:'magie',     nom:'Magie et Foi',         c:'#8a7fb0' },
  { id:'metiers',   nom:'Métiers et Artisanat', c:'#c9a227' },
  { id:'creatures', nom:'Créatures',            c:'#7a9a6b' },
  { id:'monde',     nom:'Monde et Enquête',     c:'#6f93a8' }
];

/* Un seul endroit à corriger si un nom de fichier diffère.
   GitHub Pages est sensible à la casse : le bouton « Vérifier les liens »
   signale toute entrée introuvable. */
var DOCS = [
  { t:'Compétences',                f:'Competences.html',                 g:'regles' , r:'competences' },
  { t:'Talents',                    f:'Talents.html',                     g:'regles' , r:'talents' },
  { t:'États et Réserves',          f:'Etats-et-Reserves.html',           g:'regles' , r:'etats' },
  { t:'Blessures, Maladies, Soins', f:'Blessures-Maladies-et-Soins.html', g:'regles' , r:'blessures' },
  { t:'Armes et Munitions',         f:'Armes-et-Munitions.html',          g:'regles' , r:'armes' },
  { t:'Armures',                    f:'Armures.html',                     g:'regles' , r:'armures' },
  { t:'Qualité et Solidité',        f:'Qualite-et-Solidite.html',         g:'regles' , r:'qualite' },
  { t:'Races et Création',          f:'Races-et-Creation.html',           g:'regles' , r:'races' },
  { t:'Signes Particuliers',        f:'Signes-Particuliers.html',         g:'regles' , r:'signes' },
  { t:'Carrières',                  f:'carrieres.html',                   g:'regles' },

  { t:'Cultes, Foi et Péché',       f:'Cultes-Foi-et-Peche.html',         g:'magie' , r:'cultes' },
  { t:'Corruption',                 f:'Corruption.html',                  g:'magie' , r:'corruption' },
  { t:'Domaines et Traditions',     f:'domaine-traditions.html',          g:'magie' },
  { t:'Domaines et Charmes',        f:'domaine-charmes.html',             g:'magie' },
  { t:'Charmes permanents',         f:'charmes-permanents.html',          g:'magie' },

  { t:'Artisanat',                  f:'Artisanat.html',                   g:'metiers' , r:'artisanat' },
  { t:'La Forge',                   f:'La-Forge.html',                    g:'metiers' , r:'forge' },
  { t:'Métier Apothicaire',         f:'Metier-Apothicaire.html',          g:'metiers' , r:'apothicaire' },
  { t:'Métier Herboriste',          f:'Metier-Herboriste.html',           g:'metiers' , r:'herboriste' },
  { t:'Métier Colifichets',         f:'Metier-Colifichets.html',          g:'metiers' , r:'colifichets' },
  { t:'Métier Ingénieur',           f:'Metier-Ingenieur.html',            g:'metiers' , r:'ingenieur' },
  { t:'Catalogue des Matières',     f:'Catalogue-des-Matieres.html',      g:'metiers' , r:'catalogue-matieres' },
  { t:'Cuisine et Auberge',         f:'Cuisine-et-Auberge.html',          g:'metiers' , r:'cuisine' },
  { t:'Drogues, Poisons, Herbes',   f:'Drogues-Poisons-Herbes-Potions.html', g:'metiers' , r:'potions' },

  { t:'Bestiaire',                  f:'Bestiaire.html',                   g:'creatures' , r:'bestiaire' },
  { t:'Traits de Créature',         f:'Traits-de-Creature.html',          g:'creatures' , r:'traits' },

  { t:'Justice de l’Empire',        f:'Justice-de-l-Empire.html',         g:'monde' , r:'justice' },
  { t:'Mener une Enquête',          f:'Mener-une-Enquete.html',           g:'monde' , r:'enquete' },
  { t:'Voyages et Campements',      f:'Voyages-et-Campements.html',       g:'monde' , r:'voyages' }
];

var PAS_ZOOM = [70, 80, 90, 100, 110, 125, 140, 160];

var etat = {
  mode: 'mosaique',
  zones: [null, null, null, null],
  zooms: [100, 100, 100, 100],
  visee: 0,
  agrandie: null,
  railPlie: false,
  verrou: true,
  plier: true,
  scenario: null
};

var $  = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };

/* ---------------- persistance ---------------- */

function lireEtat(){
  try{
    var brut = localStorage.getItem(CLE_ETAT);
    if(!brut) return;
    var o = JSON.parse(brut);
    if(o && typeof o === 'object'){
      if(o.mode === 'lecture' || o.mode === 'mosaique') etat.mode = o.mode;
      if(Array.isArray(o.zones) && o.zones.length === 4) etat.zones = o.zones;
      if(Array.isArray(o.zooms) && o.zooms.length === 4) etat.zooms = o.zooms;
      if(typeof o.railPlie === 'boolean') etat.railPlie = o.railPlie;
      if(typeof o.verrou === 'boolean')  etat.verrou  = o.verrou;
      if(typeof o.plier === 'boolean')   etat.plier   = o.plier;
      if(o.scenario === 'bds' || o.scenario === 'eclipse') etat.scenario = o.scenario;
      if(typeof o.visee === 'number' && o.visee >= 0 && o.visee < 4) etat.visee = o.visee;
    }
  }catch(e){}
}

function ecrireEtat(){
  try{
    localStorage.setItem(CLE_ETAT, JSON.stringify({
      mode: etat.mode, zones: etat.zones, zooms: etat.zooms,
      visee: etat.visee, railPlie: etat.railPlie, verrou: etat.verrou, plier: etat.plier, scenario: etat.scenario
    }));
  }catch(e){}
}

/* ---------------- porte ---------------- */

function ouvrirPorte(){
  $('#porte').style.display = 'none';
  $('#app').classList.add('vu');
  demarrer();
}

function tenterMdp(){
  var v = $('#mdp').value.trim();
  if(v === MDP){
    try{ sessionStorage.setItem(CLE_SES, '1'); }catch(e){}
    ouvrirPorte();
  }else{
    $('#mdp-err').textContent = 'Mot de passe incorrect.';
    $('#mdp').value = '';
    $('#mdp').focus();
  }
}

/* ---------------- construction ---------------- */

function docParFichier(f){
  for(var i = 0; i < DOCS.length; i++){ if(DOCS[i].f === f) return DOCS[i]; }
  return null;
}

function couleurFamille(g){
  for(var i = 0; i < FAMILLES.length; i++){ if(FAMILLES[i].id === g) return FAMILLES[i].c; }
  return '#37302a';
}

function bâtirRail(){
  var hote = $('#listes');
  hote.innerHTML = '';
  FAMILLES.forEach(function(fam){
    var lot = DOCS.filter(function(d){ return d.g === fam.id; });
    if(!lot.length) return;
    var bloc = document.createElement('div');
    bloc.className = 'famille';
    var titre = document.createElement('div');
    titre.className = 'nom';
    titre.innerHTML = '<i style="background:' + fam.c + '"></i>';
    titre.appendChild(document.createTextNode(fam.nom));
    bloc.appendChild(titre);
    lot.forEach(function(d){
      var b = document.createElement('button');
      b.className = 'mp';
      b.type = 'button';
      b.dataset.f = d.f;
      b.style.borderLeftColor = fam.c;
      b.innerHTML = '<span class="zn"></span>';
      b.appendChild(document.createTextNode(d.t));
      b.addEventListener('click', function(){
        if(etat.scenario) montrerScenario(null);
        poserDoc(cibleCourante(), d.f);
      });
      bloc.appendChild(b);
    });
    hote.appendChild(bloc);
  });
}

function optionsSelect(sel, courant){
  sel.innerHTML = '';
  var vide = document.createElement('option');
  vide.value = '';
  vide.textContent = '— zone vide —';
  sel.appendChild(vide);
  FAMILLES.forEach(function(fam){
    var lot = DOCS.filter(function(d){ return d.g === fam.id; });
    if(!lot.length) return;
    var grp = document.createElement('optgroup');
    grp.label = fam.nom;
    lot.forEach(function(d){
      var o = document.createElement('option');

/* ---------------- documents ---------------- */

function cibleCourante(){

function poserDoc(i, fichier){

/* Habillage d'un document chargé : on est en même origine, donc on peut
   masquer la barre d'édition et verrouiller la saisie sans toucher au fichier. */
function habiller(i){
  var z = $('#scene .zone[data-z="' + i + '"]');
  var fr = z.querySelector('iframe');
  if(!fr) return;
  var d;
  try{ d = fr.contentDocument; }catch(e){ return; }
  if(!d || !d.body) return;

  if(/404|not found|site introuvable/i.test(d.title || '')){
    erreurZone(i, etat.zones[i]);
    return;
  }

  var s = d.getElementById('grimoire-style');
  if(!s){
    s = d.createElement('style');
    s.id = 'grimoire-style';
    (d.head || d.documentElement).appendChild(s);
  }
  s.textContent =
    '.retour,#b-push,#b-print{display:none!important}' +
    (etat.verrou
      ? '#b-tab,#b-txt,#b-leg,.acts,.acts2,.addrow,.hint{display:none!important}' +
        '.sechead button:not(:first-of-type){display:none!important}'
      : '') +
    (etat.plier ? '.intro{display:none!important}' : '') +
    '::-webkit-scrollbar{width:11px;height:11px}' +
    '::-webkit-scrollbar-track{background:#0e0c0b}' +
    '::-webkit-scrollbar-thumb{background:#3a322b;border-radius:6px;border:2px solid #0e0c0b}' +
    '::-webkit-scrollbar-thumb:hover{background:#4c4137}';

  if(!fr.dataset.branche){
    fr.dataset.branche = '1';
    // Le verrou ne vise que le contenu éditable : les champs de filtre restent utilisables.
    d.addEventListener('beforeinput', function(e){ if(etat.verrou && e.target && e.target.isContentEditable) e.preventDefault(); }, true);
    d.addEventListener('paste',       function(e){ if(etat.verrou && e.target && e.target.isContentEditable) e.preventDefault(); }, true);
    d.addEventListener('drop',        function(e){ if(etat.verrou && e.target && e.target.isContentEditable) e.preventDefault(); }, true);
    d.addEventListener('keydown', clavier, true);
    d.addEventListener('mousedown', function(){ viser(i); }, true);
    surveiller(d);
    if(etat.plier) plierPlusTard(d, 0);
  }

  nettoyerBarre(d);
  appliquerZoom(i);
}

/* Les libellés varient d'un document à l'autre : on repère les boutons
   d'ajout et de suppression au texte plutôt qu'à l'identifiant. */
function nettoyerBarre(d){
  var lot;
  try{ lot = d.querySelectorAll('.bar button'); }catch(e){ return; }
  Array.prototype.forEach.call(lot, function(b){
    var t = (b.textContent || '').trim();
    var edite = /^\+/.test(t) || /^(supprimer|ajouter|nouvelle?|push)$/i.test(t);
    if(edite) b.style.display = etat.verrou ? 'none' : '';
  });
}

function surveiller(d){
  if(!window.MutationObserver || !d.body) return;
  var attente = null;
  var depart = Date.now();
  var obs = new MutationObserver(function(){
    if(attente) return;
    attente = setTimeout(function(){
      attente = null;
      nettoyerBarre(d);
      // Les documents se rendent en plusieurs passes, cache puis base :
      // on maintient le repli pendant les premières secondes seulement.
      if(etat.plier && !d.grimoireLibre && Date.now() - depart < 6000) appliquerRepli(d, true);
    }, 150);
  });
  obs.observe(d.body, { childList:true, subtree:true });
}

/* Les documents se remplissent après coup, depuis le cache puis depuis
   la base : on retente le repli tant qu'aucune section n'est apparue. */
function plierPlusTard(d, essai){
  if(essai > 12) return;
  setTimeout(function(){
    var sections;
    try{ sections = d.querySelectorAll('.sec'); }catch(e){ return; }
    if(d.grimoireLibre) return;
    if(!sections || !sections.length){ plierPlusTard(d, essai + 1); return; }
    appliquerRepli(d, true);
  }, 300);
}

/* Tous les documents n'ont pas de bouton « Replier tout » : on l'emploie
   quand il existe, pour garder son libellé juste, sinon on replie les
   sections une à une. Le chevron de chaque titre rouvre dans les deux cas. */
function appliquerRepli(d, plier){
  var bouton, sections;
  try{
    bouton = d.getElementById('b-fold');
    sections = d.querySelectorAll('.sec');
  }catch(e){ return; }
  if(!sections || !sections.length) return;
  var ouvertes = 0;
  Array.prototype.forEach.call(sections, function(s){ if(!s.classList.contains('closed')) ouvertes++; });
  if(plier && ouvertes === 0) return;
  if(!plier && ouvertes === sections.length) return;
  if(bouton){ bouton.click(); return; }
  Array.prototype.forEach.call(sections, function(s){ s.classList.toggle('closed', plier); });
}

function basculerRepli(){
  etat.plier = !etat.plier;
  rehabillerTout();
  for(var i = 0; i < 4; i++){
    var z = $('#scene .zone[data-z="' + i + '"]');
    var fr = z ? z.querySelector('iframe') : null;
    if(!fr) continue;
    try{
      if(fr.contentDocument){
        fr.contentDocument.grimoireLibre = false;
        appliquerRepli(fr.contentDocument, etat.plier);
      }
    }catch(e){}
  }
  majHaut();
  ecrireEtat();
  souffler(etat.plier ? 'Sections repliées, à ouvrir au besoin' : 'Sections dépliées');
}

function rehabillerTout(){
  for(var i = 0; i < 4; i++){ if(etat.zones[i]) habiller(i); }
}

function reglerZoom(sens){

function basculerPlein(){
  if(document.fullscreenElement){
    if(document.exitFullscreen) document.exitFullscreen();
  }else{
    var e = document.documentElement;
    if(e.requestFullscreen) e.requestFullscreen();

var minuteurAide = null;
function souffler(txt){
  var a = $('#aide');
  a.textContent = txt;

/* ---------------- clavier ---------------- */

function clavier(e){
  if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){ ouvrirRecherche(); e.preventDefault(); return; }
  var c = e.target;
  if(c && (c.tagName === 'INPUT' || c.tagName === 'SELECT' || c.tagName === 'TEXTAREA' || c.isContentEditable)) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;

  var k = e.key;
  if(k >= '1' && k <= '4'){
    var i = parseInt(k, 10) - 1;
    if(etat.mode === 'lecture'){ basculerMode('mosaique'); }
    basculerAgrandie(i);
    e.preventDefault();
  }else if(k === 'f' || k === 'F'){
    basculerPlein(); e.preventDefault();
  }else if(k === 'm' || k === 'M'){
    basculerMode(etat.mode === 'lecture' ? 'mosaique' : 'lecture'); e.preventDefault();
  }else if(k === 't' || k === 'T'){
    basculerRail(); e.preventDefault();
  }else if(k === 'b' || k === 'B'){
    montrerScenario('bds'); e.preventDefault();
  }else if(k === 'e' || k === 'E'){
    montrerScenario('eclipse'); e.preventDefault();
  }else if(k === 'Escape'){
    if($('#trouve').classList.contains('vu')){ fermerRecherche(); }
    else if($('#rapport').classList.contains('vu')){ $('#rapport').classList.remove('vu'); }
    else if(etat.scenario){ montrerScenario(null); }
    else if(etat.agrandie !== null){ etat.agrandie = null; majScene(); majHaut(); }
    e.preventDefault();
  }else if(k === '+' || k === '='){
    reglerZoom(1); e.preventDefault();
  }else if(k === '-'){
    reglerZoom(-1); e.preventDefault();
  }
}

var index = null;
var indexEnCours = null;
var indexBilan = { lus:0, vides:0, erreurs:0, motif:'' };

function texteDeSection(sec){
  var bouts = [];
  if(sec.title) bouts.push(sec.title);
  if(sec.note) bouts.push(sec.note);
  tab(sec.items).forEach(function(it){ if(it) bouts.push(String(it)); });
  tab(sec.rows).forEach(function(r){
    if(r) bouts.push(tab(r.c).join(' · '));
  });
  if(sec.foot) bouts.push(sec.foot);
  return bouts.join('\n');
}

/* Firebase efface les tableaux vides et renumérote parfois en objet :
   on remet tout d'aplomb avant de lire. */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a, b){ return a - b; });
    return k.map(function(c){ return x[c]; });
  }
  return [];
}

function moissonner(d, payload){
  var lot = [];
  if(!payload) return lot;

  function avaler(secs, prefixe){
    tab(secs).forEach(function(sec){
      if(!sec) return;
      var titre = sec.title || '';
      if(prefixe) titre = titre ? prefixe + ' · ' + titre : prefixe;
      lot.push({ doc:d, titre:titre, texte:texteDeSection(sec) });
    });
  }

  // Deux générations de documents cohabitent : les uns portent sections à la
  // racine, les autres les rangent dans groups.
  avaler(payload.sections, '');
  tab(payload.groups).forEach(function(g){
    if(!g) return;
    avaler(g.sections, g.title || '');
    if(g.note) lot.push({ doc:d, titre:g.title || '', texte:g.note });
  });
  if(payload.intro) lot.push({ doc:d, titre:'Introduction', texte:payload.intro });
  tab(payload.legend).forEach(function(l){
    if(l && l.term) lot.push({ doc:d, titre:'Légende', texte:l.term + ' : ' + (l.def || '') });
  });
  tab(payload.entrees).forEach(function(e){
    if(!e || !e.nom) return;
    var nomsTraits = tab(e.traits).map(function(t){
      return (t && t.nom) || String(t || '');
    }).join(', ');
    lot.push({
      doc:d,
      titre:e.nom,
      texte:[e.nom, e.role, nomsTraits, e.competences, e.armes, e.notes]
            .filter(Boolean).join(' · ')
    });
  });
  return lot;
}

/* Une lecture par document, comme le fait chaque page du dossier mj/.
   Le nœud outils/ entier pèse trop lourd à cause des portraits du bestiaire. */
function construireIndex(){
  if(index) return Promise.resolve(index);
  if(indexEnCours) return indexEnCours;
  if(!dbGrimoire){
    index = [];
    indexBilan = { lus:0, vides:0, erreurs:0, motif:'Firebase n\'a pas pu être chargé.' };
    return Promise.resolve(index);
  }

  indexBilan = { lus:0, vides:0, erreurs:0, motif:'' };
  var avecBase = DOCS.filter(function(d){ return !!d.r; });

  indexEnCours = Promise.all(avecBase.map(function(d){
    return dbGrimoire.ref('outils/' + d.r + '/donnees').once('value')
      .then(function(sn){
        var v = sn.val();
        var payload = (v && v.payload) ? v.payload : v;
        var lot = moissonner(d, payload);
        if(lot.length) indexBilan.lus++; else indexBilan.vides++;
        return lot;
      })
      .catch(function(e){
        indexBilan.erreurs++;
        if(!indexBilan.motif) indexBilan.motif = e && e.message ? e.message : 'lecture refusée';
        return [];
      });
  })).then(function(paquets){
    index = [];
    paquets.forEach(function(l){ index = index.concat(l); });
    indexEnCours = null;
    return index;
  });

  return indexEnCours;
}

function ouvrirRecherche(){
  $('#trouve').classList.add('vu');
  $('#trouve-q').focus();
  $('#trouve-q').select();
  if(!index){
    $('#trouve-corps').innerHTML = '<div class="etat">Lecture des vingt-cinq documents…</div>';
    construireIndex().then(function(){ lancerRecherche(); });
  }
}

function fermerRecherche(){ $('#trouve').classList.remove('vu'); }

function surligner(txt, q){
  var i = txt.toLowerCase().indexOf(q);
  if(i < 0) return txt.slice(0, 160);
  var deb = Math.max(0, i - 60);
  var extrait = (deb > 0 ? '…' : '') + txt.slice(deb, i + q.length + 100);
  var j = extrait.toLowerCase().indexOf(q);
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(extrait.slice(0, j)));
  var m = document.createElement('mark');
  m.textContent = extrait.slice(j, j + q.length);
  d.appendChild(m);
  d.appendChild(document.createTextNode(extrait.slice(j + q.length)));
  return d;
}

function lancerRecherche(){
  var q = $('#trouve-q').value.trim().toLowerCase();
  var corps = $('#trouve-corps');
  if(q.length < 3){
    corps.innerHTML = '<div class="etat">Tape au moins trois lettres.</div>';
    return;
  }
  if(!index){ corps.innerHTML = '<div class="etat">Lecture de la base…</div>'; return; }

  var parDoc = {};
  var total = 0;
  for(var i = 0; i < index.length && total < 200; i++){
    var e = index[i];
    if(e.texte.toLowerCase().indexOf(q) < 0) continue;
    if(!parDoc[e.doc.f]) parDoc[e.doc.f] = { doc:e.doc, lot:[] };
    if(parDoc[e.doc.f].lot.length < 6){ parDoc[e.doc.f].lot.push(e); total++; }
  }

  corps.innerHTML = '';
  var cles = Object.keys(parDoc);
  if(!cles.length){
    corps.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'etat';
    if(indexBilan.erreurs && !indexBilan.lus){
      d.textContent = 'Base injoignable : ' + (indexBilan.motif || 'lecture refusée') +
                      '. La recherche a besoin d\'un accès en lecture à outils/.';
    }else if(!index.length){
      d.textContent = 'Aucun document lu. ' + indexBilan.vides + ' nœuds vides, ' +
                      indexBilan.erreurs + ' en erreur.';
    }else{
      d.textContent = 'Rien trouvé pour ce terme. ' + indexBilan.lus + ' documents indexés, ' +
                      index.length + ' passages parcourus.';
    }
    corps.appendChild(d);
    return;
  }
  cles.forEach(function(f){
    var g = parDoc[f];
    var bloc = document.createElement('div');
    bloc.className = 'res-doc';
    var nom = document.createElement('div');
    nom.className = 'nom';
    nom.innerHTML = '<i style="background:' + couleurFamille(g.doc.g) + '"></i>';
    nom.appendChild(document.createTextNode(g.doc.t));
    bloc.appendChild(nom);
    g.lot.forEach(function(e){
      var b = document.createElement('button');
      b.className = 'res';
      b.type = 'button';
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = e.titre || '—';
      b.appendChild(t);
      var ex = surligner(e.texte, q);
      if(typeof ex === 'string') b.appendChild(document.createTextNode(ex));
      else b.appendChild(ex);
      b.addEventListener('click', function(){
        fermerRecherche();
        if(etat.scenario) montrerScenario(null);
        ouvrirEtFiltrer(cibleCourante(), e.doc.f, $('#trouve-q').value.trim());
      });
      bloc.appendChild(b);
    });
    corps.appendChild(bloc);
  });
}

/* Ouvre un document dans une zone et reporte le terme dans son propre champ
   de filtre, ce qui l'amène directement sur le passage. */
function ouvrirEtFiltrer(i, fichier, q){
  var dejaLa = etat.zones[i] === fichier;
  if(!dejaLa) poserDoc(i, fichier);
  var essais = 0;
  (function poser(){
    if(essais++ > 20) return;
    var z = $('#scene .zone[data-z="' + i + '"]');
    var fr = z ? z.querySelector('iframe') : null;
    var d = null;
    try{ d = fr ? fr.contentDocument : null; }catch(e){}
    var champ = d ? d.getElementById('q') : null;
    // On attend que le document ait fini de se peindre : sections pour les
    // guides, cartes pour le bestiaire.
    if(!champ || !d.querySelector('.sec, .creahead, .cats')){ setTimeout(poser, 250); return; }
    champ.value = q;
    champ.dispatchEvent(new d.defaultView.Event('input', { bubbles:true }));
    // On arrive sur un passage précis : le repli automatique ne doit plus
    // refermer ce document tant qu'il reste affiché.
    d.grimoireLibre = true;
    appliquerRepli(d, false);
  })();
}

/* ---------------- vérification des liens ---------------- */

function verifierLiens(){
  var liste = $('#rapport-liste');
  liste.innerHTML = '<li><b>…</b>Vérification en cours sur ' + DOCS.length + ' documents.</li>';
  $('#rapport').classList.add('vu');

  var faits = [];
  var restants = DOCS.length;

  DOCS.forEach(function(d){
    fetch(d.f, { method:'HEAD', cache:'no-store' })
      .then(function(r){ faits.push({ d:d, ok:r.ok }); })
      .catch(function(){ faits.push({ d:d, ok:false }); })
      .then(function(){
        restants--;
        if(restants === 0) afficherRapport(faits);
      });
  });
}

function afficherRapport(faits){
  faits.sort(function(a, b){
    if(a.ok !== b.ok) return a.ok ? 1 : -1;
    return a.d.t.localeCompare(b.d.t, 'fr');
  });
  var liste = $('#rapport-liste');
  liste.innerHTML = '';
  var manquants = 0;
  faits.forEach(function(x){
    if(!x.ok) manquants++;
    var li = document.createElement('li');
    li.className = x.ok ? 'ok' : 'ko';
    li.innerHTML = '<b>' + (x.ok ? 'trouvé' : 'absent') + '</b>';
    li.appendChild(document.createTextNode(x.d.t + '  ·  ' + x.d.f));
    liste.appendChild(li);
  });
  var res = document.createElement('li');
  res.className = manquants ? 'ko' : 'ok';
  res.innerHTML = '<b>bilan</b>';
  res.appendChild(document.createTextNode(
    manquants ? manquants + ' document(s) à renommer dans la liste DOCS.' : 'Tous les documents répondent.'
  ));
  liste.appendChild(res);
}

/* ---------------- pont avec la table ----------------
   La table ouvre cette fenêtre, elle peut donc lui parler. Un clic sur une
   créature du combat l'affiche ici, dans la zone visée, déjà filtrée. */

function ecouterTable(){
  window.addEventListener('message', function(e){
    if(e.origin !== window.location.origin) return;
    var m = e.data;
    if(!m || m.type !== 'grimoire:voir') return;
    var d = docParFichier(m.fichier);
    if(!d) return;
    if(etat.scenario) montrerScenario(null);
    fermerRecherche();
    var i = cibleCourante();
    ouvrirEtFiltrer(i, d.f, m.terme || '');
    souffler(d.t + (m.terme ? ' · ' + m.terme : '') + ' · envoyé par la table');
    try{ window.focus(); }catch(err){}
  });
  // La table saura que la fenêtre est prête à recevoir.
  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({ type:'grimoire:pret' }, window.location.origin);
    }
  }catch(e){}
}

/* ---------------- démarrage ---------------- */

function demarrer(){
  ecouterTable();
  bâtirRail();
  bâtirZones();
  for(var i = 0; i < 4; i++){
    if(etat.zones[i]) poserDoc(i, etat.zones[i]);
  }
  if(etat.scenario){ var voulu = etat.scenario; etat.scenario = null; montrerScenario(voulu); }
  majScene();
  majHaut();
  souffler('B et E scénarios · 1 à 4 agrandir · M mode · T tranche · F plein écran · Échap revenir');
}

function câbler(){
  $('#b-entrer').addEventListener('click', tenterMdp);
  $('#mdp').addEventListener('keydown', function(e){ if(e.key === 'Enter') tenterMdp(); });
  $('#b-rail').addEventListener('click', basculerRail);
  $('#b-verrou').addEventListener('click', basculerVerrou);
  $('#b-plier').addEventListener('click', basculerRepli);
  $('#b-zmoins').addEventListener('click', function(){ reglerZoom(-1); });
  $('#b-zplus').addEventListener('click', function(){ reglerZoom(1); });
  $('#b-plein').addEventListener('click', basculerPlein);
  $('#b-liens').addEventListener('click', verifierLiens);
  $('#b-trouve').addEventListener('click', ouvrirRecherche);
  $('#trouve-fermer').addEventListener('click', fermerRecherche);
  $('#trouve-relire').addEventListener('click', function(){
    index = null; indexEnCours = null;
    $('#trouve-corps').innerHTML = '<div class="etat">Lecture des vingt-cinq documents…</div>';
    construireIndex().then(function(){ lancerRecherche(); });
  });
  $('#trouve-q').addEventListener('input', lancerRecherche);
  $('#trouve-q').addEventListener('keydown', function(e){ if(e.key === 'Escape') fermerRecherche(); });
  $('#b-rapport-fermer').addEventListener('click', function(){ $('#rapport').classList.remove('vu'); });
  $('#filtre').addEventListener('input', filtrerRail);
  $$('#scenarios-bt button').forEach(function(b){
    b.addEventListener('click', function(){ montrerScenario(b.dataset.scn); });
  });
  $$('#modes button').forEach(function(b){
    b.addEventListener('click', function(){ basculerMode(b.dataset.mode); });
  });
  document.addEventListener('keydown', clavier, true);
}

lireEtat();
câbler();

var dejaOuvert = false;
try{ dejaOuvert = sessionStorage.getItem(CLE_SES) === '1'; }catch(e){}
if(dejaOuvert){ ouvrirPorte(); }
else{ setTimeout(function(){ $('#mdp').focus(); }, 60); }
</script>
