<!DOCTYPE html>

<head>

<title>Le Métier d'Apothicaire</title>
<style>
  :root{
    --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#37302a;
    --txt:#e8e0d2; --dim:#a2968a; --acc:#4f8f7a; --acc2:#c9a227; --off:#8d8375;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Iowan Old Style",Georgia,serif;font-size:15px;line-height:1.45}

  .bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1b1815,#161311);
       border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;gap:.6rem;
       align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;margin:0 .5rem 0 0;
          font-weight:600;white-space:nowrap}
  .bar h1 span{color:var(--acc)}
  input[type=search]{flex:1;min-width:160px;background:#0e0c0b;border:1px solid var(--line);
       color:var(--txt);padding:.42rem .6rem;border-radius:4px;font-family:inherit;font-size:.9rem}
  input[type=search]:focus{outline:none;border-color:var(--acc2)}
  button{background:#2a2521;border:1px solid var(--line);color:var(--txt);padding:.4rem .7rem;
       border-radius:4px;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}
  button:hover{border-color:var(--acc2);color:#fff}
  button.pri{background:#3a1512;border-color:#5d201a}
  .status{font-size:.78rem;color:var(--dim);min-width:78px}

  .wrap{max-width:1240px;margin:0 auto;padding:1rem .9rem 4rem}
  .intro{font-size:.85rem;color:var(--dim);background:var(--panel);border-left:2px solid var(--acc);
       padding:.6rem .8rem;border-radius:0 4px 4px 0;margin:0 0 1.2rem}
  .intro:focus{outline:none;background:#0e0c0b}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:5px;margin:0 0 .8rem;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--panel2);
       border-bottom:1px solid var(--line)}
  .sechead .t{font-size:.87rem;letter-spacing:.09em;text-transform:uppercase;color:var(--acc2);flex:1}
  .sechead .n{font-size:.74rem;color:var(--dim)}
  .sechead button{padding:.22rem .5rem;font-size:.75rem}
  .snote,.sfoot{font-size:.8rem;color:var(--dim);padding:.5rem .7rem 0}
  .sfoot{margin:.5rem .7rem .2rem;padding:.45rem .7rem;font-style:italic;
         border-left:2px solid var(--acc2);background:rgba(184,146,42,.05);border-radius:0 3px 3px 0}
  .sfoot:empty{display:none}
  .sfoot::before{content:'À retenir';display:block;font-family:'Cinzel',serif;font-style:normal;
         font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);margin-bottom:.2rem}
  .secbody{padding:.2rem .5rem .6rem}
  .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:none}

  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th{position:sticky;top:44px;background:#0f0d0c;color:var(--dim);font-weight:400;text-align:left;
     font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .45rem;
     border-bottom:1px solid var(--line);z-index:5}
  td{border-bottom:1px solid #262019;padding:.32rem .45rem;vertical-align:top}
  tr:hover td{background:#1f1b17}
  tr.off td{color:var(--off);font-style:italic}
  td[contenteditable]:focus,th[contenteditable]:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .acts{width:1%;white-space:nowrap;opacity:0;transition:opacity .12s}
  tr:hover .acts{opacity:1}
  .acts button{padding:.1rem .34rem;font-size:.72rem;background:transparent;border-color:transparent;color:var(--dim)}
  .acts button:hover{color:#fff;border-color:var(--line)}
  .addrow{margin:.35rem 0 0;font-size:.78rem}

  .items{margin:0;padding:.2rem .3rem}
  .item{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .3rem;border-bottom:1px solid #262019}
  .item:hover{background:#1f1b17}
  .item .puce{color:var(--acc);flex:0 0 auto;line-height:1.5}
  .item .txt{flex:1;font-size:.87rem}
  .item .txt:focus{outline:none;background:#0e0c0b;box-shadow:inset 0 0 0 1px var(--acc2);border-radius:3px}
  .item .acts{opacity:0}
  .item:hover .acts{opacity:1}

  .legwrap{columns:2;column-gap:1.4rem}
  .leg{break-inside:avoid;margin:0 0 .45rem;padding:.35rem .5rem;background:var(--panel);
       border-left:2px solid var(--line);border-radius:0 3px 3px 0;font-size:.83rem}
  .leg.mai{border-left-color:var(--acc)}
  .leg .term{font-weight:700;color:var(--acc2)}
  .leg.of .term{color:#bdb2a2}
  .leg .term:focus,.leg .df:focus{outline:none;background:#0e0c0b}
  .leg .acts2{float:right;opacity:0}
  .leg:hover .acts2{opacity:1}
  .leg .acts2 button{padding:.05rem .3rem;font-size:.7rem;background:transparent;border-color:transparent;color:var(--dim)}
  h2.bloc{font-size:.98rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
       border-bottom:1px solid var(--acc);padding-bottom:.3rem;margin:1.8rem 0 .6rem}

  #tip{position:fixed;z-index:60;max-width:340px;background:#0d0b0a;border:1px solid var(--acc2);
       border-radius:4px;padding:.5rem .6rem;font-size:.8rem;display:none;box-shadow:0 6px 24px #000a}
  #tip b{color:var(--acc2)}
  #tip p{margin:0 0 .35rem} #tip p:last-child{margin:0}


  .sync-flag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;
       border-radius:2px;white-space:nowrap;border:1px solid transparent;color:var(--dim)}
  .sync-flag.ok{color:#8fae7e;border-color:rgba(94,128,79,.4);background:rgba(94,128,79,.12)}
  .sync-flag.pending{color:#e8cf72;border-color:rgba(184,146,42,.4);background:rgba(184,146,42,.12)}
  .sync-flag.err{color:#e08a80;border-color:rgba(139,26,26,.5);background:rgba(139,26,26,.16)}

  /* ---------- téléphone : plus de défilement horizontal ---------- */
  @media(max-width:760px){
    body{font-size:14px}
    .bar{padding:.5rem .6rem;gap:.4rem}
    .bar h1{font-size:.9rem;width:100%;margin:0}
    button{padding:.34rem .55rem;font-size:.78rem}
    .wrap{padding:.7rem .5rem 3rem}
    .secbody{padding:.2rem .3rem .5rem}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--line);border-radius:4px;background:#1d1915;
       margin:0 0 .5rem;padding:.35rem .5rem}
    tr:hover td{background:transparent}
    td{border-bottom:none;padding:.22rem 0;text-align:left !important;white-space:normal}
    td:empty{padding:0}
    td::before{content:attr(data-lab);display:inline-block;min-width:5.4rem;
       font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
       vertical-align:top;padding-right:.4rem}
    td.acts{opacity:1;width:auto;text-align:right !important;padding-top:.3rem;
       border-top:1px solid #2a241e;margin-top:.25rem}
    td.acts::before{content:none}
    .acts button{font-size:.85rem;padding:.18rem .5rem}
    .legwrap{columns:1}
    .item .acts{opacity:1}
  }
  .retour{color:var(--dim);text-decoration:none;font-size:.8rem;white-space:nowrap;padding:.2rem .3rem}
  .retour:hover{color:var(--acc2)}
  .hid{display:none !important}
  .hint{font-size:.78rem;color:var(--dim);margin:.8rem 0 0}

  @media print{
    body{background:#fff;color:#14110f;font-size:9pt}
    .bar,.acts,.acts2,.addrow,.sechead button,.hint,#tip,.retour{display:none !important}
    .wrap{max-width:none;padding:0}
    .sec{border:none;background:none;margin:0 0 3mm}
    .sechead{background:none;border-bottom:1px solid var(--acc);padding:0 0 1mm}
    .sechead .t{color:#8B1A1A}
    h2.bloc{color:#8B1A1A;border-color:#8B1A1A}
    .intro,.snote,.leg{background:#faf7f1;color:#5a524a}
    .sfoot{background:#faf7f1;color:#5a524a;border-left:2px solid #8B1A1A}
    .sfoot::before{color:#8B1A1A}
    th{position:static;background:#2a1414;color:#f0e8d8;border:none}
    td{border-bottom:1px solid #ddd6ca}
    tr.off td{color:#5a524a}
    .item{border-bottom:none;padding:.5mm 0}
    .sec.closed .secbody,.sec.closed .snote,.sec.closed .sfoot{display:block}
  }
</style>

<script>
var DEFAUT = {"sections": [{"kind": "texte", "title": "Comment lire ce guide, en six points", "note": "À lire avant le reste. Ces six points suffisent à jouer le métier. Tout ce qui suit ne fait que les détailler.", "items": ["Deux chiffres à vérifier. La matière porte une Maîtrise, dans le Catalogue des Matières. L'objet porte une complexité, dans les tables de ce guide. Ma propre Maîtrise doit couvrir les deux.", "Ma Maîtrise est le niveau que j'ai atteint dans ce métier. Elle se lit sur le score de ma compétence Métier : moins de 40 donne la Maîtrise 1, de 40 à 49 la Maîtrise 2, de 50 à 59 la Maîtrise 3, 60 et plus la Maîtrise 4. Sans avoir suivi une carrière qui contient ce Métier, elle plafonne à 2.", "Le travail ordinaire se fait sans jet. Avoir la compétence Métier suffit à faire son travail de tous les jours, avec ses outils et ses matières. On lance les dés dans trois cas : je veux aller vite, les conditions sont mauvaises, ou je vise une pièce de qualité.", "Comment on jette. Test étendu de Métier (Apothicaire), un jet par période de travail. La complexité donne le DR à atteindre et la durée d'une période. Complexité 1 : DR 2, une heure. Complexité 2 : DR 4, quatre heures. Complexité 3 : DR 6, un jour. Complexité 4 : DR 8, trois jours. Complexité 5 : DR 12, une semaine. Le talent Travailleur qualifié retire son niveau au DR à atteindre.", "Récolter soi-même. Un test de la compétence indiquée par la matière, une demi-journée, une zone qui ne rend plus rien avant une saison. Une réussite donne une dose, chaque +2 DR une de plus. Le nombre maximum de doses dépend de la disponibilité : Commune 6, Limitée 4, Rare 2, Exotique 1. Hors saison, -20 au test. Si ma Maîtrise est inférieure à celle de la matière, une récolte sur trois est la mauvaise plante, et je le découvre à l'emploi.", "Ce que coûtent les matières. La moitié du prix de vente de l'objet fini. Une réparation coûte le quart. Les matières sont perdues si j'abandonne le travail. Leur prix, leur disponibilité et leur Maîtrise sont dans le Catalogue des Matières."], "foot": ""}, {"kind": "texte", "title": "Le test étendu, la mécanique", "note": "Le mécanisme du test étendu vient du livre de base. Le nombre de DR par complexité, la durée d'un jet et la qualité gagnée au dépassement sont maison.", "items": ["Un test ordinaire se joue en un jet. Un test étendu se joue en plusieurs jets d'affilée, jusqu'à ce qu'on ait accumulé assez de degrés de réussite.", "Le MJ annonce deux chiffres avant qu'on commence. Le nombre total de DR à atteindre, donné par la complexité de l'objet. Et la durée que représente un seul jet, donnée par cette même complexité.", "Le DR d'un jet se calcule toujours de la même façon. On prend le chiffre des dizaines de la compétence, on lui retire le chiffre des dizaines du jet. Avec une compétence à 48, un jet de 31 donne 4 moins 3, soit +1 DR.", "Un jet raté donne un DR négatif, puisque le jet dépasse la compétence. Toujours avec 48, un jet de 51 donne 4 moins 5, soit -1 DR. Ce chiffre négatif se retranche du total. Une mauvaise journée défait le travail de la veille.", "On additionne les DR d'un jet au suivant. Le travail est fini à l'instant où le total atteint le seuil annoncé.", "Ce dernier jet décide de la qualité de la pièce, d'après ce qui dépasse le seuil. De 0 à 3 DR au-dessus, elle est Normale. De 4 à 7, elle est Bonne. À 8 et plus, c'est un Chef d'œuvre.", "Rien ne limite le nombre de jets. Ce qui limite, c'est le temps, les matières déjà payées et l'échéance du client.", "Une Maladresse, c'est-à-dire un double raté comme 66 ou 77, n'arrête pas le travail. Elle déclenche un incident, coûte un cran de qualité finale et retire 2 au jet de solidité de la pièce."], "foot": ""}, {"kind": "table", "title": "Exemple chiffré : préparer une potion de guérison", "note": "L'apothicaire a Métier (Apothicaire) à 52, donc 5 en chiffre des dizaines. La potion est de complexité 3 : il faut 6 DR au total, et un jet représente une journée en atelier.", "cols": ["Tentative", "Jet", "Calcul du DR", "DR", "Total", "Ce qui se passe"], "rows": [{"c": ["Jour 1", "43", "5 − 4", "+1", "1", "Les simples sont broyés"], "off": false}, {"c": ["Jour 2", "68", "5 − 6", "−1", "0", "Raté. La macération a tourné"], "off": false}, {"c": ["Jour 3", "77", "5 − 7", "−2", "−2", "Double raté, donc Maladresse. Incident, et un cran de qualité perdu d'avance"], "off": false}, {"c": ["Jour 4", "02", "5 − 0", "+5", "3", "Excellente journée"], "off": false}, {"c": ["Jour 5", "19", "5 − 1", "+4", "7", "Le seuil de 6 est franchi"], "off": false}], "foot": "Total 7 pour un seuil de 6 : dépassement de 1, ce qui donnerait Normale. La Maladresse du jour 3 fait descendre d'un cran : la potion est Médiocre, après cinq jours de travail. À noter, Pharmacologie inverse un jet raté, mais 77 inversé donne encore 77 : le talent ne sauve jamais d'un double. Sur un 71 raté, il aurait donné 17, soit +4 DR."}, {"kind": "texte", "title": "Un exemple suivi, de la matière à la potion", "note": "", "items": ["Le personnage. Apothicaire, Métier (Apothicaire) à 52, donc Maîtrise 3.", "L'objectif. Une potion de guérison, complexité 3.", "Vérification 1, la matière. Les simples nécessaires sont Maîtrise 2 au plus. Maîtrise 3, c'est bon.", "Vérification 2, l'objet. Complexité 3 demande la Maîtrise 2. C'est bon.", "Le travail. Test étendu de Métier (Apothicaire), DR 6 à atteindre, un jour par tentative, dans un atelier.", "Le filet de sécurité. Le talent Pharmacologie permet d'inverser un jet raté si le résultat inversé réussit. Un 71 manqué devient un 17.", "Sans atelier. Le talent Concocter donne une Activité Artisanat gratuite employant Métier (Apothicaire) sans avoir besoin d'atelier.", "Ce qui bloque plus haut. Un distillat de complexité 4 demande la Maîtrise 4, même si toutes les matières sont en stock."], "foot": ""}, {"kind": "texte", "title": "Ce que le métier est réellement", "note": "", "items": ["L'apothicaire travaille la matière. Il achète, sèche, broie, distille et vend. Il laisse la magie aux sorciers et le titre de médecin aux Doktors. Sa boutique est un commerce réglementé, son registre est consultable, et sa réputation se joue moins sur ses réussites que sur ses morts. Trois tensions permanentes, qui sont autant de moteurs de jeu :", "La licence et le registre. Vendre des remèdes est libre, vendre du poison exige de tenir un registre nominatif. Un apothicaire dont le registre ne correspond pas à ses stocks a beaucoup à expliquer, et c'est exactement le genre de dossier qu'un répurgateur ouvre en premier.", "La concurrence. Le barbier-chirurgien coupe, le prêtre de Shallya prie, la sorcière de village guérit sans papiers. Chacun mord sur la clientèle de l'apothicaire, qui les méprise tous et les fréquente quand même.", "La frontière. Le même savoir prépare un fébrifuge et un poison indétectable, et personne n'en est dupe. Un apothicaire compétent est toujours un suspect crédible.", "Compétences employées dans tout ce document : Métier (Apothicaire) pour préparer, Savoir approprié (sciences, plantes, poisons selon ta traduction) pour identifier et concevoir, Guérison pour administrer au chevet d'un patient, Marchandage pour acheter les matières et vendre le produit, Outils de profession comme matériel obligatoire. Sans outils, tout test subit au minimum −20, et aucune distillation n'est possible."], "foot": ""}, {"kind": "texte", "title": "Les cinq choses qu'un apothicaire fait à la table", "note": "", "items": ["Préparer. Test étendu de Métier (Apothicaire), un jet par période de travail, jusqu'au nombre de DR requis par la complexité. Matières premières : la moitié du prix de vente, perdues en cas d'abandon.", "Identifier. Un jet unique de Savoir approprié pour reconnaître une substance, un symptôme ou une cause de mort. C'est la compétence qui fait de lui un enquêteur, et souvent son utilité principale en scène.", "Doser. Modifier une préparation existante par un procédé (concentrer, édulcorer, diluer, stabiliser). Un DR de moins que la fabrication, et chaque procédé apporte sa contrepartie.", "Administrer. Au chevet d'un blessé, un test de Guérison appuyé par la bonne préparation. L'apothicaire ne remplace pas le médecin, il rend son travail possible.", "Improviser. Bricoler un remède ou un poison en pleine scène, avec ce qu'on trouve. Un seul jet, −20, et le produit obtenu est Périssable et Instable."], "foot": ""}, {"kind": "table", "title": "Complexité : le seul curseur à retenir", "note": "", "cols": ["Complexité", "DR requis", "Par tentative", "Matières", "Exemples"], "rows": [{"c": ["1 · Simple", "2", "1 heure", "Commune", "Cataplasme, infusion, mousse de tourbière, sels de réveil, tonique digestif"], "off": false}, {"c": ["2 · Soignée", "4", "4 heures", "Commune", "Onguent, potion de guérison, valériane préparée, mort-aux-rats"], "off": false}, {"c": ["3 · Précise", "6", "1 jour", "Limitée", "Potion de vitalité, élixir de constitution, venin sur lame, poudre du sommeil"], "off": false}, {"c": ["4 · Complexe", "8", "3 jours", "Rare", "Philtre de veine froide, baume d'argent, onction, curare, larmes de la sorcière"], "off": false}, {"c": ["5 · Exceptionnelle", "12", "1 semaine", "Exotique", "Brise-cœur, élixir du bourreau, distillat de pierre à sorcière, remède inédit"], "off": false}], "foot": "Chaque objet du document Drogues, Poisons, Herbes et Potions porte sa complexité dans la colonne Compl. C'est le seul chiffre à lire pour savoir si un personnage peut le fabriquer, en combien de temps, et à quel DR. Les mentions Récolte et Temple y désignent ce qui ne se fabrique pas."}, {"kind": "table", "title": "Les quatre niveaux de Maîtrise de l'apothicaire", "note": "La Maîtrise se lit sur le score de la compétence Métier concernée, et sur rien d'autre. Un personnage a donc une Maîtrise par métier : il peut être Maîtrise 3 dans l'un et Maîtrise 1 dans l'autre. Le titre d'usage vient de la carrière suivie, avec son Statut officiel.", "cols": ["Maîtrise", "Score de Métier", "Travaux reconnus", "Autorisations et limites", "Titre d'usage"], "rows": [{"c": ["1", "Moins de 40", "Séchage, broyage, complexité 1 et 2, tenue du registre, préparation des commandes du maître", "Travaille sous responsabilité. Ne peut ni signer une ordonnance ni acheter de substances Rares", "Apprenti Apothicaire · Bronze 3"], "off": false}, {"c": ["2", "De 40 à 49", "Complexité 3, distillation simple, procédés de dosage, vente au public", "Licence personnelle, boutique, achat réglementé de toxiques avec registre nominatif", "Apothicaire · Argent 1"], "off": false}, {"c": ["3", "De 50 à 59", "Complexité 4, onctions, préparations paranaturelles, formation d'apprentis, expertise judiciaire", "Peut témoigner devant un tribunal sur une cause de mort, et faire homologuer une recette", "Maître Apothicaire · Argent 3"], "off": false}, {"c": ["4", "60 et plus", "Complexité 5, recherche de recettes inédites, essais sur substances interdites", "Accès aux bibliothèques scientifiques, surveillance par les autorités, responsabilité pénale", "Apothicaire de Renom · Or 1"], "off": false}], "foot": "Sans avoir suivi une carrière qui contient cette compétence Métier, la Maîtrise plafonne à 2, quel que soit le score. L'apprentissage compte autant que l'adresse."}, {"kind": "texte", "title": "Les talents officiels qui pèsent sur ces tables", "note": "Rappel des règles du livre de base, non modifiées. Tout le reste de ce document est maison.", "items": ["Métier suffit, le plus souvent. Le livre de base est explicite : posséder la compétence Métier permet d'accomplir automatiquement les tâches de sa profession, dès lors qu'on dispose des outils et des ressources. Le test n'est exigé que si l'on travaille vite, si les conditions sont défavorables, ou si l'on vise une pièce de grande qualité. Les tables de complexité de ce guide valent pour ces cas-là, pas pour le travail ordinaire d'une journée.", "Travailleur qualifié (Apothicaire). Talent officiel. Retire son niveau au DR exigé par tout test étendu de la compétence Métier concernée. Un apothicaire de niveau 2 dans ce talent ramène une complexité 4, qui exige 8 DR, à 6 DR. C'est le levier officiel le plus puissant sur les tables de ce guide, et il s'applique avant tout autre modificateur.", "Pharmacologie. Talent officiel. Permet d'inverser n'importe quel test de Métier (Apothicaire) raté, dès lors que le résultat inversé donne une réussite : un 71 manqué devient un 17. C'est la deuxième chance du métier, et elle ne coûte ni temps ni matière.", "Concocter. Talent officiel. Accorde une Activité Artisanat gratuite employant Métier (Apothicaire) sans avoir besoin d'un atelier. Le talent lui-même se teste sur Savoir (Apothicaire).", "Maître artisan (Métier). Talent officiel. Ajoute la compétence Métier correspondante à toute carrière entamée, ou la rend moins chère de 5 PX par Augmentation si elle y figure déjà. Il agit sur la progression du personnage, jamais sur un test.", "Où on les gagne. La carrière Apothicaire donne Concocter et Maître artisan (Apothicaire) dès le premier niveau, Pharmacologie au deuxième, Travailleur qualifié (Apothicaire) au troisième, Savant (Apothicaire) et Travailleur qualifié (Empoisonneur) au quatrième."], "foot": ""}, {"kind": "table", "title": "Matières premières", "note": "Ce qu'on achète chez un confrère, ce qu'on cueille, ce qu'on prélève. Prix pour une quantité suffisant à trois préparations de complexité égale ou inférieure à 3.", "cols": ["Matière", "Coût", "Disponibilité", "Provenance", "Sert à"], "rows": [{"c": ["Esprit-de-vin", "8 Pa", "Commune", "Distillerie, taverne complaisante", "Base de toute teinture, antiseptique, conservation"], "off": false}, {"c": ["Cire et miel", "4 Pa", "Commune", "Rucher, marché", "Onguents, enrobage des pilules, cataplasmes"], "off": false}, {"c": ["Graisse animale clarifiée", "3 Pa", "Commune", "Boucher, tanneur", "Baumes, supports d'onction"], "off": false}, {"c": ["Alun et sel gemme", "5 Pa", "Commune", "Mine, épicier", "Coagulants, conservation, sels de Morr"], "off": false}, {"c": ["Cendre d'os calcinée", "6 Pa", "Limitée", "Ossuaire, fossoyeur", "Absorbants, poudres, préparations liées à Morr"], "off": false}, {"c": ["Moisissure de cave", "10 Pa", "Limitée", "Cave humide, cryptes", "Cataplasmes contre l'infection"], "off": false}, {"c": ["Soufre et salpêtre", "15 Pa", "Limitée", "Droguiste, guilde des ingénieurs", "Fumigations, corrosifs, incendiaires"], "off": false}, {"c": ["Vif-argent", "2 CO", "Rare", "Alchimiste, orfèvre", "Distillats, révélateurs, poisons lents"], "off": false}, {"c": ["Poudre d'argent", "4 CO", "Rare", "Orfèvre, fondeur", "Baume d'argent, onctions paranaturelles"], "off": false}, {"c": ["Venin frais", "1 CO", "Rare", "Prélevé sur la bête, dans l'heure", "Poisons de lame et de munition"], "off": false}, {"c": ["Fiel et bile", "12 Pa", "Limitée", "Boucher, chasseur", "Poisons faibles, purgatifs"], "off": false}, {"c": ["Racines et écorces séchées", "10 Pa", "Commune", "Herboriste, cueillette", "Infusions, décoctions, drogues mâchées"], "off": false}, {"c": ["Simples rares (fleur de lune, faxtoryll)", "3 CO", "Rare", "Herboriste de ville, colporteur", "Remèdes de complexité 4"], "off": false}, {"c": ["Éclat de pierre à sorcière", "6 CO", "Exotique", "Cercle ancien, receleur", "Distillat de pierre à sorcière"], "off": false}, {"c": ["Eau consacrée", "1 CO", "Limitée", "Temple, contre service rendu", "Onctions, aspersions, sels de Morr"], "off": false}], "foot": "Cueillette : un test de Survie en extérieur ou du Savoir approprié dans le terrain adéquat fournit une portion de matière Commune ou Limitée par DR obtenu. Le reste s'achète. Le venin frais se prélève sur une créature morte depuis moins d'une heure, avec un test de Métier : un échec, et l'apothicaire se pique lui-même."}, {"kind": "table", "title": "Procédés et formes", "note": "Le cœur du métier en jeu : la même recette donne des objets différents selon la façon de la préparer. Chaque procédé s'applique à une préparation existante, coûte un DR de moins que sa fabrication, et impose sa contrepartie. Deux procédés au maximum par préparation.", "cols": ["Procédé", "Éch.", "Surcoût", "DR", "Effet et contrepartie"], "rows": [{"c": ["Infusion", "1", "–", "2", "Forme la plus simple. Agit en un round, mais ne se conserve qu'une journée : Périssable"], "off": false}, {"c": ["Décoction", "1", "2 Pa", "2", "Deux doses au lieu d'une. Goût prononcé : Détectable +20"], "off": false}, {"c": ["Teinture", "2", "×2", "4", "Se conserve un an : Stabilisée. Le support alcoolisé rend la substance décelable à l'odeur"], "off": false}, {"c": ["Onguent", "2", "×1,5", "4", "Administration par Contact au lieu d'ingestion. Agit en 1d10 rounds au lieu d'un"], "off": false}, {"c": ["Pilule enrobée", "3", "×2", "6", "Effet retardé de 1d10 minutes, au choix du préparateur. Indétectable au goût"], "off": false}, {"c": ["Concentré", "3", "×3", "6", "Effet augmenté d'un cran (un état de plus, ou +10 devient +20). Dose unique et Instable"], "off": false}, {"c": ["Dilué", "2", "–", "4", "Trois doses au lieu d'une. Effet réduit d'un cran"], "off": false}, {"c": ["Édulcoré", "3", "×2", "6", "Devient Indétectable dans un plat ou une boisson. Perd un cran d'effet"], "off": false}, {"c": ["Fumigation", "3", "×2", "6", "Affecte une pièce entière au lieu d'une personne, en dix minutes. Frappe aussi le préparateur"], "off": false}, {"c": ["Huile de lame", "3", "×2", "6", "Administration par Lame. Trois touches, ou 1d10 heures, puis l'effet se perd"], "off": false}, {"c": ["Stabilisation", "4", "×2", "8", "Retire Périssable définitivement. Le procédé lui-même prend une journée de plus"], "off": false}, {"c": ["Sublimation", "4", "×4", "8", "Réduit la préparation en poudre inhalable, agissant en un round. Vapeurs dangereuses au travail : test d'Endurance"], "off": false}], "foot": ""}, {"kind": "table", "title": "Identifier, expertiser, disculper", "note": "", "cols": ["Situation", "Difficulté", "Temps", "Résultat"], "rows": [{"c": ["Reconnaître une plante ou une matière courante", "+20", "Un instant", "Nom, usage, ordre de prix"], "off": false}, {"c": ["Identifier une préparation inconnue à l'odeur et au goût", "+0", "1 minute", "Nature et effet approximatif. Goûter un poison reste risqué"], "off": false}, {"c": ["Détecter une substance dans un plat ou une boisson", "Selon Détectable", "1 minute", "Présence, puis nature à 2 DR"], "off": false}, {"c": ["Déterminer la cause d'une mort par empoisonnement", "−10", "1 heure", "Substance employée, délai approximatif, voie d'administration"], "off": false}, {"c": ["Identifier une préparation paranaturelle ou corrompue", "−20", "1 heure", "Nature de la corruption. Un DR de plus indique qui sait la produire dans la région"], "off": false}, {"c": ["Reconstituer une recette à partir du produit fini", "−30", "1 jour", "Liste des matières, et la possibilité de la refaire"], "off": false}], "foot": "C'est la moitié de l'intérêt du personnage à la table. Un apothicaire dans le groupe transforme un cadavre en témoin et une fiole en pièce à conviction, ce qui vaut mieux qu'un bonus de dégâts."}, {"kind": "table", "title": "Quand ça tourne mal", "note": "Sur une Maladresse à un test de Métier (Apothicaire) pendant une préparation, jeter 1d10. Les matières premières sont perdues dans tous les cas.", "cols": ["1d10", "Incident"], "rows": [{"c": ["1", "Préparation fade. Sans effet, mais rien de perdu d'autre que le temps et les matières"], "off": false}, {"c": ["2", "Mélange gâté. La préparation semble réussie et n'agira pas. Seul un test d'identification le révèle"], "off": false}, {"c": ["3", "Dosage faux. L'effet est réduit d'un cran, sans que le préparateur le sache"], "off": false}, {"c": ["4", "Vapeurs. Test d'Endurance ou état Nauséeux jusqu'à la fin de la journée"], "off": false}, {"c": ["5", "Brûlure caustique. 1d10 dégâts à la main ou au bras, armure inapplicable"], "off": false}, {"c": ["6", "Verrerie brisée. Les Outils de profession sont endommagés : −10 aux tests jusqu'à remplacement, un jour de travail et 1 CO"], "off": false}, {"c": ["7", "Contamination. Toutes les autres préparations en cours dans l'atelier deviennent Périssables sous vingt-quatre heures"], "off": false}, {"c": ["8", "Effet inversé. La préparation produit exactement le contraire de ce qui était voulu : un remède devient un poison faible, un poison devient un tonique"], "off": false}, {"c": ["9", "Explosion de l'alambic. Dégâts 8, Explosion 1, centrée sur le préparateur. Incendie possible"], "off": false}, {"c": ["10", "Réaction imprévue. Comme ci-dessus, plus un nuage toxique : Explosion 3, état Empoisonné pour tous ceux qui restent dans la pièce un round de plus"], "off": false}], "foot": "Un apothicaire travaillant dans son propre laboratoire, avec des matières qu'il a lui-même vérifiées, soustrait 2 au résultat, minimum 1. C'est la récompense concrète du métier : les autres subissent la table, lui la corrige."}, {"kind": "texte", "title": "Boutique, registre et clientèle", "note": "", "items": ["Prix de vente. Une préparation se vend au prix indiqué dans le catalogue. À un client pressé ou désespéré, le double. À un confrère ou à un temple, la moitié, et il en profitera.", "Registre des toxiques. Tout achat et toute vente de substance toxique se consigne avec le nom de l'acheteur. Un registre à jour protège son auteur, un registre trafiqué le condamne, un registre absent le rend coupable par défaut.", "Revenus d'une boutique. Une officine tenue une semaine complète rapporte l'équivalent d'un test de Métier réussi en Statut, ou 1 CO par DR obtenu. C'est peu, régulier, et ça oblige le personnage à rester en ville.", "Marché noir. Vendre sans licence rapporte le double et laisse un témoin. Chaque transaction illégale ajoute une chance sur dix qu'un contrôle survienne dans le mois.", "Réputation. Un client mort par la faute du personnage coûte un cran de Statut et un procès. Un notable sauvé en rapporte un, et une dette bien plus utile.", "Conservation. Une préparation Périssable perd tout effet en un mois, une semaine par forte chaleur. Une préparation Stabilisée tient un an. Un stock mal étiqueté est une catastrophe qui attend son heure."], "foot": ""}, {"kind": "texte", "title": "Notes de MJ", "note": "", "items": ["L'apothicaire brille hors combat. Il identifie, il disculpe, il prépare l'expédition. Donne-lui au moins une occasion d'expertise par arc et le joueur n'aura jamais l'impression d'avoir choisi un métier décoratif.", "Le temps reste la limite, pas l'argent. Trois jours de laboratoire, c'est trois jours où l'intrigue avance sans lui.", "Deux procédés maximum, sinon un poison finit concentré, édulcoré, enrobé et stabilisé, et plus aucun assassinat n'est jouable dans ta campagne.", "Le registre est un levier narratif aussi puissant que la patente de l'ingénieur. Un répurgateur qui demande à le voir crée une scène entière sans un seul jet de dés.", "Pour une sorcière de village plutôt qu'un apothicaire diplômé, remplace la licence par la tolérance du voisinage et les matières Rares par des ingrédients que la décence réprouve. Même moteur, autre couleur, et une menace de bûcher en fond."], "foot": ""}, {"kind": "texte", "title": "Résumé pour le joueur, en cinq lignes", "note": "", "items": ["Ta compétence clé est Métier (Apothicaire), tes outils sont obligatoires, et tout ce que tu prépares se résout par un test étendu dont le nombre de DR dépend de la complexité, de 2 pour une infusion à 12 pour un poison indétectable. Tu peux tenter n'importe quoi, même au-dessus de ta Maîtrise, avec −20 et sans fournisseur. Tu paies la moitié du prix en matières, tu perds tout sur une Maladresse. Les procédés sont ta vraie signature : la même recette devient onguent, pilule retardée, huile de lame ou fumigation selon la façon dont tu la travailles. Et ton pouvoir le plus utile est d'identifier ce que les autres ont fabriqué."], "foot": ""}], "legend": [{"off": true, "term": "Échelon", "def": "Le niveau atteint dans une carrière, de 1 à 4, avec son Statut. Il donne un titre et des compétences à prix normal. Le mot ne désigne rien d'autre."}, {"off": false, "term": "Instable", "def": "Perd tout effet en vingt-quatre heures, et une chance sur dix d'être déjà inerte au moment de l'emploi."}, {"off": false, "term": "Périssable", "def": "Sans effet un mois après la préparation, une semaine par forte chaleur."}, {"off": false, "term": "Stabilisée", "def": "Se conserve un an sans perte d'effet."}, {"off": false, "term": "Concentré", "def": "Effet augmenté d'un cran : un état supplémentaire, ou un bonus qui passe de +10 à +20."}, {"off": false, "term": "Dilué", "def": "Effet réduit d'un cran, nombre de doses multiplié."}, {"off": false, "term": "Édulcoré", "def": "Ni goût ni odeur décelables dans un aliment ou une boisson."}, {"off": false, "term": "Détectable X", "def": "Modificateur au test pour repérer la substance avant absorption."}, {"off": false, "term": "Indétectable", "def": "Aucun test ne permet de la repérer avant absorption."}, {"off": false, "term": "Dose", "def": "Quantité nécessaire à un usage. Une fiole entamée est une fiole perdue."}, {"off": false, "term": "Nauséeux", "def": "−10 à tous les tests jusqu'à la fin de la journée, cumulable une seule fois."}], "intro": "Document presque entièrement maison. Le catalogue des substances est dans Drogues, Poisons, Herbes et Potions. Monnaie : CO couronne d'or, Pa pistole d'argent, Sc sou de cuivre. 1 CO = 20 Pa, 1 Pa = 12 Sc."};
var RACINE = 'outils/apothicaire';
var CACHE  = 'apothicaire_cache_v1';
var CLIENT = Math.random().toString(36).slice(2, 10);
var data = null;

var FB_CONFIG = {
  apiKey: "AIzaSyAA-5S_PcynTh59da7s8fIZjBLDYQuq6-c",
  authDomain: "warhammer-table-jdr.firebaseapp.com",
  databaseURL: "https://warhammer-table-jdr-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "warhammer-table-jdr",
  storageBucket: "warhammer-table-jdr.firebasestorage.app",
  messagingSenderId: "347804803970",
  appId: "1:347804803970:web:43e062299c53e59d20e59b"
};

var db = null, refData = null, refSave = null;
try{
  if(typeof firebase !== 'undefined'){
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    db = firebase.database();
    refData = db.ref(RACINE + '/donnees');
    refSave = db.ref(RACINE + '/sauvegardes');
  }
}catch(e){ console.warn('Firebase indisponible :', e); }

/* ---------- indicateur d'état ---------- */
var flag = document.getElementById('flag');
var flagTimer = null;
function etat(txt, cls){
  if(!flag) return;
  clearTimeout(flagTimer);
  flag.textContent = txt;
  flag.className = 'sync-flag ' + (cls || '');
  if(cls === 'ok') flagTimer = setTimeout(function(){ flag.textContent = ''; flag.className = 'sync-flag'; }, 2600);
}

/* ---------- Firebase efface les tableaux vides : on remet tout d'aplomb ---------- */
function tab(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    var k = Object.keys(x).sort(function(a,b){ return a - b; }), o = [];
    for(var i = 0; i < k.length; i++) o.push(x[k[i]]);
    return o;
  }
  return [];
}

/* ---------- lecture initiale : cache local, puis la base fait autorité ---------- */
function charger(){
  try{
    var brut = localStorage.getItem(CACHE);
    if(brut){ data = normaliser(JSON.parse(brut)); }
  }catch(e){}
  if(!data) data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
}
function cacher(){
  try{ localStorage.setItem(CACHE, JSON.stringify(data)); }catch(e){}
}

/* ---------- écriture groupée ---------- */
var tmr = null, sale = false;
function sauver(){
  sale = true;
  etat('modifié', 'pending');
  cacher();
  clearTimeout(tmr);
  tmr = setTimeout(ecrire, 900);
}
function ecrire(){
  if(!refData){ etat('hors ligne', 'err'); return; }
  etat('envoi…', 'pending');
  refData.set({ payload: data, at: Date.now(), par: CLIENT }).then(function(){
    sale = false;
    etat('enregistré', 'ok');
  }).catch(function(e){
    console.warn('Écriture échouée :', e);
    etat('échec réseau', 'err');
    clearTimeout(tmr);
    tmr = setTimeout(ecrire, 4000);
  });
}

/* ---------- écoute en direct ---------- */
var enAttente = null;
function enEdition(){
  var a = document.activeElement;
  return !!(a && a.isContentEditable);
}
function appliquer(p){
  data = normaliser(p);
  cacher();
  rendre();
  etat('à jour', 'ok');
}
if(refData){
  refData.on('value', function(sn){
    var v = sn.val();
    if(!v || !v.payload) return;
    if(v.par === CLIENT) return;
    if(sale || enEdition()){ enAttente = v.payload; return; }
    appliquer(v.payload);
  }, function(e){ console.warn('Lecture impossible :', e); etat('hors ligne', 'err'); });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(enAttente && !sale && !enEdition()){ var p = enAttente; enAttente = null; appliquer(p); }
  }, 300);
});

/* ---------- publication du fichier vers la base ---------- */
function pousserFichier(){
  if(!refData){ alert('Hors ligne : publication impossible.'); return; }
  if(!confirm(
    'Publier la version du fichier vers la base ?\n\n' +
    'Tout ce qui a été modifié en ligne sans être réintégré au fichier sera remplacé.\n' +
    "L'état actuel de la base est sauvegardé avant écriture."
  )) return;
  var b = document.getElementById('b-push');
  if(b) b.setAttribute('disabled', 'disabled');
  etat('sauvegarde…', 'pending');
  refData.once('value').then(function(sn){
    var avant = sn.val();
    if(!avant || !refSave) return null;
    return refSave.child(String(Date.now())).set(avant);
  }).catch(function(e){ console.warn('Sauvegarde impossible :', e); })
  .then(function(){
    etat('publication…', 'pending');
    data = normaliser(JSON.parse(JSON.stringify(DEFAUT)));
    return refData.set({ payload: data, at: Date.now(), par: CLIENT });
  }).then(function(){
    sale = false;
    cacher();
    rendre();
    if(b) b.removeAttribute('disabled');
    etat('publié', 'ok');
  }).catch(function(e){
    console.warn('Publication échouée :', e);
    if(b) b.removeAttribute('disabled');
    etat('publication refusée', 'err');
  });
}


/* ---------- remise en forme après lecture ---------- */
function normaliser(d){
  if(!d || typeof d !== 'object') return JSON.parse(JSON.stringify(DEFAUT));
  d.intro = d.intro || '';
  d.sections = tab(d.sections);
  for(var i = 0; i < d.sections.length; i++){
    var s = d.sections[i];
    s.kind = s.kind || 'texte';
    s.title = s.title || '';
    s.note = s.note || '';
    s.foot = s.foot || '';
    if(s.kind === 'table'){
      s.cols = tab(s.cols);
      s.rows = tab(s.rows);
      for(var r = 0; r < s.rows.length; r++){
        s.rows[r] = s.rows[r] || {};
        s.rows[r].c = tab(s.rows[r].c);
        s.rows[r].off = !!s.rows[r].off;
      }
    } else {
      s.items = tab(s.items);
    }
  }
  d.legend = tab(d.legend);
  for(var l = 0; l < d.legend.length; l++){
    d.legend[l] = d.legend[l] || {};
    d.legend[l].term = d.legend[l].term || '';
    d.legend[l].def = d.legend[l].def || '';
    d.legend[l].off = !!d.legend[l].off;
  }
  return d;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classeCol(nom){
  var n = (nom || '').toLowerCase();
  if(n.indexOf('enc') === 0 || n.indexOf('dr') === 0 || n.indexOf('éch') === 0 || n.indexOf('serv') === 0) return 'c';
  return '';
}

function rendre(){
  var h = '';
  h += '<div class="intro" contenteditable data-t="intro">' + esc(data.intro || '') + '</div>';

  for(var si = 0; si < data.sections.length; si++){
    var s = data.sections[si];
    var n = (s.kind === 'table') ? s.rows.length : s.items.length;
    h += '<div class="sec" data-s="' + si + '">';
    h += '<div class="sechead">';
    h +=   '<button data-a="fold">▾</button>';
    h +=   '<span class="t" contenteditable data-t="st" data-s="' + si + '">' + esc(s.title) + '</span>';
    h +=   '<span class="n">' + n + '</span>';
    h +=   '<button data-a="up">↑</button><button data-a="down">↓</button>';
    h +=   '<button data-a="delsec">Supprimer</button>';
    h += '</div>';
    h += '<div class="snote" contenteditable data-t="sn" data-s="' + si + '">' + esc(s.note || '') + '</div>';
    h += '<div class="secbody">';

    var PIED = s.foot || s.foot === '' ? '<div class="sfoot" contenteditable data-t="sf" data-s="' + si + '">' + esc(s.foot || '') + '</div>' : '';
    if(s.kind === 'table'){
      h += '<table><thead><tr>';
      for(var ci = 0; ci < s.cols.length; ci++)
        h += '<th contenteditable data-t="col" data-s="' + si + '" data-c="' + ci + '">' + esc(s.cols[ci]) + '</th>';
      h += '<th></th></tr></thead><tbody>';
      for(var ri = 0; ri < s.rows.length; ri++){
        var r = s.rows[ri];
        h += '<tr' + (r.off ? ' class="off"' : '') + ' data-r="' + ri + '">';
        for(var k = 0; k < s.cols.length; k++){
          var mot = (s.cols[k] || '').toLowerCase();
          var cle = (mot.indexOf('atout') === 0 || mot.indexOf('mots') >= 0 || mot.indexOf('effet') === 0) ? ' data-atout="1"' : '';
          h += '<td class="' + classeCol(s.cols[k]) + '" contenteditable data-t="cell" data-lab="' + esc(s.cols[k]) +
               '" data-s="' + si +
               '" data-r="' + ri + '" data-c="' + k + '"' + cle + '>' + esc(r.c[k] === undefined ? '' : r.c[k]) + '</td>';
        }
        h += '<td class="acts"><button data-a="off" title="Ligne du livre">★</button>' +
             '<button data-a="dup" title="Dupliquer">⧉</button>' +
             '<button data-a="del" title="Supprimer">✕</button></td></tr>';
      }
      h += '</tbody></table>' + PIED + '<button class="addrow" data-a="addrow">+ Ligne</button>';
    } else {
      h += '<div class="items">';
      for(var ii = 0; ii < s.items.length; ii++){
        h += '<div class="item" data-i="' + ii + '"><span class="puce">◆</span>' +
             '<div class="txt" contenteditable data-t="item" data-s="' + si + '" data-i="' + ii + '">' + esc(s.items[ii]) + '</div>' +
             '<span class="acts"><button data-a="upitem">↑</button><button data-a="delitem">✕</button></span></div>';
      }
      h += '</div>' + PIED + '<button class="addrow" data-a="additem">+ Paragraphe</button>';
    }
    h += '</div>';
    h += '</div>';
  }

  if(data.legend && data.legend.length){
    h += '<h2 class="bloc">Légende</h2><div class="legwrap">';
    for(var li = 0; li < data.legend.length; li++){
      var L = data.legend[li];
      h += '<div class="leg ' + (L.off ? 'of' : 'mai') + '" data-l="' + li + '">';
      h += '<span class="acts2"><button data-a="legoff">★</button><button data-a="legdel">✕</button></span>';
      h += '<span class="term" contenteditable data-t="lt" data-l="' + li + '">' + esc(L.term) + '</span>. ';
      h += '<span class="df" contenteditable data-t="ld" data-l="' + li + '">' + esc(L.def) + '</span></div>';
    }
    h += '</div>';
  }
  h += '<p class="hint">Tout est modifiable : cliquer et écrire. Synchronisation automatique avec la base en ligne, sans rien à valider. Survoler une cellule d\'effet affiche les définitions reconnues.</p>';

  document.getElementById('app').innerHTML = h;
  indexerLegende();
}

document.addEventListener('input', function(e){
  var el = e.target, t = el.getAttribute('data-t');
  if(!t) return;
  var s = +el.getAttribute('data-s'), r = +el.getAttribute('data-r'),
      c = +el.getAttribute('data-c'), i = +el.getAttribute('data-i'), l = +el.getAttribute('data-l');
  var v = el.textContent;
  if(t === 'intro') data.intro = v;
  else if(t === 'st') data.sections[s].title = v;
  else if(t === 'sn') data.sections[s].note = v;
  else if(t === 'sf') data.sections[s].foot = v;
  else if(t === 'col') data.sections[s].cols[c] = v;
  else if(t === 'cell') data.sections[s].rows[r].c[c] = v;
  else if(t === 'item') data.sections[s].items[i] = v;
  else if(t === 'lt'){ data.legend[l].term = v; indexerLegende(); }
  else if(t === 'ld'){ data.legend[l].def = v; indexerLegende(); }
  sauver();
});

document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el.hasAttribute && el.hasAttribute('contenteditable')){
    if(el.classList && el.classList.contains('txt')) return; /* paragraphes : saut de ligne permis */
    e.preventDefault(); el.blur();
  }
});

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-a]') : null;
  if(!b) return;
  var a = b.getAttribute('data-a');
  var sec = b.closest('.sec'), tr = b.closest('tr'), it = b.closest('.item'), leg = b.closest('.leg');

  if(a === 'fold'){ sec.classList.toggle('closed'); return; }
  if(leg){
    var l = +leg.getAttribute('data-l');
    if(a === 'legdel'){ data.legend.splice(l,1); sauver(); rendre(); return; }
    if(a === 'legoff'){ data.legend[l].off = !data.legend[l].off; sauver(); rendre(); return; }
  }
  if(!sec) return;
  var si = +sec.getAttribute('data-s'), S = data.sections[si];

  if(a === 'addrow'){
    var vide = []; for(var i = 0; i < S.cols.length; i++) vide.push('');
    S.rows.push({c:vide, off:false}); sauver(); rendre(); return;
  }
  if(a === 'additem'){ S.items.push('Nouveau paragraphe.'); sauver(); rendre(); return; }
  if(a === 'delsec'){
    if(confirm('Supprimer la section « ' + S.title + ' » ?')){ data.sections.splice(si,1); sauver(); rendre(); }
    return;
  }
  if(a === 'up' || a === 'down'){
    var d = (a === 'up') ? -1 : 1, n = si + d;
    if(n >= 0 && n < data.sections.length){
      var tmp = data.sections[si]; data.sections[si] = data.sections[n]; data.sections[n] = tmp;
      sauver(); rendre();
    }
    return;
  }
  if(tr){
    var r = +tr.getAttribute('data-r');
    if(a === 'del'){ S.rows.splice(r,1); sauver(); rendre(); return; }
    if(a === 'dup'){ S.rows.splice(r+1,0, JSON.parse(JSON.stringify(S.rows[r]))); sauver(); rendre(); return; }
    if(a === 'off'){ S.rows[r].off = !S.rows[r].off; sauver(); rendre(); return; }
  }
  if(it){
    var ii = +it.getAttribute('data-i');
    if(a === 'delitem'){ S.items.splice(ii,1); sauver(); rendre(); return; }
    if(a === 'upitem' && ii > 0){
      var t2 = S.items[ii]; S.items[ii] = S.items[ii-1]; S.items[ii-1] = t2; sauver(); rendre(); return;
    }
  }
});

document.getElementById('b-tab').onclick = function(){
  var modele = null;
  for(var i = 0; i < data.sections.length; i++) if(data.sections[i].kind === 'table'){ modele = data.sections[i]; break; }
  data.sections.push({kind:'table', title:'Nouveau tableau', note:'', foot:'',
    cols: modele ? modele.cols.slice() : ['Objet','Coût','Disponibilité','Effet'], rows:[]});
  sauver(); rendre();
};
document.getElementById('b-txt').onclick = function(){
  data.sections.push({kind:'texte', title:'Nouvelle section', note:'', foot:'', items:['À rédiger.']});
  sauver(); rendre();
};
document.getElementById('b-leg').onclick = function(){
  if(!data.legend) data.legend = [];
  data.legend.push({off:false, term:'Nouveau mot-clé', def:'Définition.'});
  sauver(); rendre();
  var els = document.querySelectorAll('.leg .term');
  if(els.length) els[els.length-1].focus();
};
document.getElementById('b-fold').onclick = function(){
  var secs = document.querySelectorAll('.sec');
  var fermer = !document.querySelector('.sec.closed');
  for(var i = 0; i < secs.length; i++) secs[i].classList.toggle('closed', fermer);
  this.textContent = fermer ? 'Déplier tout' : 'Replier tout';
};
document.getElementById('b-print').onclick = function(){ window.print(); };
document.getElementById('b-push').onclick = pousserFichier;

document.getElementById('q').oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = document.querySelectorAll('.sec');
  for(var i = 0; i < secs.length; i++){
    var lignes = secs[i].querySelectorAll('tbody tr, .item'), vis = 0;
    for(var j = 0; j < lignes.length; j++){
      var ok = !q || lignes[j].textContent.toLowerCase().indexOf(q) >= 0;
      lignes[j].classList.toggle('hid', !ok);
      if(ok) vis++;
    }
    var titreOk = secs[i].querySelector('.sechead .t').textContent.toLowerCase().indexOf(q) >= 0;
    secs[i].classList.toggle('hid', !!q && vis === 0 && !titreOk);
  }
  var legs = document.querySelectorAll('.leg');
  for(var k = 0; k < legs.length; k++)
    legs[k].classList.toggle('hid', !!q && legs[k].textContent.toLowerCase().indexOf(q) < 0);
};

/* ======================= INFOBULLES DE LÉGENDE ======================= */
var IDX = [];               /* [{cle, terme, entree}] trié du plus long au plus court */
function normal(t){
  return String(t).toLowerCase()
    .replace(/\s*\(.*?\)\s*/g, ' ')      /* Bénie (X) -> benie */
    .replace(/\s+[\dx×]+\s*$/, '')       /* Recharge 3 et Addictive X -> recharge, addictive */
    .replace(/[.,;:!?]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function indexerLegende(){
  IDX = [];
  if(!data.legend) return;
  for(var i = 0; i < data.legend.length; i++){
    var cle = normal(data.legend[i].term);
    if(cle.length > 2) IDX.push({cle: cle, entree: data.legend[i]});
  }
  IDX.sort(function(a, b){ return b.cle.length - a.cle.length; });
}

/* Reconnaît les mots-clés d'une cellule, par segment puis par occurrence dans la phrase. */
function definitions(texte){
  var trouve = [], vus = {};
  function pousser(E){
    if(!vus[E.term]){ vus[E.term] = 1; trouve.push(E); }
  }
  var segments = String(texte).split(/[,;.•·]/);
  for(var s = 0; s < segments.length; s++){
    for(var i = 0; i < IDX.length; i++){
      if(normal(segments[s]) === IDX[i].cle){ pousser(IDX[i].entree); break; }
    }
  }
  var plat = ' ' + normal(texte) + ' ';
  for(var j = 0; j < IDX.length; j++){
    if(IDX[j].cle.length < 5) continue;                 /* trop court : trop de faux positifs */
    if(plat.indexOf(' ' + IDX[j].cle) >= 0) pousser(IDX[j].entree);
  }
  return trouve;
}

var tip = document.getElementById('tip');
function cacherTip(){ tip.style.display = 'none'; }
function montrerTip(cible){
  if(!cible || document.activeElement === cible){ cacherTip(); return; }
  var liste = definitions(cible.textContent);
  if(!liste.length){ cacherTip(); return; }
  var out = '';
  for(var i = 0; i < liste.length && i < 6; i++)
    out += '<p><b>' + esc(liste[i].term) + '.</b> ' + esc(liste[i].def) + '</p>';
  tip.innerHTML = out;
  tip.style.display = 'block';
  var r = cible.getBoundingClientRect();
  var top = r.bottom + 6;
  if(top + tip.offsetHeight > window.innerHeight) top = Math.max(6, r.top - tip.offsetHeight - 6);
  tip.style.top = top + 'px';
  tip.style.left = Math.min(Math.max(6, r.left), window.innerWidth - tip.offsetWidth - 12) + 'px';
}
function cibleTip(e){
  if(!e.target.closest) return null;
  return e.target.closest('td[data-t="cell"], .item .txt, .sfoot, .snote');
}
document.addEventListener('mouseover', function(e){ montrerTip(cibleTip(e)); });
document.addEventListener('mouseout', function(e){ if(cibleTip(e)) cacherTip(); });
document.addEventListener('scroll', cacherTip, true);
document.addEventListener('focusin', cacherTip);

charger();
rendre();
</script>
